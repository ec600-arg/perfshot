<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERF SHOT — Shooting Performance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy:#0B1C2D;--navy-2:#132638;--navy-3:#1E3A54;
  --green:#1D9E75;--green-l:#5DCAA5;--green-dim:rgba(29,158,117,.12);
  --blue:#4DB8FF;--blue-dim:rgba(77,184,255,.10);
  --red:#E8462A;--red-dim:rgba(232,70,42,.10);
  --gold:#EF9F27;--fog:#F0F7FF;--fog-2:#E3EEF9;
  --text:#0B1C2D;--text-2:#4A6278;--text-3:#8BA5BB;
  --border:rgba(11,28,45,.10);--border-2:rgba(11,28,45,.06);
  --radius:12px;--radius-sm:8px;
  --mono:'DM Mono',monospace;--display:'Syne',sans-serif;--body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--fog);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.app{display:flex;min-height:100vh}
.sidebar{width:210px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:22px 18px 16px;border-bottom:1px solid var(--navy-3)}
.logo-wm{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:.04em;color:#fff}
.logo-wm span{color:var(--green)}
.logo-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6B8FAF;margin-top:2px}
.sidebar-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav-sec{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#3A5570;padding:8px 8px 3px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:#6B8FAF;font-size:12px;border:none;background:none;width:100%;text-align:left;transition:background .15s}
.nav-item:hover{background:var(--navy-2);color:#9DBDD4}
.nav-item.active{background:var(--green-dim);color:var(--green-l)}
.nav-badge{margin-left:auto;font-size:9px;font-family:var(--mono);background:var(--green-dim);color:var(--green-l);padding:1px 5px;border-radius:20px}
.sidebar-user{padding:12px 14px;border-top:1px solid var(--navy-3);display:flex;align-items:center;gap:9px;cursor:pointer}
.user-av{width:32px;height:32px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.user-nm{font-size:12px;font-weight:500;color:#9DBDD4}
.user-rl{font-size:10px;color:#3A5570}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:var(--display);font-size:15px;font-weight:600}
.content{padding:24px 28px;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);font-family:var(--body);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:#189060}
.btn-secondary{background:transparent;color:var(--text-2);border:1px solid var(--border)}.btn-secondary:hover{background:var(--fog-2)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn-icon{padding:7px;border-radius:var(--radius-sm);background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text-2);transition:all .15s;display:inline-flex;align-items:center}
.btn-icon:hover{background:var(--fog-2)}
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:18px}
.card-title{font-family:var(--display);font-size:13px;font-weight:600}
.card-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-val{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.stat-val .dec{font-size:13px;color:var(--green)}
.stat-lbl{font-size:10px;color:var(--text-3);margin-top:3px}
.stat-delta{font-size:10px;margin-top:4px;font-family:var(--mono)}
.delta-up{color:var(--green)}.delta-down{color:var(--red)}.delta-neutral{color:var(--text-3)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.ai-insight{background:linear-gradient(135deg,var(--green-dim),var(--blue-dim));border:1px solid rgba(29,158,117,.2);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.ai-icon{width:28px;height:28px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff}
.ai-text{font-size:12px;color:var(--text);line-height:1.6}
.ai-text strong{color:var(--green);font-weight:500}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-blue{background:var(--blue-dim);color:#185FA5}
.badge-gold{background:rgba(239,159,39,.12);color:#8a5a00}
.badge-gray{background:var(--fog-2);color:var(--text-2)}
.badge-red{background:var(--red-dim);color:var(--red)}
.sparkline{display:flex;align-items:flex-end;gap:3px;height:48px;margin-bottom:8px}
.spark-bar{flex:1;border-radius:3px 3px 0 0;background:var(--green-dim);cursor:pointer}
.spark-bar:hover,.spark-bar.hi{background:var(--green)}
table{width:100%;border-collapse:collapse}
th{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border-2);font-size:12px;color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--fog-2)}
.form-grid{display:grid;gap:12px}
.form-grid-2{grid-template-columns:1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:10px;font-weight:500;color:var(--text-2);letter-spacing:.04em;text-transform:uppercase}
.form-input,.form-select,.form-textarea{padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--fog);font-family:var(--body);font-size:12px;color:var(--text);width:100%;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--green-dim)}
.form-textarea{resize:vertical;min-height:70px}
.tabs{display:flex;border-bottom:2px solid var(--border-2);margin-bottom:16px}
.tab{padding:8px 14px;font-size:12px;font-weight:500;color:var(--text-3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:var(--body)}
.tab:hover{color:var(--text-2)}.tab.active{color:var(--green);border-bottom-color:var(--green)}
.modal-ov{position:fixed;inset:0;background:rgba(11,28,45,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;animation:mIn .18s ease}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-hd{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1;border-radius:14px 14px 0 0}
.modal-title{font-family:var(--display);font-size:14px;font-weight:600}
.modal-body{padding:16px 20px}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.equip-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:box-shadow .15s}
.equip-card:hover{box-shadow:0 4px 16px rgba(11,28,45,.08)}
.equip-icon{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ammo-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stars{display:flex;gap:1px}
.star{font-size:13px;cursor:pointer}.star.on{color:var(--gold)}.star.off{color:var(--border)}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--fog)}
.upload-zone:hover{border-color:var(--green);background:var(--green-dim)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty-title{font-family:var(--display);font-size:13px;font-weight:600;color:var(--text-2);margin:8px 0 4px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:12px;z-index:999;animation:mIn .2s ease;display:flex;align-items:center;gap:8px}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.spinner{width:16px;height:16px;border:2px solid var(--green-dim);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);flex-direction:column;gap:16px}
.loading-logo{font-family:var(--display);font-size:32px;font-weight:800;color:#fff;letter-spacing:.05em}
.loading-logo span{color:var(--green)}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);background-image:radial-gradient(circle at 20% 80%,rgba(29,158,117,.08),transparent 60%),radial-gradient(circle at 80% 20%,rgba(77,184,255,.05),transparent 60%)}
.auth-card{width:100%;max-width:380px;padding:36px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.auth-lm{font-family:var(--display);font-size:30px;font-weight:800;color:#fff;text-align:center;letter-spacing:.05em}
.auth-lm span{color:var(--green)}
.auth-ls{font-size:10px;letter-spacing:.15em;color:#6B8FAF;text-transform:uppercase;text-align:center;margin-top:2px;margin-bottom:24px}
.auth-title{font-family:var(--display);font-size:16px;font-weight:600;color:#fff;margin-bottom:3px}
.auth-sub{font-size:12px;color:#6B8FAF;margin-bottom:18px}
.auth-input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-family:var(--body);font-size:13px;margin-bottom:8px}
.auth-input::placeholder{color:#3A5570}
.auth-input:focus{outline:none;border-color:var(--green)}
.auth-btn{width:100%;padding:11px;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-family:var(--display);font-size:13px;font-weight:700;border:none;cursor:pointer;margin-top:4px;transition:background .15s}
.auth-btn:hover{background:#189060}
.auth-err{background:var(--red-dim);color:var(--red);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:10px;border:1px solid rgba(232,70,42,.2)}
.auth-sw{text-align:center;margin-top:16px;font-size:12px;color:#3A5570}
.auth-sw a{color:var(--green-l);cursor:pointer}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.role-card{padding:14px;border-radius:var(--radius-sm);border:2px solid rgba(255,255,255,.08);cursor:pointer;transition:all .15s;text-align:center}
.role-card:hover,.role-card.sel{border-color:var(--green);background:var(--green-dim)}
.role-card-n{font-size:12px;font-weight:500;color:#9DBDD4;margin-top:4px}
.role-card.sel .role-card-n{color:var(--green-l)}
.coming{background:#fff;border:1px solid var(--border);border-radius:var(--radius);min-height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:32px;text-align:center}
.coming-title{font-family:var(--display);font-size:14px;font-weight:600;color:var(--text-2)}
.coming-sub{font-size:12px;color:var(--text-3);max-width:280px;line-height:1.6}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-muted{color:var(--text-3)}
.text-green{color:var(--green)}.text-mono{font-family:var(--mono)}
.w-full{width:100%}
@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.stat-grid{grid-template-columns:1fr 1fr}.grid-2,.grid-3{grid-template-columns:1fr}.form-grid-2{grid-template-columns:1fr}}
</style>

<body>
<div id="app"></div>

<script>
// ── SUPABASE CONFIG ──────────────────────────────────────────
const SUPABASE_URL = 'https://gdqpdqbkqxxmynbnanym.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcXBkcWJrcXh4bXluYm5hbnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyOTk4MjEsImV4cCI6MjA5MDg3NTgyMX0.auOXAocvt5jSgBRIi_l4oaFDFIFg-HxRgPdrdw_iPg4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── STATE ────────────────────────────────────────────────────
let state = { user: null, profile: null, page: 'home', loading: true, toast: null };
let weapons = [], ammos = [], sessions = [];

// ── RENDER ENGINE ────────────────────────────────────────────
function render() { document.getElementById('app').innerHTML = getHTML(); bindEvents(); }

function showToast(msg, type = 'success') {
  state.toast = { msg, type };
  render();
  setTimeout(() => { state.toast = null; render(); }, 3000);
}

// ── AUTH ─────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    state.user = session.user;
    await loadProfile();
    await loadData();
  }
  state.loading = false;
  render();

  sb.auth.onAuthStateChange(async (event, session) => {
    state.user = session?.user || null;
    if (state.user) { await loadProfile(); await loadData(); }
    else { state.profile = null; weapons = []; ammos = []; sessions = []; }
    render();
  });
}

async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  state.profile = data;
}

async function loadData() {
  const uid = state.user.id;
  const [w, a, s] = await Promise.all([
    sb.from('weapons').select('*').eq('athlete_id', uid).order('created_at', { ascending: false }),
    sb.from('ammo_lots').select('*').eq('athlete_id', uid).order('created_at', { ascending: false }),
    sb.from('sessions').select('*').eq('athlete_id', uid).order('date', { ascending: false }).limit(20),
  ]);
  weapons = w.data || [];
  ammos   = a.data || [];
  sessions = s.data || [];
}

async function signIn(email, pass) {
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return error.message;
  return null;
}

async function signUp(email, pass, name, role) {
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if (error) return error.message;
  if (data.user) {
    await sb.from('profiles').insert({
      id: data.user.id, full_name: name, email, role,
      disciplines: ['10m_pistola_aire_m']
    });
  }
  return null;
}

async function signOut() { await sb.auth.signOut(); state.page = 'home'; render(); }

// ── DATA OPS ─────────────────────────────────────────────────
async function addWeapon(form) {
  const { error } = await sb.from('weapons').insert({ ...form, athlete_id: state.user.id });
  if (!error) { await loadData(); showToast('Arma guardada ✓'); }
  else showToast(error.message, 'error');
}

async function addAmmo(form) {
  const { error } = await sb.from('ammo_lots').insert({ ...form, athlete_id: state.user.id });
  if (!error) { await loadData(); showToast('Lote guardado ✓'); }
  else showToast(error.message, 'error');
}

async function updateProfile(form) {
  const { error } = await sb.from('profiles').update(form).eq('id', state.user.id);
  if (!error) { await loadProfile(); showToast('Perfil actualizado ✓'); }
  else showToast(error.message, 'error');
}

// ── HELPERS ──────────────────────────────────────────────────
const initials = (name) => name ? name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase() : 'PS';
const scoreColor = (s) => s >= 585 ? 'var(--green)' : s >= 570 ? 'var(--text)' : 'var(--red)';
const avg = (arr, key) => arr.length ? Math.round(arr.reduce((a,b) => a + (b[key]||0), 0) / arr.length * 10) / 10 : 0;

// ── SVG ICONS ────────────────────────────────────────────────
const ico = {
  home:   `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>`,
  target: `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
  chart:  `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
  gun:    `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="1" y="9" width="13" height="5" rx="1.5"/><rect x="14" y="10" width="5" height="3" rx="1"/><line x1="4" y1="9" x2="4" y2="7"/><line x1="4" y1="7" x2="8" y2="7"/></svg>`,
  bullet: `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><ellipse cx="12" cy="17" rx="5" ry="3.5"/><path d="M7 17V10Q7 4 12 4T17 10V17"/></svg>`,
  cal:    `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>`,
  users:  `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3a4 4 0 010 8"/><path d="M21 21v-2a4 4 0 00-3-4"/></svg>`,
  user:   `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20v-1a8 8 0 0116 0v1"/></svg>`,
  plus:   `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  x:      `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,

function getPageHTML() {
  switch(state.page) {

function getDashboardHTML() {
  const scores = sessions.map(s => s.total_score || 0).filter(s => s > 0);
  const avgScore = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '—';
  const best = scores.length ? Math.max(...scores) : '—';
  const [intPart, decPart] = String(avgScore).split('.');
  return `
  <div class="ai-insight">
    <div class="ai-icon">${ico.ai}</div>
    <div class="ai-text">
      <strong>PERF AI:</strong> ${sessions.length > 0
        ? `Tenés ${sessions.length} sesiones registradas. Promedio: <strong>${avgScore}</strong>. Comenzá cargando sesiones para obtener análisis detallados de tu rendimiento.`
        : `Bienvenido a PERF SHOT. Comenzá registrando tus armas y tu primera sesión de entrenamiento para que la IA pueda analizar tu rendimiento.`
      }
    </div>
  </div>
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-val">${intPart}${decPart?`<span class="dec">.${decPart}</span>`:''}</div>
      <div class="stat-lbl">Promedio sesiones</div>
      <div class="stat-delta delta-neutral">últimas ${sessions.length} sesiones</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${best}</div>
      <div class="stat-lbl">Mejor serie</div>
      <div class="stat-delta delta-up">${best !== '—' ? '★ record personal' : 'sin datos aún'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${sessions.length}</div>
      <div class="stat-lbl">Sesiones totales</div>
      <div class="stat-delta delta-neutral">${sessions.filter(s=>s.type==='competition').length} competencias</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${weapons.length}</div>
      <div class="stat-lbl">Armas registradas</div>
      <div class="stat-delta delta-neutral">${ammos.length} lotes de munición</div>
    </div>
  </div>
  <div class="grid-2 mb-16">
    <div class="card">
      <div class="card-title mb-12">Evolución de puntaje</div>
      ${scores.length > 1 ? `
        <div class="sparkline">
          ${[...scores].reverse().map((s,i) => {
            const min = Math.min(...scores), max = Math.max(...scores);
            const h = max > min ? ((s-min)/(max-min))*80+20 : 50;
            return `<div class="spark-bar ${i===scores.length-1?'hi':''}" style="height:${h}%" title="${s}"></div>`;
          }).join('')}
        </div>
        <div class="flex justify-between text-xs text-muted text-mono">
          <span>Min: ${Math.min(...scores)}</span><span>Avg: ${avgScore}</span><span>Max: ${best}</span>
        </div>` : `<div class="empty-state" style="padding:20px"><div class="empty-title">Sin datos aún</div><div class="text-xs text-muted">Registrá sesiones para ver tu evolución</div></div>`}
    </div>
    <div class="card">
      <div class="card-title mb-12">Últimas sesiones</div>
      ${sessions.length ? sessions.slice(0,4).map(s => `
        <div class="flex items-center justify-between mb-8">
          <div>
            <div class="text-sm" style="font-weight:500">${s.date}</div>
            <div class="text-xs text-muted">${s.type==='competition'?'Competencia':'Entrenamiento'} · ${s.discipline?.replace(/_/g,' ')}</div>
          </div>
          <span style="font-family:var(--display);font-size:16px;font-weight:700;color:${scoreColor(s.total_score)}">${s.total_score||'—'}</span>
        </div>`).join('')
      : `<div class="text-sm text-muted" style="padding:12px 0">Sin sesiones registradas aún.</div>`}
    </div>
  </div>
  ${sessions.length ? `
  <div class="card">
    <div class="card-title mb-12">Historial de sesiones</div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Disciplina</th><th>Puntaje</th><th>Disparos</th><th>Estado mental</th></tr></thead>
        <tbody>
          ${sessions.map(s=>`
          <tr>
            <td class="text-mono" style="font-size:11px">${s.date}</td>
            <td><span class="badge ${s.type==='competition'?'badge-gold':'badge-blue'}">${s.type==='competition'?'Comp.':'Entren.'}</span></td>
            <td style="font-size:11px">${s.discipline?.replace(/_/g,' ')}</td>
            <td><span style="font-family:var(--display);font-weight:700;font-size:14px;color:${scoreColor(s.total_score)}">${s.total_score||'—'}</span></td>
            <td class="text-mono" style="font-size:11px">${s.total_shots||'—'}</td>
            <td style="font-family:var(--mono);font-size:11px;color:${(s.mental_state||0)>=8?'var(--green)':'var(--text-2)'}">${s.mental_state?s.mental_state+'/10':'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>` : ''}`;
}

// ── EVENT BINDING ─────────────────────────────────────────────
function bindEvents() {
  // Navigation
  document.querySelectorAll('[data-page]').forEach(el => {
    el.addEventListener('click', () => { state.page = el.dataset.page; render(); });
  });
  document.getElementById('go-profile')?.addEventListener('click', () => { state.page = 'profile'; render(); });
  document.getElementById('btn-signout')?.addEventListener('click', signOut);

  // Auth
  document.getElementById('btn-login')?.addEventListener('click', async () => {
    const email = document.getElementById('auth-email').value;
    const pass  = document.getElementById('auth-pass').value;
    if (!email || !pass) return;
    document.getElementById('btn-login').textContent = 'Entrando...';
    const err = await signIn(email, pass);
    if (err) document.getElementById('auth-inner').innerHTML = getLoginHTML(err);
  });

  document.getElementById('to-register')?.addEventListener('click', () => {
    document.getElementById('auth-inner').innerHTML = getRegisterHTML();
    bindEvents();
  });

  document.getElementById('to-login')?.addEventListener('click', () => {
    document.getElementById('auth-inner').innerHTML = getLoginHTML();
    bindEvents();
  });

  document.querySelectorAll('.role-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('sel'));
      card.classList.add('sel');
      document.getElementById('reg-role').value = card.dataset.role;
    });
  });

  document.getElementById('btn-register')?.addEventListener('click', async () => {
    const name  = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const pass  = document.getElementById('reg-pass').value;
    const role  = document.getElementById('reg-role').value;
    if (!name || !email || !pass) return;
    document.getElementById('btn-register').textContent = 'Creando cuenta...';
    const err = await signUp(email, pass, name, role);
    if (err) document.getElementById('auth-inner').innerHTML = getRegisterHTML(err);
  });

  // Modals
  document.getElementById('btn-add-weapon')?.addEventListener('click', () => { activeModal = 'weapon'; render(); });
  document.getElementById('btn-add-ammo')?.addEventListener('click',   () => { activeModal = 'ammo';   render(); });
  document.getElementById('close-modal')?.addEventListener('click',    () => { activeModal = null;     render(); });
  document.getElementById('close-modal-2')?.addEventListener('click',  () => { activeModal = null;     render(); });
  document.getElementById('modal-ov')?.addEventListener('click', (e) => { if (e.target.id === 'modal-ov') { activeModal = null; render(); } });

  // Save weapon
  document.getElementById('btn-save-weapon')?.addEventListener('click', async () => {
    const brand = document.getElementById('w-brand').value;
    const model = document.getElementById('w-model').value;
    if (!brand || !model) { showToast('Marca y modelo son obligatorios', 'error'); return; }
    activeModal = null;
    await addWeapon({
      type: document.getElementById('w-type').value,
      brand, model,
      serial:  document.getElementById('w-serial').value,
      caliber: document.getElementById('w-caliber').value,
      year:    parseInt(document.getElementById('w-year').value) || null,
      notes:   document.getElementById('w-notes').value,
    });
  });

  // Save ammo
  document.getElementById('btn-save-ammo')?.addEventListener('click', async () => {
    const brand = document.getElementById('a-brand').value;
    const lot   = document.getElementById('a-lot').value;
    if (!brand || !lot) { showToast('Marca y lote son obligatorios', 'error'); return; }
    activeModal = null;
    await addAmmo({
      brand, lot_number: lot,
      model:    document.getElementById('a-model').value,
      caliber:  document.getElementById('a-caliber').value,
      quantity: parseInt(document.getElementById('a-qty').value) || 0,
      rating:   parseInt(document.getElementById('a-rating').value) || null,
      comment:  document.getElementById('a-comment').value,
    });
  });

  // Rating stars
  document.querySelectorAll('#rating-stars .star').forEach(star => {
    star.addEventListener('click', () => {
      const r = parseInt(star.dataset.r);
      document.getElementById('a-rating').value = r;
      document.querySelectorAll('#rating-stars .star').forEach((s,i) => {
        s.className = `star ${i < r ? 'on' : 'off'}`;
      });
    });
  });

  // Save profile
  document.getElementById('btn-save-profile')?.addEventListener('click', async () => {
    await updateProfile({
      full_name: document.getElementById('prf-name').value,
      club:      document.getElementById('prf-club').value,
      category:  document.getElementById('prf-cat').value,
    });
  });
}

// ── BOOT ──────────────────────────────────────────────────────
init();
</script>
</body>
</html>
