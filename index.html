<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERF SHOT — Shooting Performance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0B1C2D;--navy2:#132638;--navy3:#1E3A54;
  --green:#1D9E75;--greenl:#5DCAA5;--greend:rgba(29,158,117,.10);
  --blue:#4DB8FF;--blued:rgba(77,184,255,.08);
  --red:#E8462A;--redd:rgba(232,70,42,.08);
  --gold:#EF9F27;--goldd:rgba(239,159,39,.10);
  --fog:#F4F7FB;--fog2:#EBF0F7;--white:#fff;
  --t:#0B1C2D;--t2:#4A6278;--t3:#8BA5BB;
  --b:rgba(11,28,45,.08);--b2:rgba(11,28,45,.04);
  --r:12px;--rs:8px;--sh:0 1px 3px rgba(11,28,45,.07);
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--fog);color:var(--t);min-height:100vh;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
.app{display:flex;min-height:100vh}
/* SIDEBAR */
.sb{width:210px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:20px 16px 14px;border-bottom:1px solid var(--navy3)}
.sb-wm{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:.04em;color:#fff}
.sb-wm span{color:var(--green)}
.sb-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6B8FAF;margin-top:2px}
.sb-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.sb-sec{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#3A5570;padding:8px 8px 3px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:#6B8FAF;font-size:12px;border:none;background:none;width:100%;text-align:left;transition:background .15s}
.sb-item:hover{background:var(--navy2);color:#9DBDD4}
.sb-item.on{background:rgba(29,158,117,.15);color:var(--greenl)}
.sb-badge{margin-left:auto;font-size:9px;font-family:var(--mono);background:rgba(29,158,117,.2);color:var(--greenl);padding:1px 5px;border-radius:20px}
.sb-user{padding:12px 14px;border-top:1px solid var(--navy3);display:flex;align-items:center;gap:9px;cursor:pointer}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.sb-nm{font-size:12px;font-weight:500;color:#9DBDD4}
.sb-rl{font-size:10px;color:#3A5570}
/* MAIN */
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--b);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.tb-title{font-family:var(--disp);font-size:15px;font-weight:600}
.content{padding:20px 24px;flex:1}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);font-family:var(--body);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:#189060}
.btn-s{background:var(--white);color:var(--t2);border:1px solid var(--b)}.btn-s:hover{background:var(--fog)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-i{padding:7px;border-radius:var(--rs);background:var(--white);border:1px solid var(--b);cursor:pointer;color:var(--t2);transition:all .15s;display:inline-flex;align-items:center}
.btn-i:hover{background:var(--fog2)}
/* CARDS */
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--b);padding:18px;box-shadow:var(--sh)}
.ct{font-family:var(--disp);font-size:13px;font-weight:600}
/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.metric.m-green::before{background:var(--green)}
.metric.m-gold::before{background:var(--gold)}
.metric.m-blue::before{background:var(--blue)}
.metric.m-navy::before{background:var(--navy)}
.metric-val{font-family:var(--disp);font-size:28px;font-weight:800;color:var(--t);line-height:1;margin-bottom:3px}
.metric-val .dec{font-size:14px;color:var(--t3)}
.metric-lbl{font-size:10px;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.metric-delta{font-size:10px;font-family:var(--mono)}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--t3)}
/* DASH HERO */
.dash-hero{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh)}
.dash-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.dash-greet{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--t)}
.dash-greet span{color:var(--green)}
.dash-sub{font-size:12px;color:var(--t3);margin-top:4px}
.ai-badge{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--greend);border:1px solid rgba(29,158,117,.2);border-radius:20px;cursor:pointer;transition:all .15s}
.ai-badge:hover{background:rgba(29,158,117,.15)}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ai-badge-text{font-size:11px;font-weight:500;color:var(--green)}
/* CHART */
.chart-card{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.chart-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.chart-filters{display:flex;gap:4px;flex-wrap:wrap}
.cf{font-size:10px;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--b);background:var(--fog);color:var(--t3);font-family:var(--body);transition:all .15s}
.cf:hover{border-color:var(--green);color:var(--green)}
.cf.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cf.comp-on{background:var(--gold);color:#fff;border-color:var(--gold)}
.chart-legend{display:flex;gap:12px;margin-bottom:10px}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3)}
.leg-dot{width:8px;height:8px;border-radius:50%}
.bars{height:100px;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;border-radius:3px 3px 0 0;cursor:pointer;position:relative;min-width:6px;transition:opacity .15s}
.bar:hover{opacity:.8}
.bar-tip{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}
.bar:hover .bar-tip{opacity:1}
.chart-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:var(--t3);font-family:var(--mono)}
.chart-stats{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--b2)}
.cs-item{display:flex;flex-direction:column;gap:1px}
.cs-val{font-family:var(--disp);font-size:15px;font-weight:700}
.cs-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
/* AI CARD */
.ai-card{background:var(--white);border:1px solid rgba(29,158,117,.2);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px;position:relative;overflow:hidden}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue))}
.ai-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai-title{font-size:11px;font-weight:500;color:var(--green);letter-spacing:.06em;text-transform:uppercase}
.ai-body{font-size:12px;color:var(--t2);line-height:1.7}
.ai-body strong{color:var(--t);font-weight:500}
/* SESSIONS */
.sess-list{background:var(--white);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.sl-hd{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b2)}
.see-all{font-size:11px;color:var(--green);cursor:pointer;display:flex;align-items:center;gap:3px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--b2)}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--fog)}
.s-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.s-date{font-family:var(--mono);font-size:10px;color:var(--t3);min-width:76px}
.s-info{flex:1}
.s-disc{font-size:12px;font-weight:500}
.s-meta{font-size:10px;color:var(--t3);margin-top:1px}
.s-score{font-family:var(--disp);font-size:18px;font-weight:700;min-width:40px;text-align:right}
/* BOTTOM GRID */
.btm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.mini{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.mini-t{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mitem{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b2)}
.mitem:last-child{border-bottom:none}
.micon{width:30px;height:30px;border-radius:7px;background:var(--fog2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stars{display:flex;gap:1px}
.star{font-size:11px;cursor:pointer}.star.on{color:var(--gold)}.star.off{color:var(--b)}
.adv-card{background:var(--navy);border-radius:var(--r);padding:16px}
.adv-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.adv-title{font-family:var(--disp);font-size:13px;font-weight:600;color:#fff;margin-bottom:8px}
.adv-item{font-size:11px;color:#6B8FAF;display:flex;align-items:flex-start;gap:6px;margin-bottom:5px;line-height:1.4}
.adv-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px}
.adv-btn{width:100%;margin-top:10px;padding:9px;border-radius:var(--rs);background:var(--green);color:#fff;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--disp);transition:background .15s}
.adv-btn:hover{background:#189060}

/* ═══════════════════════════════════════════════════════
   WIZARD REDISEÑADO - 3 PASOS NUEVOS
═══════════════════════════════════════════════════════ */
.wizard{background:var(--white);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wiz-steps{display:flex;border-bottom:2px solid var(--b);background:var(--fog)}
.wstep{flex:1;padding:14px 16px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-2px}
.wstep.active{color:var(--green);background:var(--white);border-bottom-color:var(--green)}
.wstep.done{color:var(--green)}
.wstep-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--b);color:var(--t3);flex-shrink:0;transition:all .2s}
.wstep.active .wstep-num{background:var(--green);color:#fff}
.wstep.done .wstep-num{background:var(--greend);color:var(--green)}
.wiz-body{padding:24px}
.wiz-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--b);background:var(--fog)}

/* PASO 1: Disciplina + autocompletado */
.disc-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.disc-card{padding:12px;border-radius:var(--rs);border:2px solid var(--b);cursor:pointer;transition:all .15s;text-align:center}
.disc-card:hover{border-color:var(--green);background:var(--greend)}
.disc-card.on{border-color:var(--green);background:var(--greend)}
.disc-card-name{font-size:11px;font-weight:500;color:var(--t);margin-top:4px}
.disc-card-sub{font-size:9px;color:var(--t3);margin-top:1px}
.disc-card.on .disc-card-name{color:var(--green)}
.autocomplete-box{background:var(--fog2);border:1px solid rgba(29,158,117,.2);border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.ac-icon{width:32px;height:32px;border-radius:6px;background:var(--greend);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ac-text{flex:1}
.ac-label{font-size:10px;color:var(--green);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.ac-value{font-size:12px;font-weight:500;color:var(--t)}
.ac-edit{font-size:10px;color:var(--t3);cursor:pointer;text-decoration:underline}

/* PASO 2: Detalle del entrenamiento del día */
.day-plan{background:var(--fog);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid var(--b)}
.day-plan-ai{background:linear-gradient(135deg,rgba(29,158,117,.08),rgba(77,184,255,.05));border:1px solid rgba(29,158,117,.2);border-radius:var(--r);padding:16px;margin-bottom:14px}
.day-plan-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.day-plan-badge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:500}
.dp-ai{background:var(--greend);color:var(--green)}
.dp-coach{background:var(--blued);color:#185FA5}
.dp-manual{background:var(--fog2);color:var(--t2)}
.exercise-block{background:var(--white);border:1px solid var(--b);border-radius:var(--rs);padding:12px;margin-bottom:8px}
.ex-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ex-name{font-size:12px;font-weight:500}
.ex-shots{font-family:var(--mono);font-size:11px;color:var(--green)}
.ex-desc{font-size:11px;color:var(--t2);line-height:1.5}
.ex-focus{font-size:10px;color:var(--t3);margin-top:4px;font-style:italic}

/* Formulario editable de plan */
.plan-builder{border:1px solid var(--b);border-radius:var(--r);overflow:hidden}
.plan-builder-hd{background:var(--fog);padding:10px 14px;font-size:11px;font-weight:500;color:var(--t2);display:flex;align-items:center;justify-content:space-between}
.plan-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--b2)}
.plan-row:last-child{border-bottom:none}

/* PASO 3: Registro de resultados */
.wind-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.wind-card{padding:10px 8px;border-radius:var(--rs);border:2px solid var(--b);cursor:pointer;transition:all .15s;text-align:center}
.wind-card:hover,.wind-card.on{border-color:var(--green);background:var(--greend)}
.wind-icon{font-size:20px;margin-bottom:3px}
.wind-label{font-size:10px;font-weight:500;color:var(--t)}
.wind-card.on .wind-label{color:var(--green)}
.objective-check{display:flex;align-items:center;gap:12px;padding:14px;background:var(--fog);border-radius:var(--rs);cursor:pointer;border:2px solid var(--b);transition:all .15s;margin-bottom:14px}
.objective-check:hover{border-color:var(--green)}
.objective-check.yes{border-color:var(--green);background:var(--greend)}
.objective-check.no{border-color:var(--red);background:var(--redd)}
.obj-check-icon{width:28px;height:28px;border-radius:50%;border:2px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.objective-check.yes .obj-check-icon{border-color:var(--green);background:var(--green);color:#fff}
.objective-check.no .obj-check-icon{border-color:var(--red);background:var(--red);color:#fff}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;accent-color:var(--green)}
.range-val{font-family:var(--mono);font-size:13px;font-weight:500;min-width:32px;text-align:center}
.upload-zone{border:2px dashed var(--b);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--fog);position:relative;margin-bottom:10px}
.upload-zone:hover{border-color:var(--green);background:var(--greend)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone-icon{font-size:24px;margin-bottom:4px}
.upload-zone-text{font-size:12px;color:var(--t2);font-weight:500}
.upload-zone-sub{font-size:10px;color:var(--t3);margin-top:2px}
.file-uploaded{background:var(--greend);border:1px solid rgba(29,158,117,.2);border-radius:var(--rs);padding:8px 12px;font-size:11px;color:var(--green);display:flex;align-items:center;gap:6px;margin-top:4px}

/* SESSION DETAIL PAGE */
.sess-page{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sess-hdr{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh)}
.big-score{font-family:var(--disp);font-size:64px;font-weight:800;line-height:1}
.sess-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.ss-stat{background:var(--fog);border-radius:var(--rs);padding:10px 12px}
.ss-v{font-family:var(--disp);font-size:18px;font-weight:700}
.ss-l{font-size:10px;color:var(--t3);margin-top:1px;text-transform:uppercase;letter-spacing:.04em}
/* AI Analysis display */
.ai-analysis-card{background:var(--white);border:1px solid rgba(29,158,117,.15);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--sh)}
.aac-header{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:16px 20px;display:flex;align-items:center;gap:10px}
.aac-title{font-family:var(--disp);font-size:14px;font-weight:600;color:#fff}
.aac-sub{font-size:11px;color:#6B8FAF;margin-top:2px}
.aac-body{padding:20px}
.ai-section{margin-bottom:18px}
.ai-section-lbl{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.ai-point{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;padding:8px 10px;background:var(--fog);border-radius:var(--rs)}
.ai-point-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ai-point-content{flex:1}
.ai-point-title{font-size:12px;font-weight:500;color:var(--t);margin-bottom:2px}
.ai-point-detail{font-size:11px;color:var(--t2);line-height:1.5}
.next-sess-card{background:linear-gradient(135deg,var(--navy),#0F2A45);border-radius:var(--r);padding:18px;margin-bottom:16px}
.ns-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ns-badge{font-size:9px;padding:2px 8px;border-radius:20px;background:rgba(29,158,117,.2);color:var(--greenl);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.ns-title{font-family:var(--disp);font-size:15px;font-weight:700;color:#fff;margin-bottom:4px}
.ns-obj{font-size:12px;color:#9DBDD4;margin-bottom:12px}
.ns-blocks{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ns-block{background:rgba(255,255,255,.05);border-radius:var(--rs);padding:10px 12px;display:flex;align-items:center;gap:10px}
.ns-block-shots{font-family:var(--disp);font-size:16px;font-weight:700;color:var(--green);min-width:32px}
.ns-block-name{font-size:12px;font-weight:500;color:#fff}
.ns-block-foco{font-size:10px;color:#6B8FAF;margin-top:1px}
.ns-meta{display:flex;gap:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.ns-meta-item{font-size:10px;color:#6B8FAF;display:flex;align-items:center;gap:4px}

// ── INIT ─────────────────────────────────────────────────────
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){ST.user=session.user;await loadProfile();await loadData();}
  ST.loading=false;render();
  sb.auth.onAuthStateChange(async(e,s)=>{
    ST.user=s?.user||null;
    if(ST.user){await loadProfile();await loadData();}
    else{ST.profile=null;weapons=[];ammos=[];sessions=[];ST.calEvents=[];}
    render();
  });
}

async function loadProfile(){
  const{data}=await sb.from('profiles').select('*').eq('id',ST.user.id).single();
  ST.profile=data;
}

async function loadData(){
  const uid=ST.user.id;
  const[w,a,s,ce]=await Promise.all([
    sb.from('weapons').select('*').eq('athlete_id',uid).eq('active',true).order('created_at',{ascending:false}),
    sb.from('ammo_lots').select('*').eq('athlete_id',uid).order('rating',{ascending:false}),
    sb.from('sessions').select('*').eq('athlete_id',uid).order('date',{ascending:false}).limit(50),
    sb.from('calendar_events').select('*').eq('athlete_id',uid).order('date',{ascending:true}),
  ]);
  weapons=w.data||[];ammos=a.data||[];sessions=s.data||[];
  ST.calEvents=ce.data||[];

  // Buscar plan del día en calendario
  const today=new Date().toISOString().split('T')[0];
  ST.todayPlan=ST.calEvents.find(e=>e.date===today&&e.event_type==='training')||null;
}

// ── AUTH ─────────────────────────────────────────────────────
async function signIn(email,pass){const{error}=await sb.auth.signInWithPassword({email,password:pass});return error?.message||null}
async function signUp(email,pass,name,role){
  const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name,role}}});
  if(error)return error.message;
  if(data.user)await sb.from('profiles').upsert({id:data.user.id,full_name:name,email,role,disciplines:['10m_pistola_aire_m']});
  return null;
}
async function signOut(){await sb.auth.signOut();ST.page='home';render()}
async function ensureProfile(){
  if(!ST.profile){
    await sb.from('profiles').upsert({id:ST.user.id,email:ST.user.email,role:'athlete',full_name:ST.user.email.split('@')[0],disciplines:['10m_pistola_aire_m']});
    await loadProfile();
  }
}

// ── EDGE FUNCTIONS ───────────────────────────────────────────
async function callEdge(name,body){
  const{data:{session}}=await sb.auth.getSession();
  const res=await fetch(`${SURL}/functions/v1/${name}`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token}`},
    body:JSON.stringify(body)
  });
  return res.json();
}

async function analyzeSessionV2(sessionId,scattContent=null,targetPdfText=null){
  ST.aiLoading=true;ST.aiInsight=null;render();
  toast('Claude está analizando la sesión completa...','ok',10000);
  const r=await callEdge('analyze-session-v2',{session_id:sessionId,scatt_content:scattContent,target_pdf_text:targetPdfText});
  ST.aiLoading=false;
  if(r.session_analysis){
    ST.aiInsight=r;
    await loadData();// Recargar para ver el evento en el calendario
    toast('Análisis completo ✓ — próxima sesión asignada al calendario');
  } else {
    toast(r.error||'Error en el análisis','err');
  }
  render();
}

async function getTrainingPlan(){
  ST.advisorLoading=true;render();
  const r=await callEdge('training-advisor',{athlete_id:ST.user.id});
  ST.advisorLoading=false;
  if(r.plan){ST.trainingPlan=r.plan;await loadData();toast('Plan semanal generado ✓');}
  else toast(r.error||'Error','err');
  render();
}

    if(!error){const{data:pd}=sb.storage.from('targets').getPublicUrl(path);targetUrl=pd.publicUrl;}
  }

  const{data:sess,error}=await sb.from('sessions').insert({
    athlete_id:ST.user.id,
    type:d.type,discipline:d.discipline,
    date:d.date,weapon_id:d.weapon_id||null,ammo_lot_id:d.ammo_lot_id||null,

    scatt_file_url:scattUrl,
    target_photo_url:targetUrl,
    import_source:'wizard_v2',
  }).select().single();

  if(error){toast(error.message,'err');return;}

  await loadData();
  ST.page='session-detail';
  ST.selSession=sess.id;
  ST.aiInsight=null;

  // Disparar análisis IA automáticamente
  toast('Sesión guardada — Claude analizando en segundo plano...');

  // Leer archivos para enviar a la IA
  let scattContent=null,targetPdfText=null;
  if(d.scatt_file&&d.scatt_file.type==='text/plain'){
    scattContent=await d.scatt_file.text().catch(()=>null);
  }
  if(d.target_file&&d.target_file.type==='application/pdf'){
    targetPdfText='[PDF del blanco adjunto — analizar patrones de agrupación]';
  }

  render();
  // Análisis asíncrono
  analyzeSessionV2(sess.id,scattContent,targetPdfText);
}

// ── CHART ─────────────────────────────────────────────────────
function getChartData(){
  let d=[...sessions];
  if(ST.chartFilter!=='all'){
    const days={'1m':30,'3m':90,'6m':180,'12m':365}[ST.chartFilter];
    const cut=new Date();cut.setDate(cut.getDate()-days);
    d=d.filter(s=>new Date(s.date)>=cut);
  }
  if(ST.chartType==='training')d=d.filter(s=>s.type==='training');
  if(ST.chartType==='competition')d=d.filter(s=>s.type==='competition');
  return d.slice(0,40).reverse();
}

function getDefaultWeapon(discipline){
  // Mapear disciplina a tipo de arma

  const weaponsOfType=weapons.filter(w=>isPistol?w.type==='pistola':w.type==='rifle');
  return weaponsOfType[0]||weapons[0]||null;
}

function getDefaultAmmo(){
  // El lote con mejor rating
  return ammos[0]||null;// ya vienen ordenados por rating desc
}

  const diff=prevAvg?((s.total_score||0)-parseFloat(prevAvg)).toFixed(1):null;

// ── CALENDAR ────────────────────────────────────────────────────
function calendarHTML(){
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const m=ST.calMonth,y=ST.calYear;
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();
  const pad=n=>n<10?'0'+n:n;
  const eventsThisMonth=ST.calEvents.filter(e=>{const d=new Date(e.date+'T00:00:00');return d.getMonth()===m&&d.getFullYear()===y});
  const sessionsThisMonth=sessions.filter(s=>{const d=new Date(s.date+'T00:00:00');return d.getMonth()===m&&d.getFullYear()===y});
  const cells=[];
  const startOffset=(firstDay===0?6:firstDay-1);
  for(let i=0;i<startOffset;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);

  return`
<div class="flex ic jb mb16">
  <div class="flex ic gap12">
    <button class="btn-i" id="cal-prev">${I.back}</button>
    <div style="font-family:var(--disp);font-size:16px;font-weight:700">${months[m]} ${y}</div>
    <button class="btn-i" id="cal-next" style="transform:rotate(180deg)">${I.back}</button>
  </div>
  <button class="btn btn-p btn-sm" id="btn-add-event">${I.plus} Agregar evento</button>
</div>
<div class="card mb12">
  <div class="cal-header-row">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
  <div class="cal-grid">
    ${cells.map(d=>{
      if(!d)return`<div></div>`;
      const dateStr=`${y}-${pad(m+1)}-${pad(d)}`;
      const isToday=today.getDate()===d&&today.getMonth()===m&&today.getFullYear()===y;
      const daySess=sessionsThisMonth.filter(s=>s.date===dateStr);
      const dayEvts=eventsThisMonth.filter(e=>e.date===dateStr);
      return`<div class="cal-day ${isToday?'today':''}">
        <div class="cal-day-num" style="${isToday?'color:var(--green);font-weight:700':''}">${d}</div>
        ${daySess.map(s=>`<div class="cal-event ${s.type}">${s.total_score||'?'}</div>`).join('')}
        ${dayEvts.map(e=>`<div class="cal-event ${e.generated_by==='ai'?'ai-generated':e.event_type||'training'}">${e.title.substring(0,14)}</div>`).join('')}
      </div>`;
    }).join('')}
  </div>
</div>
<div class="card">
  <div class="ct mb12">Próximos eventos</div>
  ${[...ST.calEvents.filter(e=>new Date(e.date+'T00:00:00')>=today),...sessions.filter(s=>new Date(s.date+'T00:00:00')>=today)].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,6).map(item=>{
    const isSess='total_score'in item;
    const isAI=!isSess&&item.generated_by==='ai';
    return`<div class="mitem"><div class="micon" style="background:${isSess?'var(--greend)':isAI?'var(--blued)':'var(--fog2)'}"><svg width="12" height="12" fill="none" stroke="${isSess?'var(--green)':isAI?'var(--blue)':'var(--t3)'}" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg></div><div style="flex:1"><div style="font-size:11px;font-weight:500">${isSess?DISC[item.discipline]?.label||item.discipline:item.title}</div><div class="txs tmuted">${item.date}${!isSess&&item.time_start?' · '+item.time_start:''}${isAI?' · ✦ IA':''}</div></div>${isSess&&item.total_score?`<div style="font-family:var(--disp);font-size:14px;font-weight:700;color:${sc(item.total_score)}">${item.total_score}</div>`:''}${!isSess&&item.planned_shots?`<div style="font-family:var(--mono);font-size:10px;color:var(--t3)">${item.planned_shots} disp.</div>`:''}</div>`;
  }).join('')||'<div class="txs tmuted">Sin eventos próximos</div>'}
</div>`;
}

// BIND
// ══════════════════════════════════════════════════════════════
function bind(){
  document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{
    const pg=el.dataset.page;
    ST.page=pg;ST.modal=null;ST.aiInsight=null;
    if(pg==='new-session'){ST.wizardStep=1;ST.wizardData={discipline:'',type:'training',date:new Date().toISOString().split('T')[0],weapon_id:'',ammo_lot_id:'',location:'',objective:'',exercise_type:'',planned_shots:60,wind_level:'',mental_state:7,physical_state:7,objective_met:null,notes:'',scatt_file:null,target_file:null};}
    render();
  }));
  $('go-prf')?.addEventListener('click',()=>{ST.page='profile';render()});
  $('btn-so')?.addEventListener('click',signOut);
  $('btn-back')?.addEventListener('click',()=>{
    ST.page=ST.page==='session-detail'?'sessions-list':'home';
    ST.selSession=null;ST.aiInsight=null;render();
  });

  // AUTH
  $('btn-li')?.addEventListener('click',async()=>{const e=$('ae').value,p=$('ap').value;if(!e||!p)return;$('btn-li').innerHTML='<span class="spinner"></span>';const err=await signIn(e,p);if(err)$('auth-inner').innerHTML=loginHTML(err);});
  $('to-reg')?.addEventListener('click',()=>{$('auth-inner').innerHTML=regHTML();bind()});
  $('to-li')?.addEventListener('click',()=>{$('auth-inner').innerHTML=loginHTML();bind()});
  document.querySelectorAll('.rcard').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.rcard').forEach(x=>x.classList.remove('on'));c.classList.add('on');$('rrole').value=c.dataset.role;}));
  $('btn-reg')?.addEventListener('click',async()=>{const n=$('rn').value,e=$('re').value,p=$('rp').value,r=$('rrole').value;if(!n||!e||!p)return;$('btn-reg').innerHTML='<span class="spinner"></span>';const err=await signUp(e,p,n,r);if(err)$('auth-inner').innerHTML=regHTML(err);});

  // CHART
  document.querySelectorAll('[data-cf]').forEach(el=>el.addEventListener('click',()=>{ST.chartFilter=el.dataset.cf;render()}));
  document.querySelectorAll('[data-ct]').forEach(el=>el.addEventListener('click',()=>{ST.chartType=el.dataset.ct;render()}));

  // SESSIONS
  document.querySelectorAll('[data-sess]').forEach(el=>el.addEventListener('click',()=>{ST.selSession=el.dataset.sess;ST.page='session-detail';ST.aiInsight=null;render()}));
  $('btn-plan')?.addEventListener('click',getTrainingPlan);
  $('btn-aw-d')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  $('btn-aa-d')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});

  // WIZARD
  // Paso 1: selección de disciplina
  document.querySelectorAll('[data-disc]').forEach(el=>el.addEventListener('click',()=>{
    const disc=el.dataset.disc;
    const defW=getDefaultWeapon(disc);
    const defA=getDefaultAmmo();
    ST.wizardData={...ST.wizardData,discipline:disc,weapon_id:defW?.id||'',ammo_lot_id:defA?.id||'',planned_shots:DISC[disc]?.shots||60};
    render();
  }));
  // Selectores de arma/munición en paso 1
  $('w-weapon')?.addEventListener('change',e=>{ST.wizardData.weapon_id=e.target.value});
  $('w-ammo')?.addEventListener('change',e=>{ST.wizardData.ammo_lot_id=e.target.value});

  $('wiz-next')?.addEventListener('click',()=>{
    if(ST.wizardStep===1){
      if(!ST.wizardData.discipline){toast('Seleccioná una disciplina','err');return}
      ST.wizardData.type=$('w-type')?.value||'training';
      ST.wizardData.date=$('w-date')?.value||new Date().toISOString().split('T')[0];
      // Actualizar weapon/ammo si cambiaron
      if($('w-weapon'))ST.wizardData.weapon_id=$('w-weapon').value;
      if($('w-ammo'))ST.wizardData.ammo_lot_id=$('w-ammo').value;
    }
    if(ST.wizardStep===2){
      ST.wizardData.objective=$('w-obj')?.value||'';
      ST.wizardData.exercise_type=$('w-extype')?.value||'';
      ST.wizardData.planned_shots=parseInt($('w-shots')?.value)||DISC[ST.wizardData.discipline]?.shots||60;
      ST.wizardData.total_score=$('w-score')?.value||null;
    }
    ST.wizardStep++;render();
  });
  $('wiz-back')?.addEventListener('click',()=>{ST.wizardStep--;render()});
  $('wiz-save')?.addEventListener('click',async()=>{
    // Recopilar paso 3
    ST.wizardData.notes=$('w-notes')?.value||'';
    $('wiz-save').innerHTML='<span class="spinner"></span> Guardando...';
    $('wiz-save').disabled=true;
    await saveSession();
  });

  // Objetivo check
  $('obj-toggle')?.addEventListener('click',()=>{
    ST.wizardData.objective_met=ST.wizardData.objective_met===null?true:ST.wizardData.objective_met===true?false:null;
    render();
  });

  // Viento
  document.querySelectorAll('[data-wind]').forEach(el=>el.addEventListener('click',()=>{ST.wizardData.wind_level=el.dataset.wind;render()}));

  // Sliders
  $('w-mental')?.addEventListener('input',e=>{
    ST.wizardData.mental_state=parseInt(e.target.value);
    const v=$('mental-val');
    if(v){v.textContent=e.target.value;v.style.color=parseInt(e.target.value)>=8?'var(--green)':parseInt(e.target.value)<=5?'var(--red)':'var(--gold)';}
  });
  $('w-physical')?.addEventListener('input',e=>{
    ST.wizardData.physical_state=parseInt(e.target.value);
    if($('physical-val'))$('physical-val').textContent=e.target.value;
  });

  // Archivos SCATT y blanco
  $('scatt-file')?.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    ST.wizardData.scatt_file=f;
    if($('scatt-zone'))$('scatt-zone').style.borderColor='var(--green)';
    render();
  });
  $('target-file')?.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    ST.wizardData.target_file=f;
    if($('target-zone'))$('target-zone').style.borderColor='var(--green)';
    render();
  });

  // Analyze session
  $('btn-analyze')?.addEventListener('click',()=>{if(ST.selSession)analyzeSessionV2(ST.selSession)});

  // Coach
  $('btn-refresh-coach')?.addEventListener('click',()=>{ST.coachData=null;render()});

  // Calendar
  $('cal-prev')?.addEventListener('click',()=>{if(ST.calMonth===0){ST.calMonth=11;ST.calYear--}else ST.calMonth--;render()});
  $('cal-next')?.addEventListener('click',()=>{if(ST.calMonth===11){ST.calMonth=0;ST.calYear++}else ST.calMonth++;render()});
  $('btn-add-event')?.addEventListener('click',()=>{ST.modal='cal-event';render()});
  $('btn-ce-save')?.addEventListener('click',async()=>{
    const title=$('ce-title').value;
    if(!title){toast('El título es obligatorio','err');return}
    await saveCalEvent({title,date:$('ce-date').value,event_type:$('ce-type').value,time_start:$('ce-time').value,planned_shots:parseInt($('ce-shots')?.value)||null,objective:$('ce-obj')?.value||null,notes:$('ce-notes')?.value||null,generated_by:'manual'});
  });

  // Weapons CRUD
  $('btn-add-w')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  document.querySelectorAll('[data-edit-w]').forEach(el=>el.addEventListener('click',()=>{editItem=weapons.find(w=>w.id===el.dataset.editW);ST.modal='weapon';render()}));
  document.querySelectorAll('[data-del-w]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('¿Eliminar esta arma?'))await deleteWeapon(el.dataset.delW)}));

  // Ammo CRUD
  $('btn-add-a')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});
  document.querySelectorAll('[data-edit-a]').forEach(el=>el.addEventListener('click',()=>{editItem=ammos.find(a=>a.id===el.dataset.editA);ST.modal='ammo';render()}));
  document.querySelectorAll('[data-del-a]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('¿Eliminar?'))await deleteAmmo(el.dataset.delA)}));

  // Modal close
  $('cm')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('cm2')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('mov')?.addEventListener('click',e=>{if(e.target.id==='mov'){ST.modal=null;editItem=null;render()}});

  // Save weapon
  $('btn-sw')?.addEventListener('click',async()=>{
    const brand=$('wb').value,model=$('wm').value;
    if(!brand||!model){toast('Marca y modelo son obligatorios','err');return}
    $('btn-sw').innerHTML='<span class="spinner"></span>';
    await saveWeapon({type:$('wt').value,brand,model,serial:$('ws').value,caliber:$('wc').value,year:parseInt($('wy').value)||null,notes:$('wn').value,active:true});
  });

  // Rating stars
  document.querySelectorAll('#rating-stars .star').forEach(s=>s.addEventListener('click',()=>{
    const r=parseInt(s.dataset.r);$('ar').value=r;
    document.querySelectorAll('#rating-stars .star').forEach((x,i)=>{x.className=`star ${i<r?'on':'off'}`;x.style.fontSize='20px'});
  }));
  $('photo-file')?.addEventListener('change',e=>{const f=e.target.files[0];if(f&&$('photo-name'))$('photo-name').textContent=`✓ ${f.name}`});

  // Save ammo
  $('btn-sa')?.addEventListener('click',async()=>{
    const brand=$('ab').value,lot=$('al').value;
    if(!brand||!lot){toast('Marca y lote son obligatorios','err');return}
    $('btn-sa').innerHTML='<span class="spinner"></span>';
    await saveAmmo({brand,lot_number:lot,model:$('am').value,caliber:$('ac').value,quantity:parseInt($('aq').value)||0,rating:parseInt($('ar').value)||null,comment:$('ac2').value,photo_url:editItem?.photo_url||null},$('photo-file')?.files[0]||null);
  });

  // Profile
  $('btn-save-prf')?.addEventListener('click',async()=>updateProfile({full_name:$('pn').value,club:$('pc').value,category:$('pcat').value,role:$('prole').value}));
}

init();
</script>
</body>
</html>
