<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERF SHOT — Shooting Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#060C17;--bg2:#0B1320;--bg3:#111B2E;
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --green:#00D48A;--greenl:#5DFFC0;--greend:rgba(0,212,138,.10);--greenglow:rgba(0,212,138,.15);
  --blue:#4DB8FF;--blued:rgba(77,184,255,.10);
  --red:#FF4D6A;--redd:rgba(255,77,106,.09);
  --gold:#FFB547;--goldd:rgba(255,181,71,.10);
  --purple:#9D85FF;--purpled:rgba(157,133,255,.10);
  --t:#C8DEFA;--t2:#7A9BBF;--t3:#3A5570;
  --b:rgba(255,255,255,.06);--b2:rgba(255,255,255,.04);
  --navy:#0D1B2E;--navy2:#111D30;--navy3:rgba(255,255,255,.10);
  --fog:rgba(255,255,255,.04);--fog2:rgba(255,255,255,.06);--white:#111D30;
  --r:14px;--rs:9px;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
  --sh-glow:0 0 0 1px rgba(0,212,138,.15),0 4px 24px rgba(0,212,138,.08);
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--t);min-height:100vh;font-size:14px;line-height:1.6;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 15% -5%,rgba(0,212,138,.06),transparent 60%),radial-gradient(ellipse 70% 50% at 100% 10%,rgba(77,184,255,.05),transparent 55%),radial-gradient(ellipse 60% 50% at 50% 110%,rgba(157,133,255,.04),transparent 60%);animation:ambient 24s ease-in-out infinite alternate}
@keyframes ambient{0%{opacity:.7;transform:translate3d(0,0,0) scale(1)}50%{opacity:1;transform:translate3d(0,-1.5%,0) scale(1.04)}100%{opacity:.8;transform:translate3d(1%,1%,0) scale(1.02)}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}*{animation-duration:.01ms!important;transition-duration:.05ms!important}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
.app{display:flex;min-height:100vh}
.sb{width:220px;flex-shrink:0;background:rgba(6,12,23,.95);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sb-wm{font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:.04em;color:#fff}.sb-wm span{color:var(--green);text-shadow:0 0 20px rgba(0,212,138,.4)}
.sb-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-top:2px}
.sb-nav{flex:1;padding:8px 7px;display:flex;flex-direction:column;gap:1px}
.sb-sec{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:rgba(58,85,112,.8);padding:8px 8px 3px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:var(--t3);font-size:12px;border:none;background:none;width:100%;text-align:left;transition:all .15s;border-left:2px solid transparent}
.sb-item:hover{background:var(--glass2);color:var(--t2)}.sb-item.on{background:var(--greend);color:var(--greenl);border-left-color:var(--green);padding-left:9px}
.sb-badge{margin-left:auto;font-size:9px;font-family:var(--mono);background:rgba(0,212,138,.15);color:var(--greenl);padding:1px 5px;border-radius:20px}
.sb-notif{margin-left:auto;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 8px rgba(255,77,106,.4)}
.sb-user{padding:11px 13px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px;cursor:pointer}
.sb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:10px;font-weight:700;color:#060C17;flex-shrink:0;box-shadow:0 0 12px rgba(0,212,138,.3)}
.sb-nm{font-size:12px;font-weight:500;color:var(--t)}.sb-rl{font-size:10px;color:var(--t3)}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:rgba(6,12,23,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tb-title{font-family:var(--disp);font-size:15px;font-weight:600;color:var(--t)}
.content{padding:20px 24px;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);font-family:var(--body);font-size:12px;font-weight:500;cursor:pointer;transition:all .18s;border:none;white-space:nowrap}
.btn-p{background:var(--green);color:#060C17;font-weight:600;box-shadow:0 0 0 0 rgba(0,212,138,0)}.btn-p:hover{background:var(--greenl);box-shadow:0 0 16px rgba(0,212,138,.3);transform:translateY(-1px)}
.btn-s{background:var(--glass);color:var(--t2);border:1px solid var(--border2)}.btn-s:hover{background:var(--glass2);color:var(--t);border-color:rgba(255,255,255,.18)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-i{padding:7px;border-radius:var(--rs);background:var(--glass);border:1px solid var(--border);cursor:pointer;color:var(--t2);transition:all .15s;display:inline-flex;align-items:center}.btn-i:hover{background:var(--glass2);border-color:var(--border2);color:var(--t)}
.card{background:var(--glass);border-radius:var(--r);border:1px solid var(--border);padding:18px;box-shadow:var(--sh)}.ct{font-family:var(--disp);font-size:13px;font-weight:600;color:var(--t)}
.metrics{display:grid;gap:12px;margin-bottom:14px}
.m5{grid-template-columns:repeat(5,1fr)}.m4{grid-template-columns:repeat(4,1fr)}.m3{grid-template-columns:repeat(3,1fr)}
.metric{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}.metric:hover{transform:translateY(-2px);box-shadow:var(--sh),0 8px 32px rgba(0,0,0,.2)}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.metric.mg::before{background:linear-gradient(90deg,var(--green),var(--greenl))}.metric.mo::before{background:linear-gradient(90deg,var(--gold),#FFD580)}.metric.mb::before{background:linear-gradient(90deg,var(--blue),#9DD8FF)}.metric.mn::before{background:linear-gradient(90deg,var(--purple),#C4B5FF)}.metric.mp::before{background:linear-gradient(90deg,var(--purple),var(--blue))}
.mv{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1;margin-bottom:4px;color:var(--t)}.mv .dec{font-size:13px;color:var(--t3)}
.ml{font-size:9px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}.md{font-size:10px;font-family:var(--mono)}
.metric-glyph{position:absolute;right:-8px;bottom:-12px;font-size:54px;opacity:.05;pointer-events:none;line-height:1;user-select:none;filter:blur(.5px)}
.delta-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:20px;font-weight:600}
.delta-chip.up{background:rgba(0,212,138,.12);color:var(--green)}.delta-chip.dn{background:rgba(255,77,106,.1);color:var(--red)}.delta-chip.neu{background:var(--glass2);color:var(--t3)}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--t3)}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0;box-shadow:0 0 6px rgba(0,212,138,.6)}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px rgba(0,212,138,.6)}50%{opacity:.4;box-shadow:0 0 2px rgba(0,212,138,.2)}}
.ai-badge{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--greend);border:1px solid rgba(0,212,138,.2);border-radius:20px;cursor:pointer;transition:all .15s}.ai-badge:hover{background:rgba(0,212,138,.15);box-shadow:0 0 12px rgba(0,212,138,.1)}
.sparkline{height:34px;display:flex;align-items:flex-end;gap:2px;width:76px;flex-shrink:0}.spark-bar{flex:1;border-radius:2px 2px 0 0;min-width:4px}
.trend-widget{background:var(--glass2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;display:flex;align-items:center;gap:9px;margin-top:9px}
.pb-widget{background:linear-gradient(135deg,rgba(255,181,71,.08),rgba(255,181,71,.02));border:1px solid rgba(255,181,71,.15);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.pb-item{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid rgba(255,181,71,.08)}.pb-item:last-child{border-bottom:none}
.pb-score{font-family:var(--disp);font-size:15px;font-weight:800;color:var(--gold)}.pb-info{flex:1}.pb-disc{font-size:11px;font-weight:500;color:var(--t)}.pb-date{font-size:10px;color:var(--t3);font-family:var(--mono)}
.pb-ctx{font-size:9px;padding:1px 6px;border-radius:20px;font-weight:500}.pb-comp{background:var(--goldd);color:var(--gold)}.pb-train{background:var(--greend);color:var(--green)}
.weekly-card{background:linear-gradient(135deg,rgba(11,19,32,.9),rgba(17,27,46,.9));border:1px solid var(--border2);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.weekly-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue),var(--purple))}
.wc-rating{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;margin-bottom:5px}
.wc-ex{background:rgba(0,212,138,.15);color:var(--greenl)}.wc-bu{background:rgba(77,184,255,.12);color:#7ACFFF}
.wc-re{background:rgba(255,181,71,.12);color:var(--gold)}.wc-ba{background:rgba(255,77,106,.12);color:#FF8A9A}.wc-na{background:var(--glass2);color:var(--t3)}
.chart-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.cfs{display:flex;gap:4px;flex-wrap:wrap}
.cf{font-size:10px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:var(--glass);color:var(--t3);font-family:var(--body);transition:all .15s}
.cf:hover{border-color:var(--green);color:var(--green)}.cf.on{background:var(--bg3);color:var(--t);border-color:var(--border2)}.cf.co{background:var(--goldd);color:var(--gold);border-color:rgba(255,181,71,.3)}
.bars{height:96px;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;border-radius:3px 3px 0 0;cursor:pointer;position:relative;min-width:5px;transition:opacity .15s}.bar:hover{opacity:.8}
.bar-tip{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);color:var(--t);font-family:var(--mono);font-size:10px;padding:3px 6px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}.bar:hover .bar-tip{opacity:1}
.chart-axis{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;color:var(--t3);font-family:var(--mono)}
.chart-stats{display:flex;gap:12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--b2);flex-wrap:wrap}
.cs-v{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--t)}.cs-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.ai-card{background:var(--glass);border:1px solid rgba(0,212,138,.15);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px;position:relative;overflow:hidden}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue))}
.ai-hd{display:flex;align-items:center;gap:7px;margin-bottom:9px}.ai-title{font-size:11px;font-weight:500;color:var(--green);letter-spacing:.06em;text-transform:uppercase}.ai-body{font-size:12px;color:var(--t2);line-height:1.7}
.sess-list{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.sl-hd{padding:11px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b2)}.see-all{font-size:11px;color:var(--green);cursor:pointer;display:flex;align-items:center;gap:3px}
.srow{display:flex;align-items:center;gap:11px;padding:10px 15px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--b2);border-left:2px solid transparent}.srow:last-child{border-bottom:none}.srow:hover{background:var(--glass2);border-left-color:var(--border2)}
.s-date{font-family:var(--mono);font-size:10px;color:var(--t3);min-width:62px}
.s-type-badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;letter-spacing:.03em}
.s-info{flex:1}.s-disc{font-size:12px;font-weight:500;color:var(--t)}.s-meta{font-size:10px;color:var(--t3);margin-top:1px}
.s-score{font-family:var(--disp);font-size:17px;font-weight:800;min-width:42px;text-align:right}
.btm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:12px}
.mini{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}.mini-t{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.mitem{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--b2)}.mitem:last-child{border-bottom:none}
.micon{width:27px;height:27px;border-radius:6px;background:var(--glass2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stars{display:flex;gap:1px}.star{font-size:11px;cursor:pointer}.star.on{color:var(--gold)}.star.off{color:var(--b)}
.adv-card{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border2);border-radius:var(--r);padding:13px}
.adv-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.adv-title{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--t);margin-bottom:7px}
.adv-item{font-size:11px;color:var(--t3);display:flex;align-items:flex-start;gap:5px;margin-bottom:4px;line-height:1.4}
.adv-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px}
.adv-btn{width:100%;margin-top:7px;padding:7px;border-radius:var(--rs);background:var(--green);color:#060C17;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:var(--disp);transition:all .18s}.adv-btn:hover{background:var(--greenl);box-shadow:0 0 16px rgba(0,212,138,.3)}
.wizard{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wiz-steps{display:flex;border-bottom:1px solid var(--border);background:var(--glass)}
.wstep{flex:1;padding:11px 9px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px}
.wstep.active{color:var(--green);background:var(--greend);border-bottom-color:var(--green)}.wstep.done{color:var(--green)}
.wstep-num{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--glass2);color:var(--t3);flex-shrink:0}
.wstep.active .wstep-num{background:var(--green);color:#060C17}.wstep.done .wstep-num{background:var(--greend);color:var(--green)}
.wiz-body{padding:19px}.wiz-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 19px;border-top:1px solid var(--border);background:var(--glass)}
.disc-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:11px}
.disc-card{padding:10px;border-radius:var(--rs);border:2px solid var(--border);cursor:pointer;transition:all .15s;text-align:center;background:var(--glass)}
.disc-card:hover,.disc-card.on{border-color:var(--green);background:var(--greend)}
.disc-card-name{font-size:10px;font-weight:500;color:var(--t2);margin-top:3px}.disc-card-sub{font-size:9px;color:var(--t3);margin-top:1px}.disc-card.on .disc-card-name{color:var(--green)}
.ac-box{background:var(--greend);border:1px solid rgba(0,212,138,.2);border-radius:var(--rs);padding:8px 11px;margin-bottom:7px;display:flex;align-items:center;gap:9px}
.ac-lbl{font-size:10px;color:var(--green);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:1px}
.wind-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.wind-card{padding:8px;border-radius:var(--rs);border:2px solid var(--border);cursor:pointer;transition:all .15s;text-align:center;background:var(--glass)}
.wind-card:hover,.wind-card.on{border-color:var(--green);background:var(--greend)}
.wind-icon{font-size:17px;margin-bottom:2px}.wind-label{font-size:10px;font-weight:500;color:var(--t2)}.wind-card.on .wind-label{color:var(--green)}
.obj-check{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--glass);border-radius:var(--rs);cursor:pointer;border:2px solid var(--border);transition:all .15s;margin-bottom:10px}
.obj-check.yes{border-color:var(--green);background:var(--greend)}.obj-check.no{border-color:var(--red);background:var(--redd)}
.obj-chk-icon{width:23px;height:23px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.obj-check.yes .obj-chk-icon{border-color:var(--green);background:var(--green);color:#060C17}.obj-check.no .obj-chk-icon{border-color:var(--red);background:var(--red);color:#fff}
.rng-row{display:flex;align-items:center;gap:9px}.rng-row input[type=range]{flex:1;accent-color:var(--green)}
.rng-val{font-family:var(--mono);font-size:13px;font-weight:500;min-width:28px;text-align:center;color:var(--t)}
.upload-zone{border:2px dashed rgba(255,255,255,.1);border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:var(--glass);position:relative}
.upload-zone:hover{border-color:var(--green);background:var(--greend)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.file-up{background:var(--greend);border:1px solid rgba(0,212,138,.2);border-radius:var(--rs);padding:4px 9px;font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px;margin-top:4px}
.sess-page{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sess-hdr{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:15px 19px;margin-bottom:11px;box-shadow:var(--sh);display:flex;gap:14px;align-items:flex-start}
.big-score{font-family:var(--disp);font-size:50px;font-weight:800;line-height:1;flex-shrink:0}
.sess-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.ss-stat{background:var(--glass2);border-radius:var(--rs);padding:8px 10px}.ss-v{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--t)}.ss-l{font-size:10px;color:var(--t3);margin-top:1px;text-transform:uppercase;letter-spacing:.04em}
.ai-analysis-card{background:var(--glass);border:1px solid rgba(0,212,138,.15);border-radius:var(--r);overflow:hidden;margin-bottom:11px;box-shadow:var(--sh)}

/* ══ QUALITY PASS — motion, depth, skeletons, micro-interactions ══ */
/* Staggered content entrance: children of .content rise & fade in sequence */
.content>*{animation:riseIn .5s cubic-bezier(.16,1,.3,1) both}
.content>*:nth-child(1){animation-delay:.02s}.content>*:nth-child(2){animation-delay:.06s}.content>*:nth-child(3){animation-delay:.1s}.content>*:nth-child(4){animation-delay:.14s}.content>*:nth-child(5){animation-delay:.18s}.content>*:nth-child(6){animation-delay:.22s}.content>*:nth-child(n+7){animation-delay:.26s}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Refined depth: layered, softer shadows with a subtle top highlight on cards */
.card,.metric,.chart-card,.ai-card,.mini,.sess-list,.sess-hdr,.ai-analysis-card,.insight-card,.comp-card,.plan-card,.ecard,.acard,.issf-hero,.adv-card{position:relative}
.card::after,.metric::after,.chart-card::after,.mini::after,.sess-list::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);z-index:0}
.card>*,.metric>*,.chart-card>*,.mini>*{position:relative;z-index:1}
/* Cards lift on hover with a green-tinted ambient glow */
.card,.chart-card,.mini,.ai-card{transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s,border-color .22s}
.card:hover,.chart-card:hover,.mini:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:var(--sh),0 12px 40px rgba(0,0,0,.28)}
/* Metric cards: brighter accent bar on hover + glow */
.metric::before{transition:filter .22s,box-shadow .22s}.metric:hover::before{filter:brightness(1.3)}
.metric.mg:hover{box-shadow:var(--sh),0 10px 36px rgba(0,212,138,.1)}
/* Button micro-interactions: shine sweep + tactile press */
.btn{position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg);transition:left .55s ease;pointer-events:none}
.btn:hover::after{left:130%}
.btn:active{transform:translateY(1px) scale(.985)}
.auth-btn,.adv-btn,.plan-btn{position:relative;overflow:hidden}.auth-btn:active,.adv-btn:active{transform:translateY(1px) scale(.99)}
/* Interactive selectable cards: smoother, springier */
.disc-card,.wind-card,.ob-opt,.rcard,.cf,.ptab,.ftab{transition:all .18s cubic-bezier(.16,1,.3,1)}
.disc-card:hover,.wind-card:hover,.ob-opt:hover,.rcard:hover{transform:translateY(-1px)}
.disc-card.on,.wind-card.on,.ob-opt.on,.rcard.on{box-shadow:0 0 0 1px rgba(0,212,138,.25),0 6px 20px rgba(0,212,138,.08)}
/* Shimmer skeleton loaders */
.skel{position:relative;overflow:hidden;background:var(--glass2);border-radius:var(--rs)}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:translateX(-100%);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skel-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.skel-line{height:11px;border-radius:5px;margin-bottom:9px}
/* Polished spinner: dual-tone conic ring */
.spinner{width:14px;height:14px;border:2px solid rgba(0,212,138,.15);border-top-color:var(--green);border-right-color:var(--green);border-radius:50%;animation:spin .55s cubic-bezier(.6,.1,.4,.9) infinite;display:inline-block}
/* Elevated loading screen with animated ring + pulsing wordmark */
.loading{position:relative}
.load-ring{width:48px;height:48px;border-radius:50%;border:2px solid rgba(0,212,138,.12);border-top-color:var(--green);animation:spin .8s linear infinite;box-shadow:0 0 24px rgba(0,212,138,.12)}
.load-logo{animation:logoPulse 2.4s ease-in-out infinite}
@keyframes logoPulse{0%,100%{opacity:1}50%{opacity:.55}}
/* Sidebar nav: icon nudges right on hover */
.sb-item svg{transition:transform .18s}.sb-item:hover svg{transform:translateX(2px)}
/* Language toggle */
.lang-toggle{display:inline-flex;gap:2px;padding:2px;background:var(--glass2);border:1px solid var(--border);border-radius:20px}
.lang-opt{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:20px;border:none;background:none;color:var(--t3);cursor:pointer;transition:all .18s}
.lang-opt:hover{color:var(--t2)}.lang-opt.on{background:var(--green);color:#060C17}
.lang-auth{position:absolute;top:16px;right:16px}
.auth-card{position:relative}
/* Focus-visible accessibility ring */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-page]:focus-visible,[data-disc]:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
/* Toast: slide-up with glow accent */
.toast{animation:toastIn .32s cubic-bezier(.16,1,.3,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

// Interactive count-up: metric numbers animate from 0 to their value on render
function countUp(){
  document.querySelectorAll('.metric .mv').forEach(el=>{
    if(el.dataset.counted)return;
    const dec=el.querySelector('.dec');const decHtml=dec?dec.outerHTML:'';
    const raw=(el.textContent||'').replace(dec?dec.textContent:'','').trim();
    const m=raw.match(/^(#?)(\d+)/);if(!m){el.dataset.counted='1';return;}
    const prefix=m[1];const target=parseInt(m[2],10);if(!target||target>100000){el.dataset.counted='1';return;}
    el.dataset.counted='1';const dur=650;const start=performance.now();
    const step=now=>{const p=Math.min(1,(now-start)/dur);const eased=1-Math.pow(1-p,3);const val=Math.round(target*eased);el.innerHTML=prefix+val+decHtml;if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
function toast(msg,type='ok',dur=4500){

  el.textContent=ic+' '+msg;document.body.appendChild(el);
  if(dur>0)setTimeout(()=>el.remove(),dur);
}

  const safety=setTimeout(()=>{if(ST.loading){ST.loading=false;render();toast('No se pudo conectar con el servidor. Revisá tu conexión.','err',0);}},8000);
  try{
    let{data:{session}}=await sb.auth.getSession();

      // Proactively refresh to ensure token is valid after project restores / password resets
      const{data:ref}=await sb.auth.refreshSession();

      ST.user=session.user;await loadProfile();await loadData();
    }
  }catch(e){toast('Error de conexión: '+(e?.message||e),'err');}
  finally{clearTimeout(safety);ST.loading=false;render();}
  sb.auth.onAuthStateChange(async(e,s)=>{
    // User arrived from a password-reset email link → show "set new password" screen
    if(e==='PASSWORD_RECOVERY'){ST.recovery=true;ST.user=s?.user||null;ST.loading=false;render();return;}

    render();
  });
}

async function callEdge(name,body){
  const _do=async(token)=>fetch(`${SURL}/functions/v1/${name}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(body)});
  try{
    let{data:{session}}=await sb.auth.getSession();
    if(!session?.access_token)throw new Error('Sin sesión activa. Ingresá de nuevo.');
    let res=await _do(session.access_token);
    if(res.status===401){
      const{data:ref,error:re}=await sb.auth.refreshSession();
      if(re||!ref?.session?.access_token){
        await sb.auth.signOut();ST.user=null;ST.profile=null;render();
        throw new Error('Sesión expirada. Ingresá de nuevo.');
      }
      res=await _do(ref.session.access_token);
    }
    const data=await res.json();
    if(!res.ok&&!data.error)throw new Error(`Error ${res.status} en ${name}`);
    if(data.error)throw new Error(data.error);
    return data;
  }catch(e){throw e}
}

}

let _weekCache={key:null,data:null};
function getWeekStats(){

  const now=new Date();const mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()===0?6:now.getDay()-1));mon.setHours(0,0,0,0);const lastMon=new Date(mon);lastMon.setDate(mon.getDate()-7);const tw=sessions.filter(s=>new Date(s.date+'T00:00:00')>=mon);const lw=sessions.filter(s=>{const d=new Date(s.date+'T00:00:00');return d>=lastMon&&d<mon});const twS=tw.map(s=>Number(s.total_score)).filter(Boolean);const lwS=lw.map(s=>Number(s.total_score)).filter(Boolean);const twA=twS.length?twS.reduce((a,b)=>a+b,0)/twS.length:null;const lwA=lwS.length?lwS.reduce((a,b)=>a+b,0)/lwS.length:null;
  const result={thisWeek:tw,twA:twA?.toFixed(1),lwA:lwA?.toFixed(1),delta:twA&&lwA?(twA-lwA).toFixed(1):null,count:tw.length};_weekCache={key,data:result};return result;
}

function calendarHTML(){
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const m=ST.calMonth,y=ST.calYear;const fd=new Date(y,m,1).getDay();const dim=new Date(y,m+1,0).getDate();
  const today=new Date();const pad=n=>n<10?'0'+n:n;
  const evM=ST.calEvents.filter(e=>{const d=new Date(e.date+'T00:00:00');return d.getMonth()===m&&d.getFullYear()===y});
  const seM=sessions.filter(s=>{const d=new Date(s.date+'T00:00:00');return d.getMonth()===m&&d.getFullYear()===y});
