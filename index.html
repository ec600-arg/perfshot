<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERF SHOT — Mini-MVP 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:      #0B1C2D;
  --navy-2:    #132638;
  --navy-3:    #1E3A54;
  --green:     #1D9E75;
  --green-l:   #5DCAA5;
  --green-dim: rgba(29,158,117,.12);
  --blue:      #4DB8FF;
  --blue-dim:  rgba(77,184,255,.10);
  --red:       #E8462A;
  --red-dim:   rgba(232,70,42,.10);
  --gold:      #EF9F27;
  --fog:       #F0F7FF;
  --fog-2:     #E3EEF9;
  --text:      #0B1C2D;
  --text-2:    #4A6278;
  --text-3:    #8BA5BB;
  --border:    rgba(11,28,45,.10);
  --border-2:  rgba(11,28,45,.06);
  --radius:    12px;
  --radius-sm: 8px;
  --mono:      'DM Mono', monospace;
  --display:   'Syne', sans-serif;
  --body:      'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--body);
  background: var(--fog);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── LAYOUT ── */
.app { display: flex; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--navy);
  display: flex; flex-direction: column;
  padding: 0;
  position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform .25s ease;
}
.sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--navy-3);
}
.logo-wordmark {
  font-family: var(--display);
  font-size: 20px; font-weight: 700;
  letter-spacing: .04em;
  color: #fff;
}
.logo-wordmark span { color: var(--green); }
.logo-sub {
  font-size: 10px; font-weight: 400;
  letter-spacing: .12em; text-transform: uppercase;
  color: #6B8FAF; margin-top: 2px;
}

.sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }

.nav-section-label {
  font-size: 9px; font-weight: 500; letter-spacing: .15em;
  text-transform: uppercase; color: #3A5570;
  padding: 10px 10px 4px; margin-top: 4px;
}

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background .15s;
  color: #6B8FAF; font-size: 13px; font-weight: 400;
  border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--navy-2); color: #9DBDD4; }
.nav-item.active { background: var(--green-dim); color: var(--green-l); }
.nav-item.active .nav-icon { color: var(--green); }
.nav-icon { width: 16px; flex-shrink: 0; opacity: .7; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto; font-size: 9px; font-family: var(--mono);
  background: var(--green-dim); color: var(--green-l);
  padding: 1px 6px; border-radius: 20px;
}

.sidebar-user {
  padding: 14px 14px; border-top: 1px solid var(--navy-3);
  display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.user-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--green); display: flex; align-items: center;
  justify-content: center; font-family: var(--display);
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 500; color: #9DBDD4; }
.user-role { font-size: 10px; color: #3A5570; }

/* ── MAIN ── */
.main { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 14px 32px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-family: var(--display); font-size: 16px; font-weight: 600; color: var(--text); }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

.content { padding: 28px 32px; flex: 1; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  font-family: var(--body); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s; border: none; white-space: nowrap;
}
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: #189060; }
.btn-secondary {
  background: transparent; color: var(--text-2);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--fog-2); }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(232,70,42,.2); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-icon { padding: 8px; border-radius: var(--radius-sm); background: transparent; border: 1px solid var(--border); cursor: pointer; color: var(--text-2); transition: all .15s; }
.btn-icon:hover { background: var(--fog-2); }

/* ── CARDS ── */
.card {
  background: #fff; border-radius: var(--radius);
  border: 1px solid var(--border); padding: 20px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--text); }
.card-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }

/* ── STAT CARDS ── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
}
.stat-val { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-val .decimal { font-size: 16px; color: var(--green); }
.stat-lbl { font-size: 11px; color: var(--text-3); margin-top: 4px; letter-spacing: .04em; }
.stat-delta { font-size: 11px; margin-top: 6px; font-family: var(--mono); }
.delta-up { color: var(--green); }
.delta-down { color: var(--red); }
.delta-neutral { color: var(--text-3); }

/* ── FORMS ── */
.form-grid { display: grid; gap: 14px; }
.form-grid-2 { grid-template-columns: 1fr 1fr; }
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 11px; font-weight: 500; color: var(--text-2); letter-spacing: .04em; text-transform: uppercase; }
.form-input, .form-select, .form-textarea {
  padding: 9px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--fog);
  font-family: var(--body); font-size: 13px; color: var(--text);
  transition: border-color .15s, background .15s; width: 100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--green);
  background: #fff; box-shadow: 0 0 0 3px var(--green-dim);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 11px; color: var(--text-3); }

/* ── TAGS / BADGES ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 500;
}
.badge-green { background: var(--green-dim); color: var(--green); }
.badge-blue { background: var(--blue-dim); color: #185FA5; }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-gold { background: rgba(239,159,39,.12); color: #8a5a00; }
.badge-gray { background: var(--fog-2); color: var(--text-2); }

/* ── TABLE ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  font-size: 10px; font-weight: 500; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-3);
  padding: 10px 12px; text-align: left;
  border-bottom: 1px solid var(--border);
}
td { padding: 11px 12px; border-bottom: 1px solid var(--border-2); font-size: 13px; color: var(--text); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--fog-2); }

/* ── RATING STARS ── */
.stars { display: flex; gap: 2px; }
.star { font-size: 13px; cursor: pointer; transition: transform .1s; }
.star:hover { transform: scale(1.2); }
.star.filled { color: var(--gold); }
.star.empty { color: var(--border); }

/* ── UPLOAD ZONE ── */
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 24px; text-align: center; cursor: pointer;
  transition: all .15s; background: var(--fog);
}
.upload-zone:hover { border-color: var(--green); background: var(--green-dim); }
.upload-zone-icon { font-size: 28px; margin-bottom: 8px; }
.upload-zone-text { font-size: 13px; color: var(--text-2); }
.upload-zone-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }

/* ── TABS ── */
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border-2); margin-bottom: 20px; }
.tab {
  padding: 10px 16px; font-size: 13px; font-weight: 500;
  color: var(--text-3); cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  transition: all .15s; font-family: var(--body);
}
.tab:hover { color: var(--text-2); }
.tab.active { color: var(--green); border-bottom-color: var(--green); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(11,28,45,.5);
  z-index: 200; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal {
  background: #fff; border-radius: 16px; width: 100%; max-width: 540px;
  max-height: 90vh; overflow-y: auto;
  animation: modalIn .2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to   { opacity: 1; transform: none; }
}
.modal-header {
  padding: 20px 24px 16px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: #fff; z-index: 1; border-radius: 16px 16px 0 0;
}
.modal-title { font-family: var(--display); font-size: 15px; font-weight: 600; }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

/* ── AUTH SCREEN ── */
.auth-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--navy);
  background-image:
    radial-gradient(circle at 20% 80%, rgba(29,158,117,.08) 0%, transparent 60%),
    radial-gradient(circle at 80% 20%, rgba(77,184,255,.05) 0%, transparent 60%);
}
.auth-card {
  width: 100%; max-width: 400px; padding: 40px;
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px; backdrop-filter: blur(10px);
}
.auth-logo { text-align: center; margin-bottom: 32px; }
.auth-logo-mark { font-family: var(--display); font-size: 32px; font-weight: 800; color: #fff; letter-spacing: .05em; }
.auth-logo-mark span { color: var(--green); }
.auth-logo-sub { font-size: 11px; letter-spacing: .15em; color: #6B8FAF; text-transform: uppercase; margin-top: 4px; }
.auth-title { font-family: var(--display); font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.auth-sub { font-size: 13px; color: #6B8FAF; margin-bottom: 24px; }
.auth-input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05);
  color: #fff; font-family: var(--body); font-size: 14px; margin-bottom: 10px;
  transition: border-color .15s;
}
.auth-input::placeholder { color: #3A5570; }
.auth-input:focus { outline: none; border-color: var(--green); background: rgba(255,255,255,.08); }
.auth-btn {
  width: 100%; padding: 13px; border-radius: var(--radius-sm);
  background: var(--green); color: #fff; font-family: var(--display);
  font-size: 14px; font-weight: 700; letter-spacing: .04em;
  border: none; cursor: pointer; transition: background .15s; margin-top: 4px;
}
.auth-btn:hover { background: #189060; }
.auth-divider { text-align: center; color: #3A5570; font-size: 12px; margin: 14px 0; position: relative; }
.auth-divider::before, .auth-divider::after {
  content: ''; position: absolute; top: 50%; width: 38%; height: 1px;
  background: rgba(255,255,255,.06);
}
.auth-divider::before { left: 0; }
.auth-divider::after { right: 0; }
.auth-google {
  width: 100%; padding: 11px; border-radius: var(--radius-sm);
  background: transparent; color: #9DBDD4; font-family: var(--body);
  font-size: 13px; border: 1px solid rgba(255,255,255,.1);
  cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.auth-google:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.2); }
.auth-switch { text-align: center; margin-top: 20px; font-size: 12px; color: #3A5570; }
.auth-switch a { color: var(--green-l); cursor: pointer; }

/* ── ROLE SELECTOR ── */
.role-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.role-card {
  padding: 16px; border-radius: var(--radius-sm); border: 2px solid rgba(255,255,255,.08);
  cursor: pointer; transition: all .15s; text-align: center;
}
.role-card:hover { border-color: var(--green); background: var(--green-dim); }
.role-card.selected { border-color: var(--green); background: var(--green-dim); }
.role-card-icon { font-size: 24px; margin-bottom: 6px; }
.role-card-name { font-size: 13px; font-weight: 500; color: #9DBDD4; }
.role-card.selected .role-card-name { color: var(--green-l); }

/* ── EQUIPMENT CARD ── */
.equip-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; display: flex; gap: 14px; align-items: flex-start;
  transition: box-shadow .15s; cursor: pointer;
}
.equip-card:hover { box-shadow: 0 4px 20px rgba(11,28,45,.08); }
.equip-icon {
  width: 44px; height: 44px; border-radius: var(--radius-sm);
  background: var(--navy); display: flex; align-items: center;
  justify-content: center; flex-shrink: 0;
}
.equip-info { flex: 1; }
.equip-name { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--text); }
.equip-model { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.equip-serial { font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-top: 6px; }
.equip-tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }

/* ── AMMO CARD ── */
.ammo-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px;
}
.ammo-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.ammo-name { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--text); }
.ammo-lot { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-top: 2px; }
.ammo-photo { width: 100%; height: 100px; border-radius: var(--radius-sm); object-fit: cover; background: var(--fog-2); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-3); margin-bottom: 10px; }
.ammo-comment { font-size: 12px; color: var(--text-2); line-height: 1.5; font-style: italic; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 48px 24px; color: var(--text-3);
}
.empty-icon { font-size: 36px; margin-bottom: 12px; opacity: .4; }
.empty-title { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.empty-sub { font-size: 12px; line-height: 1.6; }

/* ── MINI CHART ── */
.sparkline { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
.spark-bar {
  flex: 1; border-radius: 3px 3px 0 0; background: var(--green-dim);
  transition: background .15s;
}
.spark-bar.highlight { background: var(--green); }
.spark-bar:hover { background: var(--green); }

/* ── AI INSIGHT BOX ── */
.ai-insight {
  background: linear-gradient(135deg, var(--green-dim) 0%, var(--blue-dim) 100%);
  border: 1px solid rgba(29,158,117,.2); border-radius: var(--radius);
  padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;
}
.ai-insight-icon {
  width: 30px; height: 30px; border-radius: 50%; background: var(--green);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ai-insight-text { font-size: 13px; color: var(--text); line-height: 1.6; }
.ai-insight-text strong { color: var(--green); font-weight: 500; }

/* ── UTILS ── */
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.gap-20 { gap: 20px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mb-20 { margin-bottom: 20px; }
.mb-24 { margin-bottom: 24px; }
.text-mono { font-family: var(--mono); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-muted { color: var(--text-3); }
.text-green { color: var(--green); }
.w-full { width: 100%; }
.hidden { display: none; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: none; }
  .main { margin-left: 0; }
  .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  return (

            <Icon name="ai" size={14} color="#fff" />

          <div className="stat-val">{MOCK_SESSIONS.length}</div>

          <div className="stat-delta delta-neutral">→ 3 entrenamientos, 1 competencia</div>

            {scores.slice().reverse().map((s, i) => {

          <div className="flex items-center justify-between text-xs text-muted">

            <div><div className="card-title">Últimas sesiones</div></div>

          {MOCK_SESSIONS.slice(0,3).map(s => (
            <div key={s.id} className="flex items-center justify-between gap-8 mb-12">
              <div>
                <div className="text-sm" style={{fontWeight:500}}>{s.discipline}</div>

      <div className="card">

              <Stars value={a.rating} size="sm" />
            </div>

            <div className="ammo-photo">
              {a.hasPhoto
                ? <div style={{width:'100%',height:'100%',background:'var(--navy)',borderRadius:'var(--radius-sm)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--green-l)',fontSize:11}}>📸 Foto cargada</div>
                : <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,color:'var(--text-3)'}}>
                    <Icon name="upload" size={20} color="var(--text-3)" />
                    <span style={{fontSize:11}}>Sin foto</span>
                  </div>
              }
            </div>

            <div className="flex gap-8 mb-8" style={{flexWrap:'wrap'}}>
              <span className="badge badge-gray">{a.caliber}</span>
              <span className="badge badge-blue">{a.qty} unid.</span>
              {a.rating >= 4 && <span className="badge badge-green">Recomendado</span>}
            </div>

            {a.comment && <div className="ammo-comment">"{a.comment}"</div>}

            <div className="flex gap-8 mt-12">
              <button className="btn btn-secondary btn-sm w-full">
                <Icon name="upload" size={12} /> Subir foto
              </button>
              <button className="btn-icon btn-sm"><Icon name="edit" size={12} /></button>
            </div>
          </div>
        ))}
      </div>

      {showModal && (
        <div className="modal-overlay" onClick={() => setShowModal(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">Agregar lote de munición</div>
              <button className="btn-icon" onClick={() => setShowModal(false)}><Icon name="x" size={14} /></button>
            </div>
            <div className="modal-body">
              <div className="form-grid form-grid-2 mb-14">
                <div className="form-group">
                  <label className="form-label">Marca</label>
                  <input className="form-input" placeholder="RWS, Lapua, H&N..." value={form.brand} onChange={e => setForm({...form, brand:e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Modelo</label>
                  <input className="form-input" placeholder="R10 Match, L-110..." value={form.model} onChange={e => setForm({...form, model:e.target.value})} />
                </div>
              </div>
              <div className="form-grid form-grid-2 mb-14">
                <div className="form-group">
                  <label className="form-label">Número de lote</label>
                  <input className="form-input" placeholder="2024-B-0312" value={form.lot} onChange={e => setForm({...form, lot:e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Calibre</label>
                  <select className="form-select" value={form.caliber} onChange={e => setForm({...form, caliber:e.target.value})}>
                    <option>4.5mm</option>
                    <option>5.5mm</option>
                    <option>.22 LR</option>
                    <option>5.6mm</option>
                  </select>
                </div>
              </div>
              <div className="form-grid form-grid-2 mb-14">
                <div className="form-group">
                  <label className="form-label">Cantidad</label>
                  <input className="form-input" type="number" placeholder="500" value={form.qty} onChange={e => setForm({...form, qty:e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Rating de rendimiento</label>
                  <div style={{paddingTop:8}}>
                    <Stars value={form.rating} onChange={r => setForm({...form, rating:r})} />
                  </div>
                </div>
              </div>
              <div className="form-group mb-14">
                <label className="form-label">Comentarios y observaciones</label>
                <textarea className="form-textarea" placeholder="Agrupación, consistencia, condiciones de prueba..." value={form.comment} onChange={e => setForm({...form, comment:e.target.value})} />
              </div>
              <div className="upload-zone">
                <div className="upload-zone-icon"><Icon name="upload" size={28} color="var(--text-3)" /></div>
                <div className="upload-zone-text">Subir foto de agrupación</div>
                <div className="upload-zone-hint">PNG, JPG hasta 10MB · También podés arrastrar y soltar</div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={addAmmo}>Guardar lote</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

    birthdate: '1995-03-15', nationality: 'Argentina',
    coach: 'Prof. Carlos Fernández',
  });

  return (
    <div>
      <div className="flex items-center gap-16 mb-24">
        <div style={{width:64, height:64, borderRadius:'50%', background:'var(--green)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'var(--display)', fontSize:24, fontWeight:800, color:'#fff'}}>
          {user.initials}
        </div>
        <div>
          <h2 style={{fontFamily:'var(--display)', fontSize:20, fontWeight:700}}>{user.name}</h2>
          <p className="text-sm text-muted">{user.club} · {user.category}</p>
          <div className="flex gap-8 mt-8">
            {user.disciplines.map(d => <span key={d} className="badge badge-blue">{d}</span>)}
          </div>
        </div>
      </div>

      <div className="tabs mb-20">
        {['personal', 'disciplinas', 'entrenador'].map(t => (
          <button key={t} className={`tab ${tab === t ? 'active' : ''}`} onClick={() => setTab(t)}>
            {t === 'personal' ? 'Datos personales' : t === 'disciplinas' ? 'Disciplinas ISSF' : 'Entrenador'}
          </button>
        ))}
      </div>

      {tab === 'personal' && (
        <div className="card">
          <div className="form-grid form-grid-2 mb-14">
            <div className="form-group">
              <label className="form-label">Nombre completo</label>
              <input className="form-input" value={form.name} onChange={e => setForm({...form, name:e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label">Email</label>
              <input className="form-input" type="email" value={form.email} onChange={e => setForm({...form, email:e.target.value})} />
            </div>
          </div>
          <div className="form-grid form-grid-2 mb-14">
            <div className="form-group">
              <label className="form-label">Club</label>
              <input className="form-input" value={form.club} onChange={e => setForm({...form, club:e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label">Categoría</label>
              <select className="form-select" value={form.category} onChange={e => setForm({...form, category:e.target.value})}>
                {['Junior','Sub-23','Absoluto','Master'].map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div className="form-grid form-grid-2 mb-14">
            <div className="form-group">
              <label className="form-label">Fecha de nacimiento</label>
              <input className="form-input" type="date" value={form.birthdate} onChange={e => setForm({...form, birthdate:e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label">Nacionalidad</label>
              <input className="form-input" value={form.nationality} onChange={e => setForm({...form, nationality:e.target.value})} />
            </div>
          </div>
          <div className="flex" style={{justifyContent:'flex-end'}}>
            <button className="btn btn-primary">Guardar cambios</button>
          </div>
        </div>
      )}

      {tab === 'disciplinas' && (
        <div className="card">
          <p className="text-sm text-muted mb-16">Seleccioná las disciplinas ISSF en las que competís</p>
          {['10m Pistola de Aire','10m Pistola de Aire (F)','10m Rifle de Aire','50m Pistola','50m Rifle 3 Posiciones','50m Rifle Tendido'].map(d => (
            <label key={d} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid var(--border-2)',cursor:'pointer'}}>
              <input type="checkbox" defaultChecked={user.disciplines.includes(d)} style={{accentColor:'var(--green)',width:15,height:15}} />
              <span style={{fontSize:13}}>{d}</span>
            </label>
          ))}
          <div className="flex" style={{justifyContent:'flex-end',marginTop:16}}>
            <button className="btn btn-primary">Guardar disciplinas</button>
          </div>
        </div>
      )}

      {tab === 'entrenador' && (
        <div className="card">
          <div className="flex items-center gap-12 mb-20" style={{padding:'14px',background:'var(--fog-2)',borderRadius:'var(--radius-sm)'}}>
            <div style={{width:42,height:42,borderRadius:'50%',background:'var(--navy)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--green)',fontFamily:'var(--display)',fontWeight:700}}>CF</div>
            <div>
              <div style={{fontSize:13,fontWeight:500}}>Prof. Carlos Fernández</div>
              <div className="text-xs text-muted">carlos@ctnacional.ar · Club de Tiro Nacional</div>

          </div>
          <p className="text-sm text-muted mb-16">¿Querés vincular otro entrenador? Ingresá su código o email:</p>
          <div className="form-grid form-grid-2">
            <div className="form-group">
              <label className="form-label">Email del entrenador</label>
              <input className="form-input" placeholder="entrenador@club.com" />
            </div>
            <div className="form-group">
              <label className="form-label">Código de invitación</label>
              <input className="form-input" placeholder="PERF-XXXX" />

};

/* ── COMING SOON ── */
const ComingSoon = ({ title, icon, desc }) => (
  <div className="card" style={{minHeight:320, display:'flex', alignItems:'center', justifyContent:'center'}}>
    <div className="empty-state">
      <div style={{marginBottom:16}}><Icon name={icon} size={36} color="var(--text-3)" /></div>
      <div className="empty-title">{title}</div>
      <div className="empty-sub">{desc}</div>
      <div style={{marginTop:20}}>
        <span className="badge badge-blue">Mini-MVP 2 — Semana 2</span>
      </div>
    </div>
  </div>
);

/* ── MAIN APP ── */
const App = () => {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('home');

  if (!user) return <AuthScreen onLogin={u => setUser({ ...MOCK_USER, ...u })} />;

  const nav = [
    { id:'home',      label:'Inicio',       icon:'home' },
    { id:'sessions',  label:'Sesiones',     icon:'target' },
    { id:'analysis',  label:'Análisis',     icon:'chart' },
    { section: 'Mi equipamiento' },
    { id:'weapons',   label:'Armas',        icon:'gun' },
    { id:'ammo',      label:'Munición',     icon:'bullet',  badge:'Nuevo' },
    { section: 'Comunidad' },
    { id:'calendar',  label:'Calendario',   icon:'calendar' },
    { id:'coach',     label:'Entrenador',   icon:'users' },
    { section: 'Cuenta' },
    { id:'profile',   label:'Mi perfil',    icon:'settings' },
  ];

  const pageTitle = {
    home: 'Dashboard', sessions: 'Sesiones', analysis: 'Análisis IA',
    weapons: 'Equipamiento', ammo: 'Munición y balines',
    calendar: 'Calendario', coach: 'Entrenador', profile: 'Mi perfil',
  };

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div className="logo-wordmark">PERF<span>SHOT</span></div>
          <div className="logo-sub">Shooting Performance</div>
        </div>

        <nav className="sidebar-nav">
          {nav.map((item, i) => item.section ? (
            <div key={i} className="nav-section-label">{item.section}</div>
          ) : (
            <button key={item.id} className={`nav-item ${page === item.id ? 'active' : ''}`} onClick={() => setPage(item.id)}>
              <span className="nav-icon"><Icon name={item.icon} size={15} /></span>
              {item.label}
              {item.badge && <span className="nav-badge">{item.badge}</span>}
            </button>
          ))}
        </nav>

        <div className="sidebar-user" onClick={() => setPage('profile')}>
          <div className="user-avatar">{user.initials}</div>
          <div>
            <div className="user-name">{user.name.split(' ')[0]}</div>
            <div className="user-role">{user.role === 'coach' ? 'Entrenador' : 'Atleta'}</div>
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div className="topbar-title">{pageTitle[page]}</div>
          <div className="topbar-actions">
            {page === 'home' && (
              <button className="btn btn-primary btn-sm" onClick={() => setPage('sessions')}>
                <Icon name="plus" size={13} color="#fff" /> Nueva sesión
              </button>
            )}
            <button className="btn-icon" title="Cerrar sesión" onClick={() => setUser(null)}>
              <Icon name="logout" size={15} />
            </button>
          </div>
        </div>

        <div className="content">
          {page === 'home'     && <Dashboard user={user} />}
          {page === 'weapons'  && <EquipmentModule />}
          {page === 'ammo'     && <AmmoModule />}
          {page === 'profile'  && <ProfileModule user={user} />}
          {page === 'sessions' && <ComingSoon title="Registro de sesiones" icon="target" desc="Carga tiro a tiro, importación SIUS/SCATT y foto del blanco con OCR. Llega en la Semana 2." />}
          {page === 'analysis' && <ComingSoon title="Análisis IA" icon="chart" desc="Gráficos de evolución, detección de patrones y sugerencias de Claude. Llega en la Semana 3." />}
          {page === 'calendar' && <ComingSoon title="Calendario unificado" icon="calendar" desc="Entrenamientos y competencias pasadas y futuras en un solo lugar. Llega en la Semana 2." />}
          {page === 'coach'    && <ComingSoon title="Entrenador" icon="users" desc="Dashboard del entrenador, asignación de planes y feedback por sesión. Llega en la Semana 2." />}
        </div>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
