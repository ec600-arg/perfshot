<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERF SHOT — Shooting Performance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0B1C2D;--navy2:#132638;--navy3:#1E3A54;
  --green:#1D9E75;--greenl:#5DCAA5;--greend:rgba(29,158,117,.10);
  --blue:#4DB8FF;--blued:rgba(77,184,255,.08);
  --red:#E8462A;--redd:rgba(232,70,42,.08);
  --gold:#EF9F27;--goldd:rgba(239,159,39,.10);
  --purple:#7F77DD;--purpled:rgba(127,119,221,.08);
  --fog:#F4F7FB;--fog2:#EBF0F7;--white:#fff;
  --t:#0B1C2D;--t2:#4A6278;--t3:#8BA5BB;
  --b:rgba(11,28,45,.08);--b2:rgba(11,28,45,.04);
  --r:12px;--rs:8px;--sh:0 1px 3px rgba(11,28,45,.07);
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--fog);color:var(--t);min-height:100vh;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
.app{display:flex;min-height:100vh}
.sb{width:220px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:18px 16px 12px;border-bottom:1px solid var(--navy3)}
.sb-wm{font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:.04em;color:#fff}.sb-wm span{color:var(--green)}
.sb-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6B8FAF;margin-top:2px}
.sb-nav{flex:1;padding:8px 7px;display:flex;flex-direction:column;gap:1px}
.sb-sec{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#3A5570;padding:8px 8px 3px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:#6B8FAF;font-size:12px;border:none;background:none;width:100%;text-align:left;transition:background .15s}
.sb-item:hover{background:var(--navy2);color:#9DBDD4}.sb-item.on{background:rgba(29,158,117,.15);color:var(--greenl)}
.sb-badge{margin-left:auto;font-size:9px;font-family:var(--mono);background:rgba(29,158,117,.2);color:var(--greenl);padding:1px 5px;border-radius:20px}
.sb-notif{margin-left:auto;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sb-user{padding:11px 13px;border-top:1px solid var(--navy3);display:flex;align-items:center;gap:9px;cursor:pointer}
.sb-av{width:30px;height:30px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.sb-nm{font-size:12px;font-weight:500;color:#9DBDD4}.sb-rl{font-size:10px;color:#3A5570}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--b);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.tb-title{font-family:var(--disp);font-size:15px;font-weight:600}
.content{padding:20px 24px;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);font-family:var(--body);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:#189060}
.btn-s{background:var(--white);color:var(--t2);border:1px solid var(--b)}.btn-s:hover{background:var(--fog)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-i{padding:7px;border-radius:var(--rs);background:var(--white);border:1px solid var(--b);cursor:pointer;color:var(--t2);transition:all .15s;display:inline-flex;align-items:center}.btn-i:hover{background:var(--fog2)}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--b);padding:18px;box-shadow:var(--sh)}.ct{font-family:var(--disp);font-size:13px;font-weight:600}
.metrics{display:grid;gap:12px;margin-bottom:14px}
.m5{grid-template-columns:repeat(5,1fr)}.m4{grid-template-columns:repeat(4,1fr)}.m3{grid-template-columns:repeat(3,1fr)}
.metric{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.metric.mg::before{background:var(--green)}.metric.mo::before{background:var(--gold)}.metric.mb::before{background:var(--blue)}.metric.mn::before{background:var(--navy)}.metric.mp::before{background:var(--purple)}
.mv{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1;margin-bottom:3px}.mv .dec{font-size:12px;color:var(--t3)}
.ml{font-size:10px;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}.md{font-size:10px;font-family:var(--mono)}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--t3)}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ai-badge{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--greend);border:1px solid rgba(29,158,117,.2);border-radius:20px;cursor:pointer;transition:all .15s}.ai-badge:hover{background:rgba(29,158,117,.15)}
.sparkline{height:34px;display:flex;align-items:flex-end;gap:2px;width:76px;flex-shrink:0}.spark-bar{flex:1;border-radius:2px 2px 0 0;min-width:4px}
.trend-widget{background:var(--fog2);border-radius:var(--rs);padding:8px 12px;display:flex;align-items:center;gap:9px;margin-top:9px}
.pb-widget{background:linear-gradient(135deg,rgba(239,159,39,.08),rgba(239,159,39,.02));border:1px solid rgba(239,159,39,.15);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.pb-item{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid rgba(239,159,39,.08)}.pb-item:last-child{border-bottom:none}
.pb-score{font-family:var(--disp);font-size:15px;font-weight:800;color:var(--gold)}.pb-info{flex:1}.pb-disc{font-size:11px;font-weight:500}.pb-date{font-size:10px;color:var(--t3);font-family:var(--mono)}
.pb-ctx{font-size:9px;padding:1px 6px;border-radius:20px;font-weight:500}.pb-comp{background:var(--goldd);color:#7a4a00}.pb-train{background:var(--greend);color:var(--green)}
.weekly-card{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.weekly-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue))}
.wc-rating{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;margin-bottom:5px}
.wc-ex{background:rgba(29,158,117,.2);color:var(--greenl)}.wc-bu{background:rgba(77,184,255,.15);color:#7ACFFF}
.wc-re{background:rgba(239,159,39,.15);color:#F5C96A}.wc-ba{background:rgba(232,70,42,.15);color:#FF8A7A}.wc-na{background:rgba(255,255,255,.08);color:#6B8FAF}
.chart-card{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.cfs{display:flex;gap:4px;flex-wrap:wrap}
.cf{font-size:10px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1px solid var(--b);background:var(--fog);color:var(--t3);font-family:var(--body);transition:all .15s}
.cf:hover{border-color:var(--green);color:var(--green)}.cf.on{background:var(--navy);color:#fff;border-color:var(--navy)}.cf.co{background:var(--gold);color:#fff;border-color:var(--gold)}
.bars{height:96px;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;border-radius:3px 3px 0 0;cursor:pointer;position:relative;min-width:5px;transition:opacity .15s}.bar:hover{opacity:.8}
.bar-tip{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:var(--mono);font-size:10px;padding:3px 6px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}.bar:hover .bar-tip{opacity:1}
.chart-axis{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;color:var(--t3);font-family:var(--mono)}
.chart-stats{display:flex;gap:12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--b2);flex-wrap:wrap}
.cs-v{font-family:var(--disp);font-size:13px;font-weight:700}.cs-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.ai-card{background:var(--white);border:1px solid rgba(29,158,117,.2);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px;position:relative;overflow:hidden}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue))}
.ai-hd{display:flex;align-items:center;gap:7px;margin-bottom:9px}.ai-title{font-size:11px;font-weight:500;color:var(--green);letter-spacing:.06em;text-transform:uppercase}.ai-body{font-size:12px;color:var(--t2);line-height:1.7}
.sess-list{background:var(--white);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.sl-hd{padding:11px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b2)}.see-all{font-size:11px;color:var(--green);cursor:pointer;display:flex;align-items:center;gap:3px}
.srow{display:flex;align-items:center;gap:11px;padding:9px 15px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--b2)}.srow:last-child{border-bottom:none}.srow:hover{background:var(--fog)}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.s-date{font-family:var(--mono);font-size:10px;color:var(--t3);min-width:68px}
.s-info{flex:1}.s-disc{font-size:12px;font-weight:500}.s-meta{font-size:10px;color:var(--t3);margin-top:1px}
.s-score{font-family:var(--disp);font-size:16px;font-weight:700;min-width:38px;text-align:right}
.btm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:12px}
.mini{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}.mini-t{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.mitem{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--b2)}.mitem:last-child{border-bottom:none}
.micon{width:27px;height:27px;border-radius:6px;background:var(--fog2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stars{display:flex;gap:1px}.star{font-size:11px;cursor:pointer}.star.on{color:var(--gold)}.star.off{color:var(--b)}
.adv-card{background:var(--navy);border-radius:var(--r);padding:13px}
.adv-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.adv-title{font-family:var(--disp);font-size:12px;font-weight:600;color:#fff;margin-bottom:7px}
.adv-item{font-size:11px;color:#6B8FAF;display:flex;align-items:flex-start;gap:5px;margin-bottom:4px;line-height:1.4}
.adv-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px}
.adv-btn{width:100%;margin-top:7px;padding:7px;border-radius:var(--rs);background:var(--green);color:#fff;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--disp);transition:background .15s}.adv-btn:hover{background:#189060}
.wizard{background:var(--white);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wiz-steps{display:flex;border-bottom:2px solid var(--b);background:var(--fog)}
.wstep{flex:1;padding:11px 9px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-2px}
.wstep.active{color:var(--green);background:var(--white);border-bottom-color:var(--green)}.wstep.done{color:var(--green)}
.wstep-num{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--b);color:var(--t3);flex-shrink:0}
.wstep.active .wstep-num{background:var(--green);color:#fff}.wstep.done .wstep-num{background:var(--greend);color:var(--green)}
.wiz-body{padding:19px}.wiz-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 19px;border-top:1px solid var(--b);background:var(--fog)}
.disc-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:11px}
.disc-card{padding:10px;border-radius:var(--rs);border:2px solid var(--b);cursor:pointer;transition:all .15s;text-align:center}
.disc-card:hover,.disc-card.on{border-color:var(--green);background:var(--greend)}
.disc-card-name{font-size:10px;font-weight:500;color:var(--t);margin-top:3px}.disc-card-sub{font-size:9px;color:var(--t3);margin-top:1px}.disc-card.on .disc-card-name{color:var(--green)}
.ac-box{background:var(--fog2);border:1px solid rgba(29,158,117,.2);border-radius:var(--rs);padding:8px 11px;margin-bottom:7px;display:flex;align-items:center;gap:9px}
.ac-lbl{font-size:10px;color:var(--green);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:1px}
.wind-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.wind-card{padding:8px;border-radius:var(--rs);border:2px solid var(--b);cursor:pointer;transition:all .15s;text-align:center}
.wind-card:hover,.wind-card.on{border-color:var(--green);background:var(--greend)}
.wind-icon{font-size:17px;margin-bottom:2px}.wind-label{font-size:10px;font-weight:500}.wind-card.on .wind-label{color:var(--green)}
.obj-check{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--fog);border-radius:var(--rs);cursor:pointer;border:2px solid var(--b);transition:all .15s;margin-bottom:10px}
.obj-check.yes{border-color:var(--green);background:var(--greend)}.obj-check.no{border-color:var(--red);background:var(--redd)}
.obj-chk-icon{width:23px;height:23px;border-radius:50%;border:2px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.obj-check.yes .obj-chk-icon{border-color:var(--green);background:var(--green);color:#fff}.obj-check.no .obj-chk-icon{border-color:var(--red);background:var(--red);color:#fff}
.rng-row{display:flex;align-items:center;gap:9px}.rng-row input[type=range]{flex:1;accent-color:var(--green)}
.rng-val{font-family:var(--mono);font-size:13px;font-weight:500;min-width:28px;text-align:center}
.upload-zone{border:2px dashed var(--b);border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:var(--fog);position:relative}
.upload-zone:hover{border-color:var(--green);background:var(--greend)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.file-up{background:var(--greend);border:1px solid rgba(29,158,117,.2);border-radius:var(--rs);padding:4px 9px;font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px;margin-top:4px}
.sess-page{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sess-hdr{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:15px 19px;margin-bottom:11px;box-shadow:var(--sh);display:flex;gap:14px;align-items:flex-start}
.big-score{font-family:var(--disp);font-size:50px;font-weight:800;line-height:1;flex-shrink:0}
.sess-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.ss-stat{background:var(--fog);border-radius:var(--rs);padding:8px 10px}.ss-v{font-family:var(--disp);font-size:13px;font-weight:700}.ss-l{font-size:10px;color:var(--t3);margin-top:1px;text-transform:uppercase;letter-spacing:.04em}
.ai-analysis-card{background:var(--white);border:1px solid rgba(29,158,117,.15);border-radius:var(--r);overflow:hidden;margin-bottom:11px;box-shadow:var(--sh)}
.aac-hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:11px 16px;display:flex;align-items:center;gap:9px}
.aac-title{font-family:var(--disp);font-size:12px;font-weight:600;color:#fff}.aac-body{padding:14px}
.ai-sec{margin-bottom:12px}.ai-sec-lbl{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.ai-pt{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;padding:7px 9px;background:var(--fog);border-radius:var(--rs)}
.ai-pt-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}.ai-pt-title{font-size:12px;font-weight:500;margin-bottom:2px}.ai-pt-detail{font-size:11px;color:var(--t2);line-height:1.5}
.ns-card{background:linear-gradient(135deg,var(--navy),#0F2A45);border-radius:var(--r);padding:14px;margin-bottom:11px}
.ns-badge{font-size:9px;padding:2px 7px;border-radius:20px;background:rgba(29,158,117,.2);color:var(--greenl);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.ns-title{font-family:var(--disp);font-size:13px;font-weight:700;color:#fff;margin:6px 0 3px}.ns-obj{font-size:12px;color:#9DBDD4;margin-bottom:9px}

.ns-shots{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--green);min-width:26px}.ns-name{font-size:12px;font-weight:500;color:#fff}.ns-foco{font-size:10px;color:#6B8FAF;margin-top:1px}
.cal-assigned{background:var(--greend);border:1px solid rgba(29,158,117,.2);border-radius:var(--rs);padding:6px 11px;font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;margin-top:7px}
.pdf-bar{background:var(--fog2);border:1px solid var(--b);border-radius:var(--rs);padding:8px 13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cc-card{background:linear-gradient(135deg,rgba(77,184,255,.05),rgba(127,119,221,.03));border:1px solid rgba(77,184,255,.18);border-radius:var(--r);padding:10px 13px;margin-bottom:7px}
.cc-hdr{display:flex;align-items:center;gap:7px;margin-bottom:5px}

.period-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}

.corr-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}.corr-lbl{font-size:11px;color:var(--t2);min-width:95px;flex-shrink:0}

// ── INIT + AUTH + EDGE FUNCTIONS ──────────────────────────────
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){ST.user=session.user;await loadProfile();await loadData();}
  ST.loading=false;render();
  sb.auth.onAuthStateChange(async(e,s)=>{
    ST.user=s?.user||null;
    if(ST.user){await loadProfile();await loadData();}
    else{ST.profile=null;weapons=[];ammos=[];sessions=[];ST.calEvents=[];ST.notifications=[];ST.personalBests=[];}
    render();
  });
}
async function loadProfile(){const{data}=await sb.from('profiles').select('*').eq('id',ST.user.id).single();ST.profile=data;}
async function loadData(){
  const uid=ST.user.id;
  const[w,a,s,ce,notifs,invites,pbs]=await Promise.all([
    sb.from('weapons').select('*').eq('athlete_id',uid).eq('active',true).order('created_at',{ascending:false}),
    sb.from('ammo_lots').select('*').eq('athlete_id',uid).order('rating',{ascending:false}),
    sb.from('sessions').select('*').eq('athlete_id',uid).order('date',{ascending:false}).limit(60),
    sb.from('calendar_events').select('*').eq('athlete_id',uid).order('date'),
    sb.from('notifications').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(25),
    sb.from('coach_athletes').select('id,status,message,invited_at,coach_id').eq('athlete_id',uid).eq('status','pending'),
    sb.from('personal_bests').select('*').eq('athlete_id',uid),
  ]);
  weapons=w.data||[];ammos=a.data||[];sessions=s.data||[];
  ST.calEvents=ce.data||[];ST.notifications=notifs.data||[];
  ST.notifCount=(notifs.data||[]).filter(n=>!n.read).length+(invites.data||[]).length;
  ST.invitations=invites.data||[];ST.personalBests=pbs.data||[];
  const today=new Date().toISOString().split('T')[0];
  ST.todayPlan=ST.calEvents.find(e=>e.date===today&&e.event_type==='training')||null;
}
async function signIn(email,pass){const{error}=await sb.auth.signInWithPassword({email,password:pass});return error?.message||null}
async function signUp(email,pass,name,role){const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name,role}}});if(error)return error.message;if(data.user)await sb.from('profiles').upsert({id:data.user.id,full_name:name,email,role,disciplines:['10m_pistola_aire_m'],onboarding_completed:false});return null;}
async function signOut(){await sb.auth.signOut();ST.page='home';render()}
async function ensureProfile(){if(!ST.profile){await sb.from('profiles').upsert({id:ST.user.id,email:ST.user.email,role:'athlete',full_name:ST.user.email.split('@')[0],disciplines:['10m_pistola_aire_m'],onboarding_completed:false});await loadProfile();}}
async function callEdge(name,body){
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session?.access_token)throw new Error('Sin sesión activa. Ingresá de nuevo.');
    const res=await fetch(`${SURL}/functions/v1/${name}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify(body)});
    const data=await res.json();if(data.error)throw new Error(data.error);return data;
  }catch(e){throw e}
}

async function saveSession(){
  await ensureProfile();const d=ST.wizardData;let scUrl=null,tUrl=null;
  if(d.scatt_file){const path=`${ST.user.id}/sc-${Date.now()}.${d.scatt_file.name.split('.').pop()}`;const{error}=await sb.storage.from('scatt-files').upload(path,d.scatt_file);if(!error){const{data:pd}=sb.storage.from('scatt-files').getPublicUrl(path);scUrl=pd.publicUrl;}}
  if(d.target_file){const path=`${ST.user.id}/tg-${Date.now()}.${d.target_file.name.split('.').pop()}`;const{error}=await sb.storage.from('targets').upload(path,d.target_file);if(!error){const{data:pd}=sb.storage.from('targets').getPublicUrl(path);tUrl=pd.publicUrl;}}
  const{data:sess,error}=await sb.from('sessions').insert({athlete_id:ST.user.id,type:d.type,discipline:d.discipline,date:d.date,weapon_id:d.weapon_id||null,ammo_lot_id:d.ammo_lot_id||null,total_score:parseFloat(d.total_score)||null,total_shots:parseInt(d.planned_shots)||DISC[d.discipline]?.shots||60,wind_level:d.wind_level||null,mental_state:parseInt(d.mental_state)||null,physical_state:parseInt(d.physical_state)||null,athlete_notes:d.notes||null,session_objective:d.objective||null,exercise_type:d.exercise_type||null,planned_shots:parseInt(d.planned_shots)||null,objective_met:d.objective_met,scatt_file_url:scUrl,target_photo_url:tUrl,import_source:'wizard_v2'}).select().single();
  if(error){toast(error.message,'err');return;}
  await loadData();ST.page='session-detail';ST.selSession=sess.id;ST.aiInsight=null;
  toast('Sesión guardada — Claude analizando con base ISSF...');
  let sc2=null,tp2=null;
  if(d.scatt_file){try{sc2=await d.scatt_file.text()}catch(e){}}
  if(d.target_file&&d.target_file.type==='application/pdf')tp2='[PDF blanco adjunto]';
  render();analyzeSessionV2(sess.id,sc2,tp2);
}

function getChartData(){let d=[...sessions];if(ST.chartFilter!=='all'){const days={'1m':30,'3m':90,'6m':180,'12m':365}[ST.chartFilter];const cut=new Date();cut.setDate(cut.getDate()-days);d=d.filter(s=>new Date(s.date)>=cut);}if(ST.chartType==='training')d=d.filter(s=>s.type==='training');if(ST.chartType==='competition')d=d.filter(s=>s.type==='competition');return d.slice(0,40).reverse();}
function getDefWeapon(disc){const isPistol=disc.includes('pistola');return weapons.find(w=>isPistol?w.type==='pistola':w.type==='rifle')||weapons[0]||null}
function getWeekStats(){const now=new Date();const mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()===0?6:now.getDay()-1));mon.setHours(0,0,0,0);const lastMon=new Date(mon);lastMon.setDate(mon.getDate()-7);const tw=sessions.filter(s=>new Date(s.date+'T00:00:00')>=mon);const lw=sessions.filter(s=>{const d=new Date(s.date+'T00:00:00');return d>=lastMon&&d<mon});const twS=tw.map(s=>Number(s.total_score)).filter(Boolean);const lwS=lw.map(s=>Number(s.total_score)).filter(Boolean);const twA=twS.length?twS.reduce((a,b)=>a+b,0)/twS.length:null;const lwA=lwS.length?lwS.reduce((a,b)=>a+b,0)/lwS.length:null;return{thisWeek:tw,twA:twA?.toFixed(1),lwA:lwA?.toFixed(1),delta:twA&&lwA?(twA-lwA).toFixed(1):null,count:tw.length};}

function pageHTML(){
  switch(ST.page){
    case'home':return dashHTML();
    case'new-session':return wizardHTML();
    case'sessions-list':return sessListHTML();
    case'session-detail':return sessDetailHTML();
    case'competitions':
      if(!ST.compData&&!ST.compLoading){setTimeout(()=>loadCompData(),80);return`<div class="coming"><div class="spinner"></div></div>`;}
      if(ST.compLoading)return`<div class="coming"><div class="spinner"></div></div>`;
      return compHTML();
    case'issf':
      if(ST.profile?.issf_id&&!ST.issfData&&!ST.issfLoading&&!ST.issfImporting){setTimeout(()=>loadIssfResults(),80);return`<div class="coming"><div class="spinner"></div><div class="tsm tmuted mt9">Cargando historial ISSF...</div></div>`;}
      return issfHTML();
    case'analysis':return analysisHTML();
    case'weapons':return weaponsHTML();
    case'ammo':return ammoHTML();
    case'calendar':return calendarHTML();
    case'coach':return coachHTML();
    case'notifications':return notifHTML();
    case'planes':return planesHTML();
    case'profile':return profileHTML();
    default:return`<div class="coming"><div style="font-size:26px;opacity:.3;margin-bottom:7px">🚧</div><div class="ct">Próximamente</div></div>`;
  }
}

function calendarHTML(){
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const m=ST.calMonth,y=ST.calYear;const fd=new Date(y,m,1).getDay();const dim=new Date(y,m+1,0).getDate();
  const today=new Date();const pad=n=>n<10?'0'+n:n;
  const evM=ST.calEvents.filter(e=>{const d=new Date(e.date+'T00:00:00');return d.getMonth()===m&&d.getFullYear()===y});
  const seM=sessions.filter(s=>{const d=new Date(s.date+'T00:00:00');return d.getMonth()===m&&d.getFullYear()===y});
  const cells=[];const off=(fd===0?6:fd-1);for(let i=0;i<off;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);
  return`<div class="flex ic jb mb11"><div class="flex ic gap9"><button class="btn-i" id="cal-prev">${I.back}</button><div style="font-family:var(--disp);font-size:15px;font-weight:700">${months[m]} ${y}</div><button class="btn-i" id="cal-next" style="transform:rotate(180deg)">${I.back}</button></div><button class="btn btn-p btn-sm" id="btn-add-event">${I.plus} Agregar</button></div>
  <div class="card mb11"><div class="cal-hdr-row">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-dn">${d}</div>`).join('')}</div><div class="cal-grid">${cells.map(d=>{if(!d)return`<div></div>`;const ds=`${y}-${pad(m+1)}-${pad(d)}`;const isT=today.getDate()===d&&today.getMonth()===m&&today.getFullYear()===y;const dS=seM.filter(s=>s.date===ds);const dE=evM.filter(e=>e.date===ds);return`<div class="cal-day ${isT?'today':''}"><div class="cal-day-num" style="${isT?'color:var(--green);font-weight:700':''}">${d}</div>${dS.map(s=>`<div class="cal-event ${s.type}">${s.total_score||'?'}</div>`).join('')}${dE.map(e=>`<div class="cal-event ${e.generated_by==='ai'?'ai-generated':e.event_type||'training'}">${e.title.substring(0,10)}</div>`).join('')}</div>`;}).join('')}</div></div>
  <div class="card"><div class="ct mb9">Próximos eventos</div>${[...ST.calEvents.filter(e=>new Date(e.date+'T00:00:00')>=today)].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,6).map(e=>`<div class="mitem"><div class="micon" style="background:${e.generated_by==='ai'?'var(--blued)':'var(--greend)'}"><svg width="11" height="11" fill="none" stroke="${e.generated_by==='ai'?'var(--blue)':'var(--green)'}" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg></div><div style="flex:1"><div style="font-size:11px;font-weight:500">${e.title}</div><div class="txs tmuted">${e.date}${e.time_start?' · '+e.time_start:''}${e.generated_by==='ai'?' · ✦ IA':''}</div></div>${e.planned_shots?`<div style="font-family:var(--mono);font-size:10px;color:var(--t3)">${e.planned_shots} disp.</div>`:''}</div>`).join('')||`<div class="txs tmuted">Sin eventos próximos</div>`}</div>`;
}

  document.querySelectorAll('[data-accept]').forEach(el=>el.addEventListener('click',()=>acceptInvitation(el.dataset.accept)));
  document.querySelectorAll('[data-reject]').forEach(el=>el.addEventListener('click',()=>rejectInvitation(el.dataset.reject)));
  $('btn-refresh-coach')?.addEventListener('click',()=>{ST.coachData=null;render()});
  // ── NOTIFICACIONES ─────────────────────────────────────────
  $('btn-mark-read')?.addEventListener('click',markNotificationsRead);
  // ── ARMAS ──────────────────────────────────────────────────
  $('btn-add-w')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  document.querySelectorAll('[data-edit-w]').forEach(el=>el.addEventListener('click',()=>{editItem=weapons.find(w=>w.id===el.dataset.editW);ST.modal='weapon';render()}));
  document.querySelectorAll('[data-del-w]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('¿Eliminar esta arma?'))await deleteWeapon(el.dataset.delW)}));
  // ── MUNICIÓN ───────────────────────────────────────────────
  $('btn-add-a')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});
  document.querySelectorAll('[data-edit-a]').forEach(el=>el.addEventListener('click',()=>{editItem=ammos.find(a=>a.id===el.dataset.editA);ST.modal='ammo';render()}));
  document.querySelectorAll('[data-del-a]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('¿Eliminar este lote?'))await deleteAmmo(el.dataset.delA)}));
  // ── MODALS ─────────────────────────────────────────────────
  $('cm')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('cm2')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('mov')?.addEventListener('click',e=>{if(e.target.id==='mov'){ST.modal=null;editItem=null;render()}});
  $('btn-sw')?.addEventListener('click',async()=>{
    const brand=$('wb')?.value?.trim(),model=$('wm')?.value?.trim();
    if(!brand||!model){toast('Marca y modelo son obligatorios','err');return}
    const btn=$('btn-sw');if(btn){btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;}
    await saveWeapon({type:$('wt')?.value||'pistola',brand,model,serial:$('ws')?.value||null,caliber:$('wc')?.value||'4.5mm',year:parseInt($('wy')?.value)||null,notes:$('wn')?.value||null,active:true});
  });
  document.querySelectorAll('#rating-stars .star').forEach(s=>s.addEventListener('click',()=>{const r=parseInt(s.dataset.r);if($('ar'))$('ar').value=r;document.querySelectorAll('#rating-stars .star').forEach((x,i)=>{x.className=`star ${i<r?'on':'off'}`;x.style.fontSize='19px'});}));
  $('photo-file')?.addEventListener('change',e=>{const f=e.target.files[0];if(f&&$('photo-name'))$('photo-name').textContent=`✓ ${f.name}`});
  $('btn-sa')?.addEventListener('click',async()=>{
    const brand=$('ab')?.value?.trim(),lot=$('al')?.value?.trim();
    if(!brand||!lot){toast('Marca y lote son obligatorios','err');return}
    const btn=$('btn-sa');if(btn){btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;}
    await saveAmmo({brand,lot_number:lot,model:$('am')?.value||null,caliber:$('ac')?.value||'4.5mm',quantity:parseInt($('aq')?.value)||0,rating:parseInt($('ar')?.value)||null,comment:$('ac2')?.value||null,photo_url:editItem?.photo_url||null},$('photo-file')?.files[0]||null);
  });
  // ── PERFIL ─────────────────────────────────────────────────
  $('btn-save-prf')?.addEventListener('click',async()=>{
    const form={full_name:$('pn')?.value||'',club:$('pc')?.value||'',category:$('pcat')?.value||'',role:$('prole')?.value||'athlete'};
    const issfId=$('p-issf-id')?.value?.trim();if(issfId)form.issf_id=issfId;
    await updateProfile(form);
  });
}
init();
</script>
</body>
</html>
