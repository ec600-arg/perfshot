<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERF SHOT — Shooting Performance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0B1C2D;--navy2:#132638;--navy3:#1E3A54;
  --green:#1D9E75;--greenl:#5DCAA5;--greend:rgba(29,158,117,.10);
  --blue:#4DB8FF;--blued:rgba(77,184,255,.08);
  --red:#E8462A;--redd:rgba(232,70,42,.08);
  --gold:#EF9F27;--goldd:rgba(239,159,39,.10);
  --fog:#F4F7FB;--fog2:#EBF0F7;--white:#fff;
  --t:#0B1C2D;--t2:#4A6278;--t3:#8BA5BB;
  --b:rgba(11,28,45,.08);--b2:rgba(11,28,45,.04);
  --r:12px;--rs:8px;
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
  --sh:0 1px 3px rgba(11,28,45,.08),0 1px 2px rgba(11,28,45,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--fog);color:var(--t);min-height:100vh;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}

/* SIDEBAR */
.sb{width:210px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:20px 16px 14px;border-bottom:1px solid var(--navy3)}
.sb-wm{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:.04em;color:#fff}
.sb-wm span{color:var(--green)}
.sb-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6B8FAF;margin-top:2px}
.sb-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.sb-sec{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#3A5570;padding:8px 8px 3px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:#6B8FAF;font-size:12px;border:none;background:none;width:100%;text-align:left;transition:background .15s}
.sb-item:hover{background:var(--navy2);color:#9DBDD4}
.sb-item.on{background:rgba(29,158,117,.15);color:var(--greenl)}
.sb-badge{margin-left:auto;font-size:9px;font-family:var(--mono);background:rgba(29,158,117,.2);color:var(--greenl);padding:1px 5px;border-radius:20px}
.sb-user{padding:12px 14px;border-top:1px solid var(--navy3);display:flex;align-items:center;gap:9px;cursor:pointer}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.sb-nm{font-size:12px;font-weight:500;color:#9DBDD4}
.sb-rl{font-size:10px;color:#3A5570}

/* MAIN */
.app{display:flex;min-height:100vh}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--b);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tb-title{font-family:var(--disp);font-size:15px;font-weight:600}
.content{padding:20px 24px;flex:1}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);font-family:var(--body);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:#189060}
.btn-s{background:var(--white);color:var(--t2);border:1px solid var(--b)}.btn-s:hover{background:var(--fog)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-i{padding:7px;border-radius:var(--rs);background:var(--white);border:1px solid var(--b);cursor:pointer;color:var(--t2);transition:all .15s;display:inline-flex;align-items:center}
.btn-i:hover{background:var(--fog2)}

/* CARDS */
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--b);padding:18px;box-shadow:var(--sh)}
.ct{font-family:var(--disp);font-size:13px;font-weight:600;color:var(--t)}
.cs{font-size:11px;color:var(--t3);margin-top:1px}

/* DASHBOARD HERO - LIGHT VERSION */
.dash-hero{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh)}
.dash-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.dash-greet{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--t);line-height:1.2}
.dash-greet span{color:var(--green)}
.dash-sub{font-size:12px;color:var(--t3);margin-top:4px}
.dash-ai-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--greend);border:1px solid rgba(29,158,117,.2);border-radius:20px;cursor:pointer;transition:all .15s}
.dash-ai-badge:hover{background:rgba(29,158,117,.15)}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.dash-ai-text{font-size:11px;font-weight:500;color:var(--green)}

/* METRICS ROW */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.metric.m-green::before{background:var(--green)}
.metric.m-gold::before{background:var(--gold)}
.metric.m-blue::before{background:var(--blue)}
.metric.m-navy::before{background:var(--navy)}
.metric-val{font-family:var(--disp);font-size:28px;font-weight:800;color:var(--t);line-height:1;margin-bottom:3px}
.metric-val .dec{font-size:14px;color:var(--t3)}
.metric-lbl{font-size:10px;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.metric-delta{font-size:10px;font-family:var(--mono);display:flex;align-items:center;gap:3px}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--t3)}

/* AI INSIGHT CARD */
.ai-card{background:var(--white);border:1px solid rgba(29,158,117,.2);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px;position:relative;overflow:hidden}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue))}
.ai-card-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai-card-title{font-size:11px;font-weight:500;color:var(--green);letter-spacing:.06em;text-transform:uppercase}
.ai-card-body{font-size:12px;color:var(--t2);line-height:1.7}
.ai-card-body strong{color:var(--t);font-weight:500}
.ai-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ai-action-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--b);background:var(--fog);color:var(--t2);cursor:pointer;transition:all .15s;font-family:var(--body)}
.ai-action-btn:hover{background:var(--greend);border-color:rgba(29,158,117,.3);color:var(--green)}
.ai-loading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3)}

/* CHART */
.chart-card{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.chart-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.chart-filters{display:flex;gap:4px;flex-wrap:wrap}
.cf-btn{font-size:10px;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--b);background:var(--fog);color:var(--t3);font-family:var(--body);transition:all .15s}
.cf-btn:hover{border-color:var(--green);color:var(--green)}
.cf-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cf-btn.comp-on{background:var(--gold);color:#fff;border-color:var(--gold)}
.chart-legend{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3)}
.leg-dot{width:8px;height:8px;border-radius:50%}
.bars-wrap{position:relative}
.bars{height:100px;display:flex;align-items:flex-end;gap:4px}
.bar{flex:1;border-radius:3px 3px 0 0;cursor:pointer;transition:opacity .15s;position:relative;min-width:8px}
.bar:hover{opacity:.8}
.bar-tooltip{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.bar:hover .bar-tooltip{opacity:1}
.chart-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:var(--t3);font-family:var(--mono)}
.chart-meta{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--b2)}
.chart-stat{display:flex;flex-direction:column;gap:1px}
.chart-stat-val{font-family:var(--disp);font-size:15px;font-weight:700;color:var(--t)}
.chart-stat-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.chart-empty{height:100px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t3)}

/* SESSIONS LIST */
.sess-card{background:var(--white);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.sess-hd{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b2)}
.see-all{font-size:11px;color:var(--green);cursor:pointer;display:flex;align-items:center;gap:3px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--b2)}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--fog)}
.s-type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.s-date{font-family:var(--mono);font-size:10px;color:var(--t3);min-width:76px}
.s-info{flex:1}
.s-disc{font-size:12px;font-weight:500;color:var(--t)}
.s-meta{font-size:10px;color:var(--t3);margin-top:1px}
.s-score{font-family:var(--disp);font-size:18px;font-weight:700;min-width:40px;text-align:right}
.s-arrow{color:var(--t3);font-size:12px;flex-shrink:0}

/* BOTTOM GRID */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.mini-card{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.mini-t{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mitem{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b2)}
.mitem:last-child{border-bottom:none}
.micon{width:30px;height:30px;border-radius:7px;background:var(--fog2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-name{font-size:11px;font-weight:500;color:var(--t)}
.m-sub{font-size:10px;color:var(--t3)}
.stars{display:flex;gap:1px}
.star{font-size:11px;cursor:pointer}.star.on{color:var(--gold)}.star.off{color:var(--b)}
.advisor-card{background:var(--navy);border:1px solid var(--navy3);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.adv-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.adv-title{font-family:var(--disp);font-size:13px;font-weight:600;color:#fff;margin-bottom:8px}
.adv-item{font-size:11px;color:#6B8FAF;display:flex;align-items:flex-start;gap:6px;margin-bottom:5px;line-height:1.4}
.adv-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px}
.adv-btn{width:100%;margin-top:12px;padding:9px;border-radius:var(--rs);background:var(--green);color:#fff;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--disp);letter-spacing:.02em;transition:background .15s}
.adv-btn:hover{background:#189060}
.adv-loading{font-size:11px;color:#6B8FAF;display:flex;align-items:center;gap:6px;margin-top:8px}

/* SESSION PAGE */
.sess-page{animation:pageIn .2s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sess-page-header{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh);display:flex;align-items:flex-start;gap:20px}
.sess-score-big{font-family:var(--disp);font-size:64px;font-weight:800;line-height:1;color:var(--t)}
.sess-meta-block{flex:1}
.sess-disc{font-family:var(--disp);font-size:16px;font-weight:600;color:var(--t);margin-bottom:4px}
.sess-date-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sess-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sess-stat{background:var(--fog);border-radius:var(--rs);padding:10px 12px}
.sess-stat-v{font-family:var(--disp);font-size:18px;font-weight:700;color:var(--t)}
.sess-stat-l{font-size:10px;color:var(--t3);margin-top:1px;text-transform:uppercase;letter-spacing:.04em}
.sess-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.sess-ai{background:var(--white);border:1px solid rgba(29,158,117,.2);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px;position:relative;overflow:hidden}
.sess-ai::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue))}
.ai-section{margin-bottom:14px}
.ai-section-lbl{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:6px;opacity:.8}
.ai-point{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px;font-size:12px;color:var(--t2);line-height:1.5}
.ai-point-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.training-plan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.plan-day{background:var(--fog);border-radius:6px;padding:8px 4px;text-align:center}
.plan-day-name{font-size:9px;color:var(--t3);margin-bottom:3px;font-weight:500}
.plan-day-type{font-size:10px;font-weight:500}
.plan-day.entrenamiento{background:var(--greend);border:1px solid rgba(29,158,117,.15)}
.plan-day.competencia{background:var(--goldd);border:1px solid rgba(239,159,39,.15)}
.plan-day.descanso{background:var(--fog2);border:1px solid var(--b)}
.plan-day.test{background:var(--blued);border:1px solid rgba(77,184,255,.15)}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fl{font-size:10px;font-weight:500;color:var(--t2);letter-spacing:.04em;text-transform:uppercase}
.fi,.fs,.fta{padding:9px 11px;border-radius:var(--rs);border:1px solid var(--b);background:var(--fog);font-family:var(--body);font-size:13px;color:var(--t);width:100%;transition:border-color .15s}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--green);background:var(--white);box-shadow:0 0 0 3px var(--greend)}
.fta{resize:vertical;min-height:70px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.bg{background:var(--greend);color:var(--green)}
.bb{background:var(--blued);color:#185FA5}
.bo{background:var(--goldd);color:#7a4a00}
.bgr{background:var(--fog2);color:var(--t2)}
.br{background:var(--redd);color:var(--red)}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(11,28,45,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:14px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;animation:mIn .18s ease;box-shadow:0 20px 60px rgba(11,28,45,.2)}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mhd{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--white);z-index:1;border-radius:14px 14px 0 0}
.mt{font-family:var(--disp);font-size:14px;font-weight:600}
.mb{padding:16px 20px}
.mft{padding:12px 20px;border-top:1px solid var(--b);display:flex;gap:8px;justify-content:flex-end}

/* EQUIP / AMMO */
.ecard{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;transition:box-shadow .15s;box-shadow:var(--sh)}
.ecard:hover{box-shadow:0 4px 20px rgba(11,28,45,.1)}
.eicon{width:42px;height:42px;border-radius:var(--rs);background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acard{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.aphoto{width:100%;height:80px;border-radius:var(--rs);background:var(--fog2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);margin:8px 0;overflow:hidden;cursor:pointer;position:relative}
.aphoto img{width:100%;height:100%;object-fit:cover}
.upload-zone{border:2px dashed var(--b);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--fog);position:relative}
.upload-zone:hover{border-color:var(--green);background:var(--greend)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:12px;z-index:999;animation:mIn .2s ease;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(11,28,45,.2)}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}

/* AUTH */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);background-image:radial-gradient(circle at 20% 80%,rgba(29,158,117,.08),transparent 60%),radial-gradient(circle at 80% 20%,rgba(77,184,255,.05),transparent 60%)}
.auth-card{width:100%;max-width:380px;padding:36px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.auth-lm{font-family:var(--disp);font-size:30px;font-weight:800;color:#fff;text-align:center;letter-spacing:.05em}
.auth-lm span{color:var(--green)}
.auth-ls{font-size:10px;letter-spacing:.15em;color:#6B8FAF;text-transform:uppercase;text-align:center;margin-top:2px;margin-bottom:24px}
.auth-title{font-family:var(--disp);font-size:16px;font-weight:600;color:#fff;margin-bottom:3px}
.auth-sub{font-size:12px;color:#6B8FAF;margin-bottom:16px}
.auth-in{width:100%;padding:10px 12px;border-radius:var(--rs);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-family:var(--body);font-size:13px;margin-bottom:8px}
.auth-in::placeholder{color:#3A5570}
.auth-in:focus{outline:none;border-color:var(--green)}
.auth-btn{width:100%;padding:11px;border-radius:var(--rs);background:var(--green);color:#fff;font-family:var(--disp);font-size:13px;font-weight:700;border:none;cursor:pointer;transition:background .15s}
.auth-btn:hover{background:#189060}
.auth-err{background:rgba(232,70,42,.1);color:var(--red);padding:8px 12px;border-radius:var(--rs);font-size:12px;margin-bottom:10px;border:1px solid rgba(232,70,42,.2)}
.auth-sw{text-align:center;margin-top:14px;font-size:12px;color:#3A5570}
.auth-sw a{color:var(--greenl);cursor:pointer}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.rcard{padding:14px;border-radius:var(--rs);border:2px solid rgba(255,255,255,.08);cursor:pointer;transition:all .15s;text-align:center}
.rcard:hover,.rcard.on{border-color:var(--green);background:rgba(29,158,117,.1)}

// AUTH
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){ST.user=session.user;await loadProfile();await loadData()}
  ST.loading=false;render();
  sb.auth.onAuthStateChange(async(e,s)=>{
    ST.user=s?.user||null;
    if(ST.user){await loadProfile();await loadData()}
    else{ST.profile=null;weapons=[];ammos=[];sessions=[]}
    render();
  });
}

async function loadProfile(){
  const{data}=await sb.from('profiles').select('*').eq('id',ST.user.id).single();
  ST.profile=data;
}

async function loadData(){
  const uid=ST.user.id;
  const[w,a,s]=await Promise.all([
    sb.from('weapons').select('*').eq('athlete_id',uid).order('created_at',{ascending:false}),
    sb.from('ammo_lots').select('*').eq('athlete_id',uid).order('created_at',{ascending:false}),
    sb.from('sessions').select('*').eq('athlete_id',uid).order('date',{ascending:false}).limit(50),
  ]);
  weapons=w.data||[];ammos=a.data||[];sessions=s.data||[];
}

async function signIn(email,pass){
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  return error?.message||null;
}

async function signUp(email,pass,name,role){
  const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name,role}}});
  if(error)return error.message;
  if(data.user){
    await sb.from('profiles').upsert({id:data.user.id,full_name:name,email,role,disciplines:['10m_pistola_aire_m']});
  }
  return null;
}

async function ensureProfile(){
  if(!ST.profile){
    await sb.from('profiles').upsert({id:ST.user.id,email:ST.user.email,role:'athlete',full_name:ST.user.email.split('@')[0],disciplines:['10m_pistola_aire_m']});

  }

// EDGE FUNCTIONS
async function callEdgeFunction(name,body){
  const{data:{session}}=await sb.auth.getSession();
  const token=session?.access_token;
  const res=await fetch(`${SURL}/functions/v1/${name}`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
    body:JSON.stringify(body)
  });
  return res.json();
}

async function analyzeSession(sessionId){
  ST.aiLoading=true;render();
  try{
    const result=await callEdgeFunction('analyze-session',{session_id:sessionId});
    if(result.analysis){ST.aiInsight=result.analysis;render()}
    else{toast('Error en el análisis: '+result.error,'err')}
  }catch(e){toast('Error conectando con la IA','err')}
  ST.aiLoading=false;render();
}

async function getTrainingPlan(){
  ST.advisorLoading=true;render();

    const result=await callEdgeFunction('training-advisor',{athlete_id:ST.user.id});
    if(result.plan){ST.trainingPlan=result.plan;render();toast('Plan generado ✓')}
    else{toast('Error generando el plan: '+result.error,'err')}

async function saveWeapon(form){
  await ensureProfile();
  let error;
  if(editItem){({error}=await sb.from('weapons').update(form).eq('id',editItem.id))}
  else{({error}=await sb.from('weapons').insert({...form,athlete_id:ST.user.id}))}
  if(!error){await loadData();ST.modal=null;editItem=null;toast(editItem?'Arma actualizada ✓':'Arma guardada ✓')}
  else toast(error.message,'err');
}

async function deleteWeapon(id){
  const{error}=await sb.from('weapons').delete().eq('id',id);
  if(!error){await loadData();toast('Arma eliminada')}
  else toast(error.message,'err');
}

async function saveAmmo(form,photoFile){
  await ensureProfile();
  let photoUrl=form.photo_url||null;
  if(photoFile){
    const ext=photoFile.name.split('.').pop();
    const path=`${ST.user.id}/${Date.now()}.${ext}`;
    const{error:ue}=await sb.storage.from('ammo-photos').upload(path,photoFile);
    if(!ue){const{data:pd}=sb.storage.from('ammo-photos').getPublicUrl(path);photoUrl=pd.publicUrl;}
  }
  const payload={...form,photo_url:photoUrl};
  let error;
  if(editItem){({error}=await sb.from('ammo_lots').update(payload).eq('id',editItem.id))}
  else{({error}=await sb.from('ammo_lots').insert({...payload,athlete_id:ST.user.id}))}
  if(!error){await loadData();ST.modal=null;editItem=null;toast('Lote guardado ✓')}
  else toast(error.message,'err');
}

async function deleteAmmo(id){
  const{error}=await sb.from('ammo_lots').delete().eq('id',id);
  if(!error){await loadData();toast('Lote eliminado')}
  else toast(error.message,'err');
}

async function updateProfile(form){
  const{error}=await sb.from('profiles').update(form).eq('id',ST.user.id);
  if(!error){await loadProfile();toast('Perfil actualizado ✓')}
  else toast(error.message,'err');

// CHART FILTER LOGIC
function getFilteredSessions(){
  let filtered=[...sessions];
  // Filtro temporal
  if(ST.chartFilter!=='all'){
    const days={'1m':30,'3m':90,'6m':180,'12m':365}[ST.chartFilter];
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);
    filtered=filtered.filter(s=>new Date(s.date)>=cutoff);
  }
  // Filtro tipo
  if(ST.chartType==='training')filtered=filtered.filter(s=>s.type==='training');
  if(ST.chartType==='competition')filtered=filtered.filter(s=>s.type==='competition');
  return filtered.slice(0,30).reverse();
}

// SESSION DETAIL PAGE
function sessionDetailHTML(){
  const s=sessions.find(x=>x.id===ST.selSession);
  if(!s)return`<div class="coming"><div class="ct">Sesión no encontrada</div></div>`;
  const wname=weapons.find(w=>w.id===s.weapon_id);
  const aname=ammos.find(a=>a.id===s.ammo_lot_id);
  const topAmmo=ammos.length?[...ammos].sort((a,b)=>(b.rating||0)-(a.rating||0))[0]:null;
  const prevSessions=sessions.filter(x=>x.id!==s.id&&x.discipline===s.discipline);
  const prevScores=prevSessions.map(x=>x.total_score||0).filter(Boolean);
  const prevAvg=prevScores.length?(prevScores.reduce((a,b)=>a+b,0)/prevScores.length).toFixed(1):null;
  const diff=prevAvg?((s.total_score||0)-parseFloat(prevAvg)).toFixed(1):null;

  return`
<div class="sess-page">
  <div class="sess-page-header">
    <div>
      <div class="sess-score-big" style="color:${sc(s.total_score)}">${s.total_score||'—'}</div>
      ${prevAvg?`<div style="font-size:11px;color:var(--t3);margin-top:2px;font-family:var(--mono)">${diff>0?'+':''}${diff} vs promedio (${prevAvg})</div>`:''}
    </div>
    <div class="sess-meta-block">
      <div class="sess-disc">${s.discipline?.replace(/_/g,' ')}</div>
      <div class="sess-date-row">
        <span class="badge ${s.type==='competition'?'bo':'bb'}">${s.type==='competition'?'Competencia':'Entrenamiento'}</span>
        <span class="txs tmuted">${fmtDate(s.date)}</span>
      </div>
      <div class="sess-stat-row">
        <div class="sess-stat"><div class="sess-stat-v">${s.total_shots||'—'}</div><div class="sess-stat-l">Disparos</div></div>
        <div class="sess-stat"><div class="sess-stat-v">${s.wind_ms!=null?s.wind_ms+'m/s':'—'}</div><div class="sess-stat-l">Viento</div></div>
        <div class="sess-stat"><div class="sess-stat-v" style="color:${s.mental_state>=8?'var(--green)':s.mental_state<=5?'var(--red)':'var(--gold)'}">${s.mental_state||'—'}/10</div><div class="sess-stat-l">Mental</div></div>
        <div class="sess-stat"><div class="sess-stat-v">${s.physical_state||'—'}/10</div><div class="sess-stat-l">Físico</div></div>
      </div>
    </div>
  </div>

  <div class="sess-grid">
    <div class="card">
      <div class="ct mb12">Equipamiento usado</div>
      <div class="mitem" style="padding:8px 0">
        <div class="micon"><svg width="14" height="14" fill="none" stroke="var(--green)" stroke-width="1.5" viewBox="0 0 24 24"><rect x="1" y="9" width="13" height="5" rx="1.5"/><rect x="14" y="10" width="5" height="3" rx="1"/></svg></div>
        <div><div class="m-name">${wname?wname.brand+' '+wname.model:'No registrado'}</div><div class="m-sub">${wname?wname.caliber+' · '+wname.type:''}</div></div>
      </div>
      <div class="mitem" style="padding:8px 0">
        <div class="micon" style="font-size:12px;color:var(--gold)">★</div>
        <div><div class="m-name">${aname?aname.brand+' '+aname.model:'Munición no registrada'}</div><div class="m-sub">${aname?'Lote: '+aname.lot_number:''}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="ct mb12">Notas de la sesión</div>
      ${s.athlete_notes?`<div class="tsm" style="font-style:italic;color:var(--t2);line-height:1.6;margin-bottom:8px">"${s.athlete_notes}"</div>`:`<div class="txs tmuted mb8">Sin notas del atleta</div>`}
      ${s.coach_notes?`<div style="background:var(--greend);border-radius:var(--rs);padding:8px 10px;font-size:11px;color:var(--green)"><strong>Entrenador:</strong> ${s.coach_notes}</div>`:''}
    </div>
  </div>

  ${s.target_photo_url?`
  <div class="card mb16">
    <div class="ct mb12">Blanco / Diana</div>
    <img src="${s.target_photo_url}" style="width:100%;max-height:320px;object-fit:contain;border-radius:8px;background:var(--fog)"/>
  </div>`:''}

  <div class="sess-ai">
    <div class="ai-card-hd">
      <div class="ai-dot"></div>
      <div class="ai-card-title">PERF AI · análisis completo</div>
      ${!ST.aiLoading&&!ST.aiInsight?`<button class="btn btn-p btn-sm" style="margin-left:auto" id="btn-analyze-sess">Analizar con IA</button>`:''}
    </div>
    ${ST.aiLoading?`<div class="ai-loading"><span class="spinner"></span> Claude está analizando tu sesión...</div>`:''}
    ${ST.aiInsight?`
    <div class="ai-card-body">
      ${ST.aiInsight.evaluacion?`<div class="ai-section"><div class="ai-section-lbl">Evaluación</div><div class="tsm">${ST.aiInsight.evaluacion}</div></div>`:''}
      ${ST.aiInsight.puntos_positivos?.length?`<div class="ai-section"><div class="ai-section-lbl">Puntos positivos</div>${ST.aiInsight.puntos_positivos.map(p=>`<div class="ai-point"><div class="ai-point-dot" style="background:var(--green)"></div>${p}</div>`).join('')}</div>`:''}
      ${ST.aiInsight.areas_mejora?.length?`<div class="ai-section"><div class="ai-section-lbl">Áreas de mejora</div>${ST.aiInsight.areas_mejora.map(p=>`<div class="ai-point"><div class="ai-point-dot" style="background:var(--gold)"></div>${p}</div>`).join('')}</div>`:''}
      ${ST.aiInsight.proxima_sesion?`<div class="ai-section"><div class="ai-section-lbl">Próxima sesión recomendada</div>
        <div style="background:var(--fog);border-radius:var(--rs);padding:10px 12px">
          <div class="tsm" style="font-weight:500;margin-bottom:4px">${ST.aiInsight.proxima_sesion.descripcion||''}</div>
          <div class="txs tmuted">${ST.aiInsight.proxima_sesion.tiros_recomendados||60} tiros · Foco: ${ST.aiInsight.proxima_sesion.foco||'—'} · ${ST.aiInsight.proxima_sesion.tipo||'entrenamiento'}</div>
        </div>
      </div>`:''}
      ${ST.aiInsight.alerta?`<div style="background:var(--redd);border-radius:var(--rs);padding:10px 12px;font-size:12px;color:var(--red);margin-top:8px"><strong>⚠ Alerta:</strong> ${ST.aiInsight.alerta}</div>`:''}
    </div>`:`${!ST.aiLoading?`<div class="txs tmuted" style="margin-top:8px">Hacé clic en "Analizar con IA" para obtener un análisis detallado de esta sesión con Claude.</div>`:''}`}
  </div>
</div>`;
}

      <div class="fg2">
        <div class="fg"><label class="fl">Marca *</label><input class="fi" id="ab" placeholder="RWS, Lapua..." value="${a?.brand||''}"/></div>
        <div class="fg"><label class="fl">Modelo</label><input class="fi" id="am" value="${a?.model||''}"/></div>
      </div>
      <div class="fg2">
        <div class="fg"><label class="fl">Nº de lote *</label><input class="fi" id="al" placeholder="2024-B-0312" value="${a?.lot_number||''}"/></div>
        <div class="fg"><label class="fl">Calibre</label><select class="fs" id="ac"><option ${a?.caliber==='4.5mm'||!a?'selected':''}>4.5mm</option><option ${a?.caliber==='5.5mm'?'selected':''}>5.5mm</option><option ${a?.caliber==='.22 LR'?'selected':''}>.22 LR</option></select></div>
      </div>
      <div class="fg2">
        <div class="fg"><label class="fl">Cantidad</label><input class="fi" id="aq" type="number" value="${a?.quantity||''}"/></div>
        <div class="fg"><label class="fl">Rating</label>
          <div class="stars" id="rating-stars" style="margin-top:8px">${[1,2,3,4,5].map(i=>`<span class="star ${i<=(a?.rating||0)?'on':'off'}" data-r="${i}" style="font-size:20px">★</span>`).join('')}</div>
          <input type="hidden" id="ar" value="${a?.rating||0}"/>
        </div>
      </div>
      <div class="fg"><label class="fl">Comentarios</label><textarea class="fta" id="ac2">${a?.comment||''}</textarea></div>
      <div class="upload-zone"><input type="file" id="photo-file" accept="image/*"/>
        <div style="pointer-events:none">${I.upl}</div>
        <div style="font-size:12px;color:var(--t2);margin-top:6px;pointer-events:none" id="photo-name">${a?.photo_url?'Foto cargada ✓':'Subir foto de agrupación'}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px;pointer-events:none">PNG, JPG hasta 10MB</div>
      </div>
    </div>
    <div class="mft"><button class="btn btn-s" id="cm2">Cancelar</button><button class="btn btn-p" id="btn-sa">${a?'Actualizar':'Guardar lote'}</button></div>
    </div></div>`;
  }
  return'';
}

// BIND
function bind(){
  document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{ST.page=el.dataset.page;ST.modal=null;ST.aiInsight=null;render()}));
  $('go-prf')?.addEventListener('click',()=>{ST.page='profile';render()});
  $('btn-so')?.addEventListener('click',signOut);
  $('btn-back')?.addEventListener('click',()=>{ST.page='home';ST.selSession=null;ST.aiInsight=null;render()});

  // Auth
  $('btn-li')?.addEventListener('click',async()=>{
    const e=$('ae').value,p=$('ap').value;
    if(!e||!p)return;
    $('btn-li').innerHTML='<span class="spinner"></span>';
    const err=await signIn(e,p);
    if(err)$('auth-inner').innerHTML=loginHTML(err);
  });
  $('to-reg')?.addEventListener('click',()=>{$('auth-inner').innerHTML=regHTML();bind()});
  $('to-li')?.addEventListener('click',()=>{$('auth-inner').innerHTML=loginHTML();bind()});
  document.querySelectorAll('.rcard').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('.rcard').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');$('rrole').value=c.dataset.role;
  }));
  $('btn-reg')?.addEventListener('click',async()=>{
    const n=$('rn').value,e=$('re').value,p=$('rp').value,r=$('rrole').value;
    if(!n||!e||!p)return;
    $('btn-reg').innerHTML='<span class="spinner"></span>';
    const err=await signUp(e,p,n,r);
    if(err)$('auth-inner').innerHTML=regHTML(err);
  });

  // Chart filters
  document.querySelectorAll('[data-cf]').forEach(el=>el.addEventListener('click',()=>{ST.chartFilter=el.dataset.cf;render()}));
  document.querySelectorAll('[data-ct]').forEach(el=>el.addEventListener('click',()=>{ST.chartType=el.dataset.ct;render()}));

  // Sessions → detail page
  document.querySelectorAll('[data-sess]').forEach(el=>el.addEventListener('click',()=>{
    ST.selSession=el.dataset.sess;
    ST.page='session_detail';
    ST.aiInsight=null;
    render();
  }));

  // Dashboard quick add
  $('btn-add-w-dash')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  $('btn-add-a-dash')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});

  // Training Advisor
  $('btn-get-plan')?.addEventListener('click',getTrainingPlan);

  // AI close
  $('btn-close-ai')?.addEventListener('click',()=>{ST.aiInsight=null;render()});

  // Analyze session
  $('btn-analyze-sess')?.addEventListener('click',()=>{if(ST.selSession)analyzeSession(ST.selSession)});

  // Weapons
  $('btn-add-w')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  document.querySelectorAll('[data-edit-w]').forEach(el=>el.addEventListener('click',()=>{editItem=weapons.find(w=>w.id===el.dataset.editW);ST.modal='weapon';render()}));
  document.querySelectorAll('[data-del-w]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('¿Eliminar esta arma?'))await deleteWeapon(el.dataset.delW)}));

  // Ammo
  $('btn-add-a')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});
  document.querySelectorAll('[data-edit-a]').forEach(el=>el.addEventListener('click',()=>{editItem=ammos.find(a=>a.id===el.dataset.editA);ST.modal='ammo';render()}));
  document.querySelectorAll('[data-del-a]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('¿Eliminar este lote?'))await deleteAmmo(el.dataset.delA)}));

  // Modal close
  $('cm')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('cm2')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('mov')?.addEventListener('click',e=>{if(e.target.id==='mov'){ST.modal=null;editItem=null;render()}});

  // Save weapon
  $('btn-sw')?.addEventListener('click',async()=>{
    const brand=$('wb').value,model=$('wm').value;
    if(!brand||!model){toast('Marca y modelo son obligatorios','err');return}
    $('btn-sw').innerHTML='<span class="spinner"></span>';
    await saveWeapon({type:$('wt').value,brand,model,serial:$('ws').value,caliber:$('wc').value,year:parseInt($('wy').value)||null,notes:$('wn').value,active:true});
  });

  // Rating stars
  document.querySelectorAll('#rating-stars .star').forEach(star=>star.addEventListener('click',()=>{
    const r=parseInt(star.dataset.r);
    $('ar').value=r;
    document.querySelectorAll('#rating-stars .star').forEach((s,i)=>{s.className=`star ${i<r?'on':'off'}`;s.style.fontSize='20px'});
  }));

  // Photo file
  $('photo-file')?.addEventListener('change',e=>{const f=e.target.files[0];if(f&&$('photo-name'))$('photo-name').textContent=`✓ ${f.name}`});

  // Save ammo
  $('btn-sa')?.addEventListener('click',async()=>{
    const brand=$('ab').value,lot=$('al').value;
    if(!brand||!lot){toast('Marca y lote son obligatorios','err');return}
    $('btn-sa').innerHTML='<span class="spinner"></span>';
    await saveAmmo({brand,lot_number:lot,model:$('am').value,caliber:$('ac').value,quantity:parseInt($('aq').value)||0,rating:parseInt($('ar').value)||null,comment:$('ac2').value,photo_url:editItem?.photo_url||null},$('photo-file')?.files[0]||null);
  });

  // Profile
  $('btn-save-prf')?.addEventListener('click',async()=>updateProfile({full_name:$('pn').value,club:$('pc').value,category:$('pcat').value}));
}

init();
</script>
</body>
</html>
