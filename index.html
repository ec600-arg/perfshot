<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERF SHOT — Shooting Performance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0B1C2D;--navy2:#132638;--navy3:#1E3A54;
  --green:#1D9E75;--greenl:#5DCAA5;--greend:rgba(29,158,117,.10);
  --blue:#4DB8FF;--blued:rgba(77,184,255,.08);
  --red:#E8462A;--redd:rgba(232,70,42,.08);
  --gold:#EF9F27;--goldd:rgba(239,159,39,.10);
  --fog:#F4F7FB;--fog2:#EBF0F7;--white:#fff;
  --t:#0B1C2D;--t2:#4A6278;--t3:#8BA5BB;
  --b:rgba(11,28,45,.08);--b2:rgba(11,28,45,.04);
  --r:12px;--rs:8px;--sh:0 1px 3px rgba(11,28,45,.07);
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--fog);color:var(--t);min-height:100vh;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
.app{display:flex;min-height:100vh}
.sb{width:210px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:20px 16px 14px;border-bottom:1px solid var(--navy3)}
.sb-wm{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:.04em;color:#fff}
.sb-wm span{color:var(--green)}
.sb-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6B8FAF;margin-top:2px}
.sb-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.sb-sec{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#3A5570;padding:8px 8px 3px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:#6B8FAF;font-size:12px;border:none;background:none;width:100%;text-align:left;transition:background .15s}
.sb-item:hover{background:var(--navy2);color:#9DBDD4}
.sb-item.on{background:rgba(29,158,117,.15);color:var(--greenl)}
.sb-badge{margin-left:auto;font-size:9px;font-family:var(--mono);background:rgba(29,158,117,.2);color:var(--greenl);padding:1px 5px;border-radius:20px}
.sb-user{padding:12px 14px;border-top:1px solid var(--navy3);display:flex;align-items:center;gap:9px;cursor:pointer}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.sb-nm{font-size:12px;font-weight:500;color:#9DBDD4}
.sb-rl{font-size:10px;color:#3A5570}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--b);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.tb-title{font-family:var(--disp);font-size:15px;font-weight:600}
.content{padding:20px 24px;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);font-family:var(--body);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:#189060}
.btn-s{background:var(--white);color:var(--t2);border:1px solid var(--b)}.btn-s:hover{background:var(--fog)}
.btn-d{background:var(--redd);color:var(--red);border:1px solid rgba(232,70,42,.2)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-i{padding:7px;border-radius:var(--rs);background:var(--white);border:1px solid var(--b);cursor:pointer;color:var(--t2);transition:all .15s;display:inline-flex;align-items:center}
.btn-i:hover{background:var(--fog2)}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--b);padding:18px;box-shadow:var(--sh)}
.ct{font-family:var(--disp);font-size:13px;font-weight:600}
.cs{font-size:11px;color:var(--t3);margin-top:1px}
/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.metric.m-green::before{background:var(--green)}
.metric.m-gold::before{background:var(--gold)}
.metric.m-blue::before{background:var(--blue)}
.metric.m-navy::before{background:var(--navy)}
.metric-val{font-family:var(--disp);font-size:28px;font-weight:800;color:var(--t);line-height:1;margin-bottom:3px}
.metric-val .dec{font-size:14px;color:var(--t3)}
.metric-lbl{font-size:10px;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.metric-delta{font-size:10px;font-family:var(--mono)}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--t3)}
/* DASHBOARD HERO */
.dash-hero{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh)}
.dash-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.dash-greet{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--t);line-height:1.2}
.dash-greet span{color:var(--green)}
.dash-sub{font-size:12px;color:var(--t3);margin-top:4px}
.ai-badge{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--greend);border:1px solid rgba(29,158,117,.2);border-radius:20px;cursor:pointer;transition:all .15s}
.ai-badge:hover{background:rgba(29,158,117,.15)}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ai-badge-text{font-size:11px;font-weight:500;color:var(--green)}
/* CHART */
.chart-card{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.chart-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.chart-filters{display:flex;gap:4px;flex-wrap:wrap}
.cf{font-size:10px;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--b);background:var(--fog);color:var(--t3);font-family:var(--body);transition:all .15s}
.cf:hover{border-color:var(--green);color:var(--green)}
.cf.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cf.comp-on{background:var(--gold);color:#fff;border-color:var(--gold)}
.chart-legend{display:flex;gap:12px;margin-bottom:10px}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3)}
.leg-dot{width:8px;height:8px;border-radius:50%}
.bars{height:100px;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;border-radius:3px 3px 0 0;cursor:pointer;position:relative;min-width:6px;transition:opacity .15s}
.bar:hover{opacity:.8}
.bar-tip{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}
.bar:hover .bar-tip{opacity:1}
.chart-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:var(--t3);font-family:var(--mono)}
.chart-stats{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--b2)}
.cs-item{display:flex;flex-direction:column;gap:1px}
.cs-val{font-family:var(--disp);font-size:15px;font-weight:700}
.cs-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
/* AI CARD */
.ai-card{background:var(--white);border:1px solid rgba(29,158,117,.2);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px;position:relative;overflow:hidden}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue))}
.ai-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai-title{font-size:11px;font-weight:500;color:var(--green);letter-spacing:.06em;text-transform:uppercase}
.ai-body{font-size:12px;color:var(--t2);line-height:1.7}
.ai-body strong{color:var(--t);font-weight:500}
.ai-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ai-act{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--b);background:var(--fog);color:var(--t2);cursor:pointer;transition:all .15s;font-family:var(--body)}
.ai-act:hover{background:var(--greend);border-color:rgba(29,158,117,.3);color:var(--green)}
/* SESSIONS LIST */
.sess-list{background:var(--white);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.sl-hd{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b2)}
.see-all{font-size:11px;color:var(--green);cursor:pointer;display:flex;align-items:center;gap:3px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--b2)}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--fog)}
.s-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.s-date{font-family:var(--mono);font-size:10px;color:var(--t3);min-width:76px}
.s-info{flex:1}
.s-disc{font-size:12px;font-weight:500}
.s-meta{font-size:10px;color:var(--t3);margin-top:1px}
.s-score{font-family:var(--disp);font-size:18px;font-weight:700;min-width:40px;text-align:right}
/* BOTTOM GRID */
.btm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.mini{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.mini-t{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mitem{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b2)}
.mitem:last-child{border-bottom:none}
.micon{width:30px;height:30px;border-radius:7px;background:var(--fog2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stars{display:flex;gap:1px}
.star{font-size:11px;cursor:pointer}.star.on{color:var(--gold)}.star.off{color:var(--b)}
.adv-card{background:var(--navy);border-radius:var(--r);padding:16px}
.adv-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.adv-title{font-family:var(--disp);font-size:13px;font-weight:600;color:#fff;margin-bottom:8px}
.adv-item{font-size:11px;color:#6B8FAF;display:flex;align-items:flex-start;gap:6px;margin-bottom:5px;line-height:1.4}
.adv-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px}
.adv-btn{width:100%;margin-top:10px;padding:9px;border-radius:var(--rs);background:var(--green);color:#fff;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--disp);transition:background .15s}
.adv-btn:hover{background:#189060}
/* WIZARD */
.wizard{background:var(--white);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wizard-steps{display:flex;border-bottom:1px solid var(--b);background:var(--fog)}
.wstep{flex:1;padding:14px 16px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);position:relative}
.wstep.active{color:var(--green);background:var(--white)}
.wstep.done{color:var(--green)}
.wstep-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--b);color:var(--t3);flex-shrink:0}
.wstep.active .wstep-num{background:var(--green);color:#fff}
.wstep.done .wstep-num{background:var(--greend);color:var(--green)}
.wizard-body{padding:24px}
.wizard-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--b)}
/* SHOT GRID */
.shot-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.shot-inp{text-align:center;padding:6px 2px;border-radius:5px;border:1px solid var(--b);background:var(--fog);font-family:var(--mono);font-size:11px;font-weight:500;color:var(--t);width:100%;transition:all .15s}
.shot-inp:focus{outline:none;border-color:var(--green);background:var(--white)}
.shot-inp.hi{background:var(--greend);border-color:rgba(29,158,117,.2);color:var(--green)}
.shot-inp.lo{background:var(--redd);border-color:rgba(232,70,42,.2);color:var(--red)}
.shot-series-lbl{grid-column:1/-1;font-size:9px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-top:8px;margin-bottom:2px}
/* SESSION PAGE */
.sess-page{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sess-hdr{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh);display:flex;align-items:flex-start;gap:20px}
.big-score{font-family:var(--disp);font-size:64px;font-weight:800;line-height:1}
.sess-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.ss-stat{background:var(--fog);border-radius:var(--rs);padding:10px 12px}
.ss-v{font-family:var(--disp);font-size:18px;font-weight:700}
.ss-l{font-size:10px;color:var(--t3);margin-top:1px;text-transform:uppercase;letter-spacing:.04em}
.plan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.plan-day{border-radius:6px;padding:7px 3px;text-align:center}
.plan-day-n{font-size:9px;color:var(--t3);margin-bottom:2px;font-weight:500}
.plan-day-v{font-size:10px;font-weight:500}
.pd-ent{background:var(--greend);border:1px solid rgba(29,158,117,.15)}
.pd-comp{background:var(--goldd);border:1px solid rgba(239,159,39,.15)}
.pd-desc{background:var(--fog2);border:1px solid var(--b)}
.pd-test{background:var(--blued);border:1px solid rgba(77,184,255,.15)}
/* COACH DASHBOARD */
.coach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:16px}
.athlete-card{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:16px;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .15s}
.athlete-card:hover{box-shadow:0 4px 20px rgba(11,28,45,.1)}
.ath-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ath-av{width:40px;height:40px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;font-weight:700;color:var(--greenl);flex-shrink:0}
.ath-name{font-family:var(--disp);font-size:13px;font-weight:600}
.ath-sub{font-size:11px;color:var(--t3)}
.ath-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.ath-stat{text-align:center}
.ath-sv{font-family:var(--disp);font-size:16px;font-weight:700}
.ath-sl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em}
.trend-bar{height:32px;display:flex;align-items:flex-end;gap:2px}
.tb{flex:1;border-radius:2px 2px 0 0;min-width:4px}
/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-day-name{text-align:center;font-size:10px;font-weight:500;color:var(--t3);padding:4px;text-transform:uppercase;letter-spacing:.06em}
.cal-day{min-height:72px;background:var(--white);border:1px solid var(--b);border-radius:var(--rs);padding:6px;cursor:pointer;transition:background .15s;position:relative}
.cal-day:hover{background:var(--fog)}
.cal-day.today{border-color:var(--green);background:var(--greend)}
.cal-day.other-month{opacity:.4}
.cal-day-num{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:3px}
.cal-event{font-size:9px;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal-event.training{background:var(--greend);color:var(--green)}
.cal-event.competition{background:var(--goldd);color:#7a4a00}
/* FORMS */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fl{font-size:10px;font-weight:500;color:var(--t2);letter-spacing:.04em;text-transform:uppercase}
.fi,.fs,.fta{padding:9px 11px;border-radius:var(--rs);border:1px solid var(--b);background:var(--fog);font-family:var(--body);font-size:13px;color:var(--t);width:100%;transition:border-color .15s}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--green);background:var(--white);box-shadow:0 0 0 3px var(--greend)}
.fta{resize:vertical;min-height:70px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1}
.range-val{font-family:var(--mono);font-size:12px;font-weight:500;min-width:28px;text-align:center}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.bg{background:var(--greend);color:var(--green)}
.bb{background:var(--blued);color:#185FA5}
.bo{background:var(--goldd);color:#7a4a00}
.bgr{background:var(--fog2);color:var(--t2)}
.br{background:var(--redd);color:var(--red)}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(11,28,45,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:14px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:mIn .18s ease;box-shadow:0 20px 60px rgba(11,28,45,.2)}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mhd{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--white);z-index:1;border-radius:14px 14px 0 0}
.mt{font-family:var(--disp);font-size:14px;font-weight:600}
.mb{padding:16px 20px}
.mft{padding:12px 20px;border-top:1px solid var(--b);display:flex;gap:8px;justify-content:flex-end}
/* EQUIP / AMMO */
.ecard{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sh);transition:box-shadow .15s}
.ecard:hover{box-shadow:0 4px 16px rgba(11,28,45,.1)}
.eicon{width:42px;height:42px;border-radius:var(--rs);background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acard{background:var(--white);border:1px solid var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.aphoto{width:100%;height:80px;border-radius:var(--rs);background:var(--fog2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);margin:8px 0;overflow:hidden}
.aphoto img{width:100%;height:100%;object-fit:cover}
.upload-zone{border:2px dashed var(--b);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--fog);position:relative}
.upload-zone:hover{border-color:var(--green);background:var(--greend)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:12px;z-index:999;animation:mIn .2s ease;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(11,28,45,.2)}
.toast.ok{border-left:3px solid var(--green)}.toast.err{border-left:3px solid var(--red)}
/* AUTH */
.auth-sc{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);background-image:radial-gradient(circle at 20% 80%,rgba(29,158,117,.08),transparent 60%),radial-gradient(circle at 80% 20%,rgba(77,184,255,.05),transparent 60%)}
.auth-card{width:100%;max-width:380px;padding:36px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.auth-lm{font-family:var(--disp);font-size:30px;font-weight:800;color:#fff;text-align:center;letter-spacing:.05em}
.auth-lm span{color:var(--green)}
.auth-ls{font-size:10px;letter-spacing:.15em;color:#6B8FAF;text-transform:uppercase;text-align:center;margin-top:2px;margin-bottom:24px}
.auth-in{width:100%;padding:10px 12px;border-radius:var(--rs);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-family:var(--body);font-size:13px;margin-bottom:8px}
.auth-in::placeholder{color:#3A5570}
.auth-in:focus{outline:none;border-color:var(--green)}
.auth-btn{width:100%;padding:11px;border-radius:var(--rs);background:var(--green);color:#fff;font-family:var(--disp);font-size:13px;font-weight:700;border:none;cursor:pointer;transition:background .15s;margin-top:2px}
.auth-btn:hover{background:#189060}
.auth-err{background:var(--redd);color:var(--red);padding:8px 12px;border-radius:var(--rs);font-size:12px;margin-bottom:10px;border:1px solid rgba(232,70,42,.2)}
.auth-sw{text-align:center;margin-top:14px;font-size:12px;color:#3A5570}
.auth-sw a{color:var(--greenl);cursor:pointer}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.rcard{padding:14px;border-radius:var(--rs);border:2px solid rgba(255,255,255,.08);cursor:pointer;transition:all .15s;text-align:center}
.rcard:hover,.rcard.on{border-color:var(--green);background:rgba(29,158,117,.1)}
.rcard-n{font-size:12px;font-weight:500;color:#9DBDD4;margin-top:4px}
.rcard.on .rcard-n{color:var(--greenl)}
/* UTILS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.flex{display:flex}.ic{align-items:center}.jb{justify-content:space-between}
.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mb16{margin-bottom:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.tsm{font-size:12px}.txs{font-size:11px}.tmuted{color:var(--t3)}.tgreen{color:var(--green)}
.tmono{font-family:var(--mono)}.wf{width:100%}
.spinner{width:14px;height:14px;border:2px solid var(--greend);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);flex-direction:column;gap:16px}
.load-logo{font-family:var(--disp);font-size:32px;font-weight:800;color:#fff;letter-spacing:.05em}
.load-logo span{color:var(--green)}
.coming{background:var(--white);border:1px solid var(--b);border-radius:var(--r);min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:32px;text-align:center;box-shadow:var(--sh)}
@media(max-width:768px){.sb{display:none}.main{margin-left:0}.metrics,.btm,.g2,.g3,.sess-stats,.fg2,.fg3,.coach-grid,.plan-grid{grid-template-columns:1fr}}

// AUTH
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){ST.user=session.user;await loadProfile();await loadData()}
  ST.loading=false;render();
  sb.auth.onAuthStateChange(async(e,s)=>{
    ST.user=s?.user||null;
    if(ST.user){await loadProfile();await loadData()}
    else{ST.profile=null;weapons=[];ammos=[];sessions=[]}
    render();
  });
}

async function loadProfile(){
  const{data}=await sb.from('profiles').select('*').eq('id',ST.user.id).single();
  ST.profile=data;
}

async function loadData(){
  const uid=ST.user.id;
  const[w,a,s,ce]=await Promise.all([
    sb.from('weapons').select('*').eq('athlete_id',uid).order('created_at',{ascending:false}),
    sb.from('ammo_lots').select('*').eq('athlete_id',uid).order('created_at',{ascending:false}),
    sb.from('sessions').select('*').eq('athlete_id',uid).order('date',{ascending:false}).limit(50),
    sb.from('calendar_events').select('*').eq('athlete_id',uid).order('date',{ascending:true}),
  ]);
  weapons=w.data||[];ammos=a.data||[];sessions=s.data||[];
  ST.calEvents=ce.data||[];
}

// EDGE FUNCTIONS
async function callEdge(name,body){
  const{data:{session}}=await sb.auth.getSession();
  const res=await fetch(`${SURL}/functions/v1/${name}`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token}`},
    body:JSON.stringify(body)
  });
  return res.json();
}

async function analyzeSession(id){
  ST.aiLoading=true;ST.aiInsight=null;render();
  const r=await callEdge('analyze-session',{session_id:id});
  ST.aiLoading=false;
  if(r.analysis){ST.aiInsight=r.analysis;toast('Análisis completado ✓')}

// DATA OPS
async function saveSession(){
  await ensureProfile();
  const d=ST.wizardData;
  const shotsData=ST.shots.filter(s=>s>0);
  const total=shotsData.reduce((a,b)=>a+parseFloat(b||0),0);
  const{data:sess,error}=await sb.from('sessions').insert({
    athlete_id:ST.user.id,
    type:d.type||'training',
    discipline:d.discipline||'10m_pistola_aire_m',
    date:d.date||new Date().toISOString().split('T')[0],
    weapon_id:d.weapon_id||null,
    ammo_lot_id:d.ammo_lot_id||null,
    total_score:parseFloat(total.toFixed(1)),
    total_shots:shotsData.length,
    wind_ms:d.wind?parseFloat(d.wind):null,
    temperature_c:d.temp?parseFloat(d.temp):null,
    mental_state:d.mental?parseInt(d.mental):null,
    physical_state:d.physical?parseInt(d.physical):null,
    athlete_notes:d.notes||null,
    import_source:d.source||'manual',
    target_photo_url:d.target_photo||null,
  }).select().single();
  if(error){toast(error.message,'err');return}
  // Guardar tiros individuales
  if(shotsData.length>0&&sess){
    const shotsInsert=shotsData.map((val,i)=>({
      session_id:sess.id,
      shot_number:i+1,
      series:Math.floor(i/10)+1,
      score:parseFloat(val)
    }));
    await sb.from('shots').insert(shotsInsert);
  }
  await loadData();
  ST.page='home';ST.wizardStep=1;ST.wizardData={};ST.shots=[];
  toast('Sesión guardada ✓');
  // Auto-analizar
  if(sess)setTimeout(()=>analyzeSession(sess.id),500);
  render();
}

async function saveAmmo(form,photoFile){
  await ensureProfile();
  let photoUrl=form.photo_url||null;
  if(photoFile){
    const ext=photoFile.name.split('.').pop();
    const path=`${ST.user.id}/${Date.now()}.${ext}`;
    const{error:ue}=await sb.storage.from('ammo-photos').upload(path,photoFile);
    if(!ue){const{data:pd}=sb.storage.from('ammo-photos').getPublicUrl(path);photoUrl=pd.publicUrl;}
  }
  const payload={...form,photo_url:photoUrl};
  let error;
  if(editItem){({error}=await sb.from('ammo_lots').update(payload).eq('id',editItem.id))}
  else{({error}=await sb.from('ammo_lots').insert({...payload,athlete_id:ST.user.id}))}
  if(!error){await loadData();ST.modal=null;editItem=null;toast('Lote guardado ✓')}
  else toast(error.message,'err');
}

async function deleteAmmo(id){

// CHART FILTER
function getChartData(){
  let d=[...sessions];
  if(ST.chartFilter!=='all'){
    const days={'1m':30,'3m':90,'6m':180,'12m':365}[ST.chartFilter];
    const cut=new Date();cut.setDate(cut.getDate()-days);
    d=d.filter(s=>new Date(s.date)>=cut);
  }
  if(ST.chartType==='training')d=d.filter(s=>s.type==='training');
  if(ST.chartType==='competition')d=d.filter(s=>s.type==='competition');
  return d.slice(0,40).reverse();
}

function pageHTML(){
  switch(ST.page){

    case'new-session':return wizardHTML();

    case'session-detail':return sessionDetailHTML();

function wizardStep2(){
  const d=ST.wizardData;
  const totalShots=DISC_SHOTS[d.discipline]||60;

  const shotsArr=ST.shots.length===totalShots?ST.shots:Array(totalShots).fill('');
  const filledShots=shotsArr.filter(s=>s>0);
  const total=filledShots.reduce((a,b)=>a+parseFloat(b||0),0);

  return`
<div class="flex ic jb mb14">
  <div>
    <div class="ct">Carga de puntaje</div>
    <div class="cs">${DISC_LABELS[d.discipline]||''} · ${totalShots} disparos</div>
  </div>
  <div class="flex gap6">
    ${total>0?`<div style="font-family:var(--disp);font-size:20px;font-weight:800;color:var(--green)">${total.toFixed(1)}</div>`:''}
    <label class="btn btn-s btn-sm" style="cursor:pointer">
      ${I.upl} Importar SIUS/CSV
      <input type="file" id="sius-file" accept=".csv,.txt,.sius" style="display:none"/>
    </label>
  </div>
</div>
<div id="sius-loading" class="flex ic gap8 mb12" style="display:none!important"><span class="spinner"></span><span class="txs tmuted">Procesando con Claude AI...</span></div>
${Array.from({length:series}).map((_,si)=>`
<div class="shot-grid">
  <div class="shot-series-lbl" style="grid-column:1/-1">Serie ${si+1} ${shotsArr.slice(si*10,(si+1)*10).filter(s=>s>0).length>0?'· Subtotal: '+shotsArr.slice(si*10,(si+1)*10).filter(s=>s>0).reduce((a,b)=>a+parseFloat(b||0),0).toFixed(1):''}</div>
  ${Array.from({length:10}).map((_,ti)=>{
    const idx=si*10+ti;
    const val=shotsArr[idx]||'';
    const numVal=parseFloat(val);
    const cls=val===''?'':numVal>=10?'hi':numVal<=8?'lo':'';
    return`<input class="shot-inp ${cls}" type="number" min="0" max="11" step="0.1" placeholder="${idx+1}" value="${val}" data-idx="${idx}" id="shot-${idx}"/>`;

// CALENDAR
function calendarHTML(){
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const m=ST.calMonth,y=ST.calYear;
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();
  const pad=(n)=>n<10?'0'+n:n;
  const eventsThisMonth=ST.calEvents.filter(e=>{
    const d=new Date(e.date+'T00:00:00');
    return d.getMonth()===m&&d.getFullYear()===y;
  });
  const sessionsThisMonth=sessions.filter(s=>{
    const d=new Date(s.date+'T00:00:00');
    return d.getMonth()===m&&d.getFullYear()===y;
  });

  const dayNames=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const cells=[];
  for(let i=0;i<(firstDay===0?6:firstDay-1);i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);

  return`
<div class="flex ic jb mb16">
  <div style="display:flex;align-items:center;gap:12px">
    <button class="btn-i" id="cal-prev">${I.back}</button>
    <div style="font-family:var(--disp);font-size:16px;font-weight:700">${months[m]} ${y}</div>
    <button class="btn-i" id="cal-next" style="transform:rotate(180deg)">${I.back}</button>
  </div>
  <button class="btn btn-p btn-sm" id="btn-add-event">${I.plus} Agregar evento</button>
</div>
<div class="card">
  <div class="cal-header">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
  <div class="cal-grid">
    ${cells.map(d=>{
      if(!d)return`<div></div>`;
      const dateStr=`${y}-${pad(m+1)}-${pad(d)}`;
      const isToday=today.getDate()===d&&today.getMonth()===m&&today.getFullYear()===y;
      const daySessions=sessionsThisMonth.filter(s=>s.date===dateStr);
      const dayEvents=eventsThisMonth.filter(e=>e.date===dateStr);
      return`<div class="cal-day ${isToday?'today':''}">
        <div class="cal-day-num" style="${isToday?'color:var(--green);font-weight:700':''}">${d}</div>
        ${daySessions.map(s=>`<div class="cal-event ${s.type}">${s.total_score||'—'} pts</div>`).join('')}
        ${dayEvents.map(e=>`<div class="cal-event ${e.event_type||'training'}">${e.title.substring(0,12)}</div>`).join('')}
      </div>`;
    }).join('')}
  </div>
</div>
<div class="card mt12">
  <div class="ct mb12">Próximos eventos y sesiones</div>
  ${[...ST.calEvents.filter(e=>new Date(e.date+'T00:00:00')>=today),...sessions.filter(s=>new Date(s.date+'T00:00:00')>=today)]
    .sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,5).map(item=>{
      const isSess='total_score'in item;
      return`<div class="mitem"><div class="micon" style="background:${isSess?(item.type==='competition'?'var(--goldd)':'var(--greend)'):'var(--blued)'}"><svg width="12" height="12" fill="none" stroke="${isSess?'var(--green)':'var(--blue)'}" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg></div><div style="flex:1"><div style="font-size:11px;font-weight:500">${isSess?DISC_LABELS[item.discipline]||item.discipline:item.title}</div><div class="txs tmuted">${item.date} · ${isSess?item.type==='competition'?'Competencia':'Entrenamiento':item.event_type||'evento'}</div></div>${isSess&&item.total_score?`<div style="font-family:var(--disp);font-size:14px;font-weight:700;color:${sc(item.total_score)}">${item.total_score}</div>`:''}</div>`;
    }).join('')||'<div class="txs tmuted">Sin eventos próximos</div>'}
</div>`;
}

      <div class="fg2">
        <div class="fg"><label class="fl">Cantidad</label><input class="fi" id="aq" type="number" value="${a?.quantity||''}"/></div>
        <div class="fg"><label class="fl">Rating</label>
          <div class="stars" id="rating-stars" style="margin-top:8px">${[1,2,3,4,5].map(i=>`<span class="star ${i<=(a?.rating||0)?'on':'off'}" data-r="${i}" style="font-size:20px">★</span>`).join('')}</div>
          <input type="hidden" id="ar" value="${a?.rating||0}"/>
        </div>
      </div>
      <div class="fg"><label class="fl">Comentarios</label><textarea class="fta" id="ac2">${a?.comment||''}</textarea></div>
      <div class="upload-zone"><input type="file" id="photo-file" accept="image/*"/>
        <div style="pointer-events:none">${I.upl}</div>
        <div style="font-size:12px;color:var(--t2);margin-top:6px;pointer-events:none" id="photo-name">${a?.photo_url?'Foto cargada ✓':'Subir foto de agrupación'}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px;pointer-events:none">PNG, JPG hasta 10MB</div>
      </div>
    </div>
    <div class="mft"><button class="btn btn-s" id="cm2">Cancelar</button><button class="btn btn-p" id="btn-sa">${a?'Actualizar':'Guardar'}</button></div>
    </div></div>`;
  }
  if(ST.modal==='cal-event'){return`<div class="ov" id="mov"><div class="modal">
    <div class="mhd"><div class="mt">Agregar evento al calendario</div><button class="btn-i" id="cm">${I.x}</button></div>
    <div class="mb">
      <div class="fg"><label class="fl">Título *</label><input class="fi" id="ce-title" placeholder="Entrenamiento, competencia..."/></div>
      <div class="fg2">
        <div class="fg"><label class="fl">Fecha *</label><input class="fi" id="ce-date" type="date" value="${new Date().toISOString().split('T')[0]}"/></div>
        <div class="fg"><label class="fl">Tipo</label><select class="fs" id="ce-type"><option value="training">Entrenamiento</option><option value="competition">Competencia</option><option value="rest">Descanso</option><option value="test">Test</option></select></div>
      </div>
      <div class="fg2">
        <div class="fg"><label class="fl">Disciplina</label><select class="fs" id="ce-disc"><option value="">Sin especificar</option>${Object.entries(DISC_LABELS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
        <div class="fg"><label class="fl">Hora</label><input class="fi" id="ce-time" type="time" value="09:00"/></div>
      </div>
      <div class="fg"><label class="fl">Notas</label><textarea class="fta" id="ce-notes" placeholder="Objetivo, lugar, detalles..."></textarea></div>
    </div>
    <div class="mft"><button class="btn btn-s" id="cm2">Cancelar</button><button class="btn btn-p" id="btn-ce-save">Guardar evento</button></div>
    </div></div>`}
  return'';
}

// BIND ALL EVENTS
function bind(){
  document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{
    ST.page=el.dataset.page;ST.modal=null;ST.aiInsight=null;
    if(el.dataset.page==='new-session'){ST.wizardStep=1;ST.wizardData={};ST.shots=[]}
    render();
  }));
  $('go-prf')?.addEventListener('click',()=>{ST.page='profile';render()});
  $('btn-so')?.addEventListener('click',signOut);
  $('btn-back')?.addEventListener('click',()=>{
    if(ST.page==='session-detail'){ST.page='sessions-list';ST.selSession=null;ST.aiInsight=null}
    else ST.page='home';
    render();
  });

  // AUTH
  $('btn-li')?.addEventListener('click',async()=>{
    const e=$('ae').value,p=$('ap').value;
    if(!e||!p)return;
    $('btn-li').innerHTML='<span class="spinner"></span>';
    const err=await signIn(e,p);
    if(err)$('auth-inner').innerHTML=loginHTML(err);
  });
  $('to-reg')?.addEventListener('click',()=>{$('auth-inner').innerHTML=regHTML();bind()});
  $('to-li')?.addEventListener('click',()=>{$('auth-inner').innerHTML=loginHTML();bind()});
  document.querySelectorAll('.rcard').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('.rcard').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');$('rrole').value=c.dataset.role;
  }));
  $('btn-reg')?.addEventListener('click',async()=>{
    const n=$('rn').value,e=$('re').value,p=$('rp').value,r=$('rrole').value;
    if(!n||!e||!p)return;
    $('btn-reg').innerHTML='<span class="spinner"></span>';
    const err=await signUp(e,p,n,r);
    if(err)$('auth-inner').innerHTML=regHTML(err);
  });

  // CHART FILTERS
  document.querySelectorAll('[data-cf]').forEach(el=>el.addEventListener('click',()=>{ST.chartFilter=el.dataset.cf;render()}));
  document.querySelectorAll('[data-ct]').forEach(el=>el.addEventListener('click',()=>{ST.chartType=el.dataset.ct;render()}));

  // SESSIONS → DETAIL
  document.querySelectorAll('[data-sess]').forEach(el=>el.addEventListener('click',()=>{
    ST.selSession=el.dataset.sess;ST.page='session-detail';ST.aiInsight=null;render();
  }));

  // DASHBOARD
  $('btn-plan')?.addEventListener('click',getTrainingPlan);
  $('btn-close-ai')?.addEventListener('click',()=>{ST.aiInsight=null;render()});
  $('btn-aw-d')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  $('btn-aa-d')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});

  // WIZARD
  $('wiz-next')?.addEventListener('click',()=>{
    if(ST.wizardStep===1){
      const disc=$('w-disc')?.value,type=$('w-type')?.value;
      if(!disc){toast('Seleccioná una disciplina','err');return}
      ST.wizardData={...ST.wizardData,discipline:disc,type,date:$('w-date')?.value,location:$('w-loc')?.value,weapon_id:$('w-weapon')?.value||null,ammo_lot_id:$('w-ammo')?.value||null};
      const total=DISC_SHOTS[disc]||60;
      if(!ST.shots.length)ST.shots=Array(total).fill('');
    }
    ST.wizardStep++;render();
  });
  $('wiz-back')?.addEventListener('click',()=>{ST.wizardStep--;render()});
  $('wiz-save')?.addEventListener('click',async()=>{
    ST.wizardData={...ST.wizardData,wind:$('w-wind')?.value,temp:$('w-temp')?.value,humidity:$('w-hum')?.value,mental:$('w-mental')?.value,physical:$('w-physical')?.value,notes:$('w-notes')?.value};
    // Upload target photo if present
    const photoFile=$('target-photo')?.files[0];
    if(photoFile){
      const ext=photoFile.name.split('.').pop();
      const path=`${ST.user.id}/target-${Date.now()}.${ext}`;
      const{error,data}=await sb.storage.from('targets').upload(path,photoFile);
      if(!error){const{data:pd}=sb.storage.from('targets').getPublicUrl(path);ST.wizardData.target_photo=pd.publicUrl;}
    }
    $('wiz-save').innerHTML='<span class="spinner"></span> Guardando...';
    await saveSession();
  });

  // SHOT INPUTS
  document.querySelectorAll('[data-idx]').forEach(inp=>inp.addEventListener('input',e=>{
    const idx=parseInt(e.target.dataset.idx);
    const val=e.target.value;
    ST.shots[idx]=val?parseFloat(val):0;
    const num=parseFloat(val);
    e.target.className=`shot-inp ${val===''?'':num>=10?'hi':num<=8?'lo':''}`;
    // Update series subtotal label
    const si=Math.floor(idx/10);
    const seriesShots=ST.shots.slice(si*10,(si+1)*10).filter(s=>s>0);
    const sub=seriesShots.reduce((a,b)=>a+parseFloat(b||0),0);
    const labels=document.querySelectorAll('.shot-series-lbl');
    if(labels[si])labels[si].textContent=`Serie ${si+1} · Subtotal: ${sub.toFixed(1)}`;
    // Update total
    const total=ST.shots.filter(s=>s>0).reduce((a,b)=>a+parseFloat(b||0),0);
    const bigTotal=document.querySelector('.wiz-total');
    if(bigTotal)bigTotal.textContent=total.toFixed(1);
  }));

  // SIUS IMPORT
  $('sius-file')?.addEventListener('change',async e=>{
    const file=e.target.files[0];
    if(!file)return;
    const loading=$('sius-loading');
    if(loading)loading.style.display='flex';
    const reader=new FileReader();
    reader.onload=async ev=>{
      const content=ev.target.result;
      const result=await parseSius(content,file.name.split('.').pop());
      if(loading)loading.style.display='none';
      if(result.disparos&&result.disparos.length>0){
        ST.shots=result.disparos.map(d=>d.valor||0);
        toast(`${result.disparos.length} disparos importados · Total: ${result.total} ✓`);
        render();
      } else {
        toast(result.error||'No se pudieron leer los disparos','err');
      }
    };
    reader.readAsText(file);
  });

  // TARGET PHOTO OCR
  $('target-photo')?.addEventListener('change',async e=>{
    const file=e.target.files[0];
    if(!file)return;
    if($('photo-name'))$('photo-name').textContent=`✓ ${file.name}`;
    const ocrResult=$('ocr-result');
    if(ocrResult)ocrResult.innerHTML=`<div class="flex ic gap8 mt8" style="font-size:11px;color:var(--t3)"><span class="spinner"></span> Claude analizando el blanco...</div>`;
    const reader=new FileReader();
    reader.onload=async ev=>{
      const base64=ev.target.result.split(',')[1];
      const result=await callEdge('ocr-target',{imageBase64:base64,imageType:file.type,discipline:ST.wizardData.discipline});
      if(ocrResult){
        if(result.disparos_detectados?.length>0){
          ST.shots=result.disparos_detectados.map(d=>d.valor||0);
          ocrResult.innerHTML=`<div style="background:var(--greend);border-radius:var(--rs);padding:8px 12px;font-size:11px;color:var(--green);margin-top:8px">✓ Claude detectó ${result.disparos_detectados.length} disparos · Total: <strong>${result.total}</strong> · Confianza: ${result.confianza}. Verificá los valores.</div>`;
          render();
        } else {
          ocrResult.innerHTML=`<div style="background:var(--goldd);border-radius:var(--rs);padding:8px 12px;font-size:11px;color:#7a4a00;margin-top:8px">⚠ No se pudieron detectar disparos automáticamente. Cargalos manualmente.</div>`;
        }
      }
    };
    reader.readAsDataURL(file);
  });

  // SESSION ANALYZE
  $('btn-analyze')?.addEventListener('click',()=>{if(ST.selSession)analyzeSession(ST.selSession)});

  // COACH
  $('btn-refresh-coach')?.addEventListener('click',loadCoachDashboard);

  // CALENDAR
  $('cal-prev')?.addEventListener('click',()=>{
    if(ST.calMonth===0){ST.calMonth=11;ST.calYear--}else ST.calMonth--;render();
  });
  $('cal-next')?.addEventListener('click',()=>{
    if(ST.calMonth===11){ST.calMonth=0;ST.calYear++}else ST.calMonth++;render();
  });
  $('btn-add-event')?.addEventListener('click',()=>{ST.modal='cal-event';render()});
  $('btn-ce-save')?.addEventListener('click',async()=>{
    const title=$('ce-title').value;
    if(!title){toast('El título es obligatorio','err');return}
    await saveCalEvent({title,date:$('ce-date').value,event_type:$('ce-type').value,discipline:$('ce-disc').value||null,time_start:$('ce-time').value,notes:$('ce-notes').value});
  });

  // WEAPONS
  $('btn-add-w')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  document.querySelectorAll('[data-edit-w]').forEach(el=>el.addEventListener('click',()=>{editItem=weapons.find(w=>w.id===el.dataset.editW);ST.modal='weapon';render()}));
  document.querySelectorAll('[data-del-w]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('¿Eliminar?'))await deleteWeapon(el.dataset.delW)}));

  // AMMO
  $('btn-add-a')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});
  document.querySelectorAll('[data-edit-a]').forEach(el=>el.addEventListener('click',()=>{editItem=ammos.find(a=>a.id===el.dataset.editA);ST.modal='ammo';render()}));
  document.querySelectorAll('[data-del-a]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('¿Eliminar?'))await deleteAmmo(el.dataset.delA)}));

  // MODAL CLOSE
  $('cm')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('cm2')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('mov')?.addEventListener('click',e=>{if(e.target.id==='mov'){ST.modal=null;editItem=null;render()}});

  // SAVE WEAPON
  $('btn-sw')?.addEventListener('click',async()=>{
    const brand=$('wb').value,model=$('wm').value;
    if(!brand||!model){toast('Marca y modelo son obligatorios','err');return}
    $('btn-sw').innerHTML='<span class="spinner"></span>';
    await saveWeapon({type:$('wt').value,brand,model,serial:$('ws').value,caliber:$('wc').value,year:parseInt($('wy').value)||null,notes:$('wn').value,active:true});
  });

  // RATING STARS
  document.querySelectorAll('#rating-stars .star').forEach(s=>s.addEventListener('click',()=>{
    const r=parseInt(s.dataset.r);$('ar').value=r;
    document.querySelectorAll('#rating-stars .star').forEach((x,i)=>{x.className=`star ${i<r?'on':'off'}`;x.style.fontSize='20px'});
  }));

  // PHOTO FILE
  $('photo-file')?.addEventListener('change',e=>{const f=e.target.files[0];if(f&&$('photo-name'))$('photo-name').textContent=`✓ ${f.name}`});

  // SAVE AMMO
  $('btn-sa')?.addEventListener('click',async()=>{
    const brand=$('ab').value,lot=$('al').value;
    if(!brand||!lot){toast('Marca y lote son obligatorios','err');return}
    $('btn-sa').innerHTML='<span class="spinner"></span>';
    await saveAmmo({brand,lot_number:lot,model:$('am').value,caliber:$('ac').value,quantity:parseInt($('aq').value)||0,rating:parseInt($('ar').value)||null,comment:$('ac2').value,photo_url:editItem?.photo_url||null},$('photo-file')?.files[0]||null);
  });

  // PROFILE
  $('btn-save-prf')?.addEventListener('click',async()=>updateProfile({full_name:$('pn').value,club:$('pc').value,category:$('pcat').value,role:$('prole').value}));
}

init();
</script>
</body>
</html>
