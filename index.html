<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERF SHOT — Shooting Performance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0B1C2D;--navy2:#132638;--navy3:#1E3A54;
  --green:#1D9E75;--greenl:#5DCAA5;--greend:rgba(29,158,117,.12);
  --blue:#4DB8FF;--blued:rgba(77,184,255,.10);
  --red:#E8462A;--redd:rgba(232,70,42,.10);
  --gold:#EF9F27;--fog:#F0F7FF;--fog2:#E3EEF9;
  --t:#0B1C2D;--t2:#4A6278;--t3:#8BA5BB;
  --b:rgba(11,28,45,.10);--b2:rgba(11,28,45,.06);
  --r:12px;--rs:8px;
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--fog);color:var(--t);min-height:100vh;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
.app{display:flex;min-height:100vh}
.sb{width:210px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
.sb-logo{padding:20px 16px 14px;border-bottom:1px solid var(--navy3)}
.sb-wm{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:.04em;color:#fff}
.sb-wm span{color:var(--green)}
.sb-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6B8FAF;margin-top:2px}
.sb-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.sb-sec{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#3A5570;padding:8px 8px 3px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:#6B8FAF;font-size:12px;border:none;background:none;width:100%;text-align:left;transition:background .15s}
.sb-item:hover{background:var(--navy2);color:#9DBDD4}
.sb-item.on{background:var(--greend);color:var(--greenl)}
.sb-badge{margin-left:auto;font-size:9px;font-family:var(--mono);background:var(--greend);color:var(--greenl);padding:1px 5px;border-radius:20px}
.sb-user{padding:12px 14px;border-top:1px solid var(--navy3);display:flex;align-items:center;gap:9px;cursor:pointer}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.sb-nm{font-size:12px;font-weight:500;color:#9DBDD4}
.sb-rl{font-size:10px;color:#3A5570}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--b);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tb-title{font-family:var(--disp);font-size:15px;font-weight:600}
.content{padding:20px 24px;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);font-family:var(--body);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:#189060}
.btn-s{background:transparent;color:var(--t2);border:1px solid var(--b)}.btn-s:hover{background:var(--fog2)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-i{padding:7px;border-radius:var(--rs);background:transparent;border:1px solid var(--b);cursor:pointer;color:var(--t2);transition:all .15s;display:inline-flex;align-items:center}
.btn-i:hover{background:var(--fog2)}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--b);padding:18px}
.ct{font-family:var(--disp);font-size:13px;font-weight:600}
/* DASHBOARD DARK BG */
.dash-bg{background:var(--navy);border-radius:var(--r);padding:20px;margin-bottom:14px}
.dash-greet{font-family:var(--disp);font-size:20px;font-weight:700;color:#fff;margin-bottom:2px}
.dash-greet span{color:var(--green)}
.dash-sub{font-size:11px;color:#6B8FAF;margin-bottom:16px}
/* HERO METRICS */
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.hcard{background:var(--navy2);border-radius:var(--r);padding:14px 16px;border:1px solid rgba(255,255,255,.06)}
.hcard.ac{background:#0F3D2A;border-color:rgba(29,158,117,.3)}
.hlbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6B8FAF;margin-bottom:5px}
.hcard.ac .hlbl{color:rgba(255,255,255,.55)}
.hval{font-family:var(--disp);font-size:26px;font-weight:800;color:#fff;line-height:1}
.hdec{font-size:13px;color:var(--green)}
.hcard.ac .hdec{color:rgba(255,255,255,.6)}
.hdelta{font-size:10px;margin-top:4px;font-family:var(--mono)}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:#6B8FAF}
/* CHART */
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.chart-card{background:var(--navy2);border-radius:var(--r);padding:16px;border:1px solid rgba(255,255,255,.06)}
.chart-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.chart-t{font-family:var(--disp);font-size:12px;font-weight:600;color:#fff}
.filters{display:flex;gap:4px}
.fbtn{font-size:10px;padding:3px 8px;border-radius:20px;cursor:pointer;border:none;background:rgba(255,255,255,.06);color:#6B8FAF;font-family:var(--body)}
.fbtn.on{background:var(--green);color:#fff}
.bars{height:80px;display:flex;align-items:flex-end;gap:4px;margin-bottom:4px}
.bar{flex:1;border-radius:3px 3px 0 0;cursor:pointer;transition:opacity .15s;position:relative}
.bar:hover{opacity:.75}
.bar-lbl{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:8px;color:#6B8FAF;font-family:var(--mono);white-space:nowrap}
.chart-meta{display:flex;justify-content:space-between;font-size:9px;font-family:var(--mono);color:#6B8FAF;margin-top:18px}
/* AI PANEL */
.ai-panel{background:linear-gradient(135deg,#0F3D2A,#0B2438);border:1px solid rgba(29,158,117,.25);border-radius:var(--r);padding:14px}
.ai-hd{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ai-title{font-size:10px;font-weight:500;color:var(--greenl);letter-spacing:.06em;text-transform:uppercase}
.ai-txt{font-size:11px;color:rgba(255,255,255,.75);line-height:1.65}
.ai-txt strong{color:var(--greenl)}
.ai-acts{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.ai-btn{font-size:10px;padding:4px 10px;border-radius:20px;border:1px solid rgba(29,158,117,.3);background:rgba(29,158,117,.1);color:var(--greenl);cursor:pointer;font-family:var(--body)}
/* SESSIONS LIST */
.sess-card{background:#fff;border-radius:var(--r);border:1px solid var(--b);padding:16px;margin-bottom:14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-t{font-family:var(--disp);font-size:13px;font-weight:600}
.see-all{font-size:10px;color:var(--green);cursor:pointer}
.srow{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.srow:hover{background:var(--fog2)}
.sdate{font-family:var(--mono);font-size:10px;color:var(--t3);min-width:72px}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sdisc{font-size:11px;font-weight:500;flex:1}
.smeta{font-size:10px;color:var(--t3)}
.sscore{font-family:var(--disp);font-size:16px;font-weight:700;min-width:36px;text-align:right}
/* BOTTOM ROW */
.bottom-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mini{background:#fff;border-radius:var(--r);border:1px solid var(--b);padding:14px}
.mini-t{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mitem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--b2)}
.mitem:last-child{border-bottom:none}
.micon{width:28px;height:28px;border-radius:6px;background:var(--fog2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stars{display:flex;gap:1px}
.star{font-size:12px;cursor:pointer}.star.on{color:var(--gold)}.star.off{color:var(--b)}
.next-card{background:var(--navy);border-radius:var(--r);padding:14px;border:1px solid rgba(77,184,255,.15)}
.next-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.next-title{font-family:var(--disp);font-size:13px;font-weight:600;color:#fff;margin-bottom:8px}
.next-item{font-size:11px;color:#6B8FAF;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.next-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0}
.new-sess-btn{width:100%;margin-top:10px;padding:8px;border-radius:8px;background:var(--green);color:#fff;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--disp)}
/* SESSION DETAIL */
.sdh{background:var(--navy);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative}
.sdh-score{font-family:var(--disp);font-size:52px;font-weight:800;color:#fff;line-height:1}
.sdh-disc{font-size:12px;color:#6B8FAF;margin-top:4px}
.sdh-date{font-size:11px;color:#3A5570;margin-top:2px}
.sdh-badge{position:absolute;top:18px;right:18px}
.sdh-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.sdh-stat{background:rgba(255,255,255,.05);border-radius:8px;padding:10px}
.sdh-sv{font-family:var(--disp);font-size:16px;font-weight:700;color:#fff}
.sdh-sl{font-size:10px;color:#6B8FAF;margin-top:2px}
.aa{background:linear-gradient(135deg,#0F3D2A,#0B2438);border:1px solid rgba(29,158,117,.25);border-radius:var(--r);padding:16px;margin-bottom:14px}
.aa-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.aa-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.aa-title{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--greenl)}
.aa-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--greenl);margin-bottom:6px;opacity:.7;margin-top:10px}
.aa-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px;font-size:12px;color:rgba(255,255,255,.8);line-height:1.5}
.aa-d{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* EQUIP */
.ecard{background:#fff;border:1px solid var(--b);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;transition:box-shadow .15s}
.ecard:hover{box-shadow:0 4px 16px rgba(11,28,45,.08)}
.eicon{width:40px;height:40px;border-radius:var(--rs);background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acard{background:#fff;border:1px solid var(--b);border-radius:var(--r);padding:14px}
.aphoto{width:100%;height:72px;border-radius:var(--rs);background:var(--fog2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);margin:8px 0;overflow:hidden}
.aphoto img{width:100%;height:100%;object-fit:cover}
.upload-zone{border:2px dashed var(--b);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--fog);position:relative}
.upload-zone:hover{border-color:var(--green);background:var(--greend)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* FORMS */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fl{font-size:10px;font-weight:500;color:var(--t2);letter-spacing:.04em;text-transform:uppercase}
.fi,.fs,.fta{padding:8px 10px;border-radius:var(--rs);border:1px solid var(--b);background:var(--fog);font-family:var(--body);font-size:12px;color:var(--t);width:100%;transition:border-color .15s}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--greend)}
.fta{resize:vertical;min-height:70px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}
.bg{background:var(--greend);color:var(--green)}
.bb{background:var(--blued);color:#185FA5}
.bo{background:rgba(239,159,39,.12);color:#7a4a00}
.bgr{background:var(--fog2);color:var(--t2)}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(11,28,45,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;animation:mIn .18s ease}
.modal-lg{max-width:660px}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mhd{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);position:sticky;top:0;background:#fff;z-index:1;border-radius:14px 14px 0 0}
.mt{font-family:var(--disp);font-size:14px;font-weight:600}
.mb{padding:16px 20px}
.mft{padding:12px 20px;border-top:1px solid var(--b);display:flex;gap:8px;justify-content:flex-end}
/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:12px;z-index:999;animation:mIn .2s ease;display:flex;align-items:center;gap:8px}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
/* AUTH */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);background-image:radial-gradient(circle at 20% 80%,rgba(29,158,117,.08),transparent 60%),radial-gradient(circle at 80% 20%,rgba(77,184,255,.05),transparent 60%)}
.auth-card{width:100%;max-width:380px;padding:36px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.auth-lm{font-family:var(--disp);font-size:30px;font-weight:800;color:#fff;text-align:center;letter-spacing:.05em}
.auth-lm span{color:var(--green)}
.auth-ls{font-size:10px;letter-spacing:.15em;color:#6B8FAF;text-transform:uppercase;text-align:center;margin-top:2px;margin-bottom:24px}
.auth-title{font-family:var(--disp);font-size:16px;font-weight:600;color:#fff;margin-bottom:3px}
.auth-sub{font-size:12px;color:#6B8FAF;margin-bottom:16px}
.auth-in{width:100%;padding:10px 12px;border-radius:var(--rs);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-family:var(--body);font-size:13px;margin-bottom:8px}
.auth-in::placeholder{color:#3A5570}
.auth-in:focus{outline:none;border-color:var(--green)}
.auth-btn{width:100%;padding:11px;border-radius:var(--rs);background:var(--green);color:#fff;font-family:var(--disp);font-size:13px;font-weight:700;border:none;cursor:pointer;transition:background .15s}
.auth-btn:hover{background:#189060}
.auth-err{background:var(--redd);color:var(--red);padding:8px 12px;border-radius:var(--rs);font-size:12px;margin-bottom:10px;border:1px solid rgba(232,70,42,.2)}
.auth-sw{text-align:center;margin-top:14px;font-size:12px;color:#3A5570}
.auth-sw a{color:var(--greenl);cursor:pointer}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.rcard{padding:14px;border-radius:var(--rs);border:2px solid rgba(255,255,255,.08);cursor:pointer;transition:all .15s;text-align:center}
.rcard:hover,.rcard.on{border-color:var(--green);background:var(--greend)}
.rcard-n{font-size:12px;font-weight:500;color:#9DBDD4;margin-top:4px}
.rcard.on .rcard-n{color:var(--greenl)}
/* UTILS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.flex{display:flex}.ic{align-items:center}.jb{justify-content:space-between}
.gap8{gap:8px}.gap12{gap:12px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mb16{margin-bottom:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.tsm{font-size:12px}.txs{font-size:11px}.tmuted{color:var(--t3)}
.tgreen{color:var(--green)}.tmono{font-family:var(--mono)}
.wf{width:100%}
.spinner{width:14px;height:14px;border:2px solid var(--greend);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);flex-direction:column;gap:16px}
.load-logo{font-family:var(--disp);font-size:32px;font-weight:800;color:#fff;letter-spacing:.05em}
.load-logo span{color:var(--green)}
.coming{background:#fff;border:1px solid var(--b);border-radius:var(--r);min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:32px;text-align:center}
@media(max-width:768px){.sb{display:none}.main{margin-left:0}.hero{grid-template-columns:1fr 1fr}.chart-row,.g2,.g3,.fg2,.bottom-row,.sdh-stats{grid-template-columns:1fr}}
</style>

function render(){document.getElementById('app').innerHTML=html();bind()}

function toast(msg,type='ok'){
  ST.toast={msg,type};render();
  setTimeout(()=>{ST.toast=null;render()},3000);
}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){ST.user=session.user;await loadProfile();await loadData()}
  ST.loading=false;render();
  sb.auth.onAuthStateChange(async(e,s)=>{
    ST.user=s?.user||null;
    if(ST.user){await loadProfile();await loadData()}
    else{ST.profile=null;weapons=[];ammos=[];sessions=[]}
    render();
  });
}

async function loadProfile(){
  const{data}=await sb.from('profiles').select('*').eq('id',ST.user.id).single();
  ST.profile=data;
}

async function loadData(){
  const uid=ST.user.id;
  const[w,a,s]=await Promise.all([
    sb.from('weapons').select('*').eq('athlete_id',uid).order('created_at',{ascending:false}),
    sb.from('ammo_lots').select('*').eq('athlete_id',uid).order('created_at',{ascending:false}),
    sb.from('sessions').select('*').eq('athlete_id',uid).order('date',{ascending:false}).limit(30),
  ]);
  weapons=w.data||[];ammos=a.data||[];sessions=s.data||[];
}

async function signIn(email,pass){
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  return error?.message||null;
}

async function signUp(email,pass,name,role){
  const{data,error}=await sb.auth.signUp({
    email,password:pass,
    options:{data:{full_name:name,role}}
  });
  if(error)return error.message;
  if(data.user){
    await sb.from('profiles').upsert({
      id:data.user.id,full_name:name,email,role,
      disciplines:['10m_pistola_aire_m']
    });
  }
  return null;
}

async function signOut(){await sb.auth.signOut();ST.page='home';render()}

async function ensureProfile(){
  if(!ST.profile){
    const uid=ST.user.id;
    await sb.from('profiles').upsert({
      id:uid,email:ST.user.email,role:'athlete',
      full_name:ST.user.email.split('@')[0],
      disciplines:['10m_pistola_aire_m']
    });
    await loadProfile();
  }
}

async function saveWeapon(form){
  await ensureProfile();
  let error;
  if(editItem){
    ({error}=await sb.from('weapons').update(form).eq('id',editItem.id));
  } else {
    ({error}=await sb.from('weapons').insert({...form,athlete_id:ST.user.id}));
  }
  if(!error){await loadData();ST.modal=null;editItem=null;toast(editItem?'Arma actualizada ✓':'Arma guardada ✓')}
  else toast(error.message,'err');
}

async function deleteWeapon(id){
  const{error}=await sb.from('weapons').delete().eq('id',id);
  if(!error){await loadData();toast('Arma eliminada')}
  else toast(error.message,'err');
}

async function saveAmmo(form,photoFile){
  await ensureProfile();
  let photoUrl=form.photo_url||null;
  if(photoFile){
    const ext=photoFile.name.split('.').pop();
    const path=`${ST.user.id}/${Date.now()}.${ext}`;
    const{error:ue}=await sb.storage.from('ammo-photos').upload(path,photoFile);
    if(!ue){
      const{data:pd}=sb.storage.from('ammo-photos').getPublicUrl(path);
      photoUrl=pd.publicUrl;
    }
  }
  const payload={...form,photo_url:photoUrl};
  let error;
  if(editItem){
    ({error}=await sb.from('ammo_lots').update(payload).eq('id',editItem.id));
  } else {
    ({error}=await sb.from('ammo_lots').insert({...payload,athlete_id:ST.user.id}));
  }
  if(!error){await loadData();ST.modal=null;editItem=null;toast('Lote guardado ✓')}
  else toast(error.message,'err');
}

async function deleteAmmo(id){
  const{error}=await sb.from('ammo_lots').delete().eq('id',id);
  if(!error){await loadData();toast('Lote eliminado')}
  else toast(error.message,'err');
}

async function updateProfile(form){
  const{error}=await sb.from('profiles').update(form).eq('id',ST.user.id);
  if(!error){await loadProfile();toast('Perfil actualizado ✓')}
  else toast(error.message,'err');
}

    ${w.notes?`<div style="font-size:10px;color:var(--t3);margin-top:4px;font-style:italic">${w.notes}</div>`:''}
    <div class="flex gap8 mt8"><span class="badge bg">Activa</span><span class="badge bgr">${w.caliber}</span></div>
  </div>
  <div class="flex gap8" style="flex-direction:column">
    <button class="btn-i" data-edit-w="${w.id}">${I.edit}</button>
    <button class="btn-i" data-del-w="${w.id}" style="color:var(--red);border-color:rgba(232,70,42,.2)">${I.trash}</button>
  </div>
</div>`).join('')}
</div>`}`}

function ammoHTML(){return`
<div class="flex ic jb mb12">
  <div><div style="font-family:var(--disp);font-size:16px;font-weight:700">Munición y balines</div><div class="txs tmuted mt8">${ammos.length} lotes registrados</div></div>

${ammos.length>1?`<div class="ai-panel mb14"><div class="ai-hd"><div class="ai-dot"></div><div class="ai-title">PERF AI · correlación</div></div><div class="ai-txt">Tenés <strong>${ammos.length} lotes</strong>. Asociá cada sesión a un lote para detectar qué munición mejora tu puntaje.</div></div>`:''}

${ammos.map(a=>`

    </div>

  </div>
  <div class="aphoto">
    ${a.photo_url?`<img src="${a.photo_url}" alt="Agrupación"/>`:`<div style="display:flex;flex-direction:column;align-items:center;gap:3px">${I.upl}<span style="font-size:10px">Sin foto</span></div>`}

    <button class="btn btn-s btn-sm" style="flex:1;font-size:10px" data-edit-a="${a.id}">${I.edit} Editar</button>
    <button class="btn-i" data-del-a="${a.id}" style="color:var(--red);border-color:rgba(232,70,42,.2)">${I.trash}</button>

</div>`}`}

<div class="flex ic gap12 mb16">
  <div style="width:56px;height:56px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:20px;font-weight:800;color:#fff">${ini(p.full_name||ST.user.email)}</div>
  <div><div style="font-family:var(--disp);font-size:17px;font-weight:700">${p.full_name||'—'}</div><div class="txs tmuted">${p.club||'Sin club'} · ${p.category||'Sin categoría'}</div></div>
</div>

function sessDetailHTML(s){
  const wname=s.weapon_id?weapons.find(w=>w.id===s.weapon_id):null;
  const aname=s.ammo_lot_id?ammos.find(a=>a.id===s.ammo_lot_id):null;
  const topAmmo=ammos.length?[...ammos].sort((a,b)=>(b.rating||0)-(a.rating||0))[0]:null;
  return`
<div class="sdh">
  <div class="sdh-badge"><span class="badge ${s.type==='competition'?'bo':'bb'}">${s.type==='competition'?'Competencia':'Entrenamiento'}</span></div>
  <div class="sdh-score">${s.total_score||'—'}</div>
  <div class="sdh-disc">${s.discipline?.replace(/_/g,' ')||'—'}</div>
  <div class="sdh-date">${s.date}</div>
  <div class="sdh-stats">
    <div class="sdh-stat"><div class="sdh-sv">${s.total_shots||'—'}</div><div class="sdh-sl">Disparos</div></div>
    <div class="sdh-stat"><div class="sdh-sv">${s.wind_ms!=null?s.wind_ms:'—'}</div><div class="sdh-sl">Viento m/s</div></div>
    <div class="sdh-stat"><div class="sdh-sv">${s.mental_state||'—'}/10</div><div class="sdh-sl">Mental</div></div>
    <div class="sdh-stat"><div class="sdh-sv">${s.physical_state||'—'}/10</div><div class="sdh-sl">Físico</div></div>
  </div>
</div>
<div class="g2 mb14">
  <div class="card">
    <div class="ct mb8">Equipamiento usado</div>
    <div class="tsm">${wname?wname.brand+' '+wname.model:'No registrado'}</div>
    <div class="txs tmuted mt8">Munición: ${aname?aname.brand+' '+aname.lot_number:'No registrada'}</div>
  </div>
  <div class="card">
    <div class="ct mb8">Notas</div>
    ${s.athlete_notes?`<div class="tsm" style="font-style:italic">"${s.athlete_notes}"</div>`:'<div class="txs tmuted">Sin notas del atleta</div>'}
    ${s.coach_notes?`<div class="txs tmuted mt8">Entrenador: "${s.coach_notes}"</div>`:''}
  </div>
</div>
${s.target_photo_url?`<div class="card mb14"><div class="ct mb8">Blanco / Diana</div><img src="${s.target_photo_url}" style="width:100%;max-height:280px;object-fit:contain;border-radius:8px;margin-top:8px"/></div>`:''}
<div class="aa">
  <div class="aa-hd"><div class="aa-dot"></div><div class="aa-title">Análisis PERF AI</div></div>
  <div class="aa-lbl">Evaluación de sesión</div>
  <div class="aa-item"><div class="aa-d" style="background:${s.total_score>=585?'var(--green)':s.total_score>=575?'var(--gold)':'var(--red)'}"></div>${s.total_score>=585?'Puntaje excelente — zona de clasificación nacional':s.total_score>=575?'Puntaje sólido — dentro de tu zona habitual':'Puntaje por debajo del promedio — revisá las condiciones'}</div>
  ${s.wind_ms>2?`<div class="aa-item"><div class="aa-d" style="background:var(--gold)"></div>Viento de ${s.wind_ms} m/s puede haber afectado la estabilidad</div>`:''}
  ${s.mental_state&&s.mental_state<7?`<div class="aa-item"><div class="aa-d" style="background:var(--red)"></div>Estado mental bajo (${s.mental_state}/10) — correlacionar con sesiones futuras</div>`:''}
  <div class="aa-lbl">Recomendaciones próxima sesión</div>
  <div class="aa-item"><div class="aa-d" style="background:var(--blue)"></div>${s.total_score<575?'Sesión de recuperación: 30 tiros con foco en técnica y respiración':'Mantener volumen actual — estás en buen ritmo'}</div>
  <div class="aa-item"><div class="aa-d" style="background:var(--blue)"></div>${topAmmo?`Usar ${topAmmo.brand} ${topAmmo.model} — tu lote mejor evaluado`:'Registrá tu munición para recomendaciones específicas'}</div>
</div>`;
}

function modalHTML(){
  if(!ST.modal)return'';
  if(ST.modal==='sess-detail'&&ST.selSession){
    const s=sessions.find(x=>x.id===ST.selSession);
    if(!s)return'';
    return`<div class="ov" id="mov"><div class="modal modal-lg"><div class="mhd"><div class="mt">Detalle de sesión · ${s.date}</div><button class="btn-i" id="cm">${I.x}</button></div><div class="mb">${sessDetailHTML(s)}</div></div></div>`;
  }
  if(ST.modal==='weapon'){
    const w=editItem;
    return`<div class="ov" id="mov"><div class="modal"><div class="mhd"><div class="mt">${w?'Editar arma':'Agregar arma'}</div><button class="btn-i" id="cm">${I.x}</button></div>
    <div class="mb">
      <div class="fg"><label class="fl">Tipo</label><select class="fs" id="wt"><option value="pistola" ${(!w||w.type==='pistola')?'selected':''}>Pistola</option><option value="rifle" ${w?.type==='rifle'?'selected':''}>Rifle</option></select></div>
      <div class="fg2">
        <div class="fg"><label class="fl">Marca *</label><input class="fi" id="wb" placeholder="Walther, FWB, Steyr..." value="${w?.brand||''}"/></div>
        <div class="fg"><label class="fl">Modelo *</label><input class="fi" id="wm" placeholder="LP500, 800X..." value="${w?.model||''}"/></div>
      </div>
      <div class="fg2">
        <div class="fg"><label class="fl">Nº de serie</label><input class="fi" id="ws" placeholder="WL-2024-00000" value="${w?.serial||''}"/></div>
        <div class="fg"><label class="fl">Calibre</label><select class="fs" id="wc"><option ${w?.caliber==='4.5mm'||!w?'selected':''}>4.5mm</option><option ${w?.caliber==='5.5mm'?'selected':''}>5.5mm</option><option ${w?.caliber==='.22 LR'?'selected':''}>.22 LR</option></select></div>
      </div>
      <div class="fg"><label class="fl">Año de adquisición</label><input class="fi" id="wy" type="number" value="${w?.year||new Date().getFullYear()}"/></div>
      <div class="fg"><label class="fl">Notas</label><textarea class="fta" id="wn">${w?.notes||''}</textarea></div>
    </div>
    <div class="mft"><button class="btn btn-s" id="cm2">Cancelar</button><button class="btn btn-p" id="btn-sw">${w?'Actualizar arma':'Guardar arma'}</button></div>
    </div></div>`;
  }
  if(ST.modal==='ammo'){
    const a=editItem;
    return`<div class="ov" id="mov"><div class="modal"><div class="mhd"><div class="mt">${a?'Editar lote':'Agregar lote de munición'}</div><button class="btn-i" id="cm">${I.x}</button></div>
    <div class="mb">
      <div class="fg2">
        <div class="fg"><label class="fl">Marca *</label><input class="fi" id="ab" placeholder="RWS, Lapua, H&N..." value="${a?.brand||''}"/></div>
        <div class="fg"><label class="fl">Modelo</label><input class="fi" id="am" placeholder="R10 Match, L-110..." value="${a?.model||''}"/></div>
      </div>
      <div class="fg2">
        <div class="fg"><label class="fl">Nº de lote *</label><input class="fi" id="al" placeholder="2024-B-0312" value="${a?.lot_number||''}"/></div>
        <div class="fg"><label class="fl">Calibre</label><select class="fs" id="ac"><option ${a?.caliber==='4.5mm'||!a?'selected':''}>4.5mm</option><option ${a?.caliber==='5.5mm'?'selected':''}>5.5mm</option><option ${a?.caliber==='.22 LR'?'selected':''}>.22 LR</option></select></div>
      </div>
      <div class="fg2">
        <div class="fg"><label class="fl">Cantidad</label><input class="fi" id="aq" type="number" placeholder="500" value="${a?.quantity||''}"/></div>
        <div class="fg"><label class="fl">Rating de rendimiento</label>
          <div class="stars" id="rating-stars" style="margin-top:8px">
            ${[1,2,3,4,5].map(i=>`<span class="star ${i<=(a?.rating||0)?'on':'off'}" data-r="${i}" style="font-size:20px">★</span>`).join('')}
          </div>
          <input type="hidden" id="ar" value="${a?.rating||0}"/>
        </div>
      </div>
      <div class="fg"><label class="fl">Comentarios y observaciones</label><textarea class="fta" id="ac2" placeholder="Agrupación, consistencia, condiciones de prueba...">${a?.comment||''}</textarea></div>
      <div class="upload-zone">
        <input type="file" id="photo-file" accept="image/*"/>
        <div style="pointer-events:none">${I.upl}</div>
        <div style="font-size:12px;color:var(--t2);margin-top:6px;pointer-events:none" id="photo-name">${a?.photo_url?'Foto cargada ✓ · clic para cambiar':'Subir foto de agrupación'}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px;pointer-events:none">PNG, JPG hasta 10MB</div>
      </div>
    </div>
    <div class="mft"><button class="btn btn-s" id="cm2">Cancelar</button><button class="btn btn-p" id="btn-sa">${a?'Actualizar lote':'Guardar lote'}</button></div>
    </div></div>`;
  }
  return'';
}

function bind(){
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>{ST.page=el.dataset.page;ST.modal=null;render()});
  });
  $('go-prf')?.addEventListener('click',()=>{ST.page='profile';render()});
  $('btn-so')?.addEventListener('click',signOut);

  // Auth
  $('btn-li')?.addEventListener('click',async()=>{
    const e=$('ae').value,p=$('ap').value;
    if(!e||!p)return;
    $('btn-li').innerHTML='<span class="spinner"></span>';
    const err=await signIn(e,p);
    if(err)$('auth-inner').innerHTML=loginHTML(err);
  });
  $('to-reg')?.addEventListener('click',()=>{$('auth-inner').innerHTML=regHTML();bind()});
  $('to-li')?.addEventListener('click',()=>{$('auth-inner').innerHTML=loginHTML();bind()});
  document.querySelectorAll('.rcard').forEach(c=>{
    c.addEventListener('click',()=>{
      document.querySelectorAll('.rcard').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
      $('rrole').value=c.dataset.role;
    });
  });
  $('btn-reg')?.addEventListener('click',async()=>{
    const n=$('rn').value,e=$('re').value,p=$('rp').value,r=$('rrole').value;
    if(!n||!e||!p)return;
    $('btn-reg').innerHTML='<span class="spinner"></span>';
    const err=await signUp(e,p,n,r);
    if(err)$('auth-inner').innerHTML=regHTML(err);
  });

  // Sessions → detail
  document.querySelectorAll('[data-sess]').forEach(el=>{
    el.addEventListener('click',()=>{ST.selSession=el.dataset.sess;ST.modal='sess-detail';render()});
  });

  // Dashboard quick add
  $('btn-add-w-dash')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  $('btn-add-a-dash')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});

  // Weapons
  $('btn-add-w')?.addEventListener('click',()=>{editItem=null;ST.modal='weapon';render()});
  document.querySelectorAll('[data-edit-w]').forEach(el=>{
    el.addEventListener('click',()=>{editItem=weapons.find(w=>w.id===el.dataset.editW);ST.modal='weapon';render()});
  });
  document.querySelectorAll('[data-del-w]').forEach(el=>{
    el.addEventListener('click',async()=>{if(confirm('¿Eliminar esta arma?'))await deleteWeapon(el.dataset.delW)});
  });

  // Ammo
  $('btn-add-a')?.addEventListener('click',()=>{editItem=null;ST.modal='ammo';render()});
  document.querySelectorAll('[data-edit-a]').forEach(el=>{
    el.addEventListener('click',()=>{editItem=ammos.find(a=>a.id===el.dataset.editA);ST.modal='ammo';render()});
  });
  document.querySelectorAll('[data-del-a]').forEach(el=>{
    el.addEventListener('click',async()=>{if(confirm('¿Eliminar este lote?'))await deleteAmmo(el.dataset.delA)});
  });

  // Modal close
  $('cm')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('cm2')?.addEventListener('click',()=>{ST.modal=null;editItem=null;render()});
  $('mov')?.addEventListener('click',e=>{if(e.target.id==='mov'){ST.modal=null;editItem=null;render()}});

  // Save weapon
  $('btn-sw')?.addEventListener('click',async()=>{
    const brand=$('wb').value,model=$('wm').value;
    if(!brand||!model){toast('Marca y modelo son obligatorios','err');return}
    $('btn-sw').innerHTML='<span class="spinner"></span>';
    await saveWeapon({type:$('wt').value,brand,model,serial:$('ws').value,caliber:$('wc').value,year:parseInt($('wy').value)||null,notes:$('wn').value,active:true});
  });

  // Rating stars
  document.querySelectorAll('#rating-stars .star').forEach(star=>{
    star.addEventListener('click',()=>{
      const r=parseInt(star.dataset.r);
      $('ar').value=r;
      document.querySelectorAll('#rating-stars .star').forEach((s,i)=>{s.className=`star ${i<r?'on':'off'}`;s.style.fontSize='20px'});
    });
  });

  // Photo file
  $('photo-file')?.addEventListener('change',e=>{
    const f=e.target.files[0];
    if(f&&$('photo-name'))$('photo-name').textContent=`✓ ${f.name} seleccionado`;
  });

  // Save ammo
  $('btn-sa')?.addEventListener('click',async()=>{
    const brand=$('ab').value,lot=$('al').value;
    if(!brand||!lot){toast('Marca y lote son obligatorios','err');return}
    $('btn-sa').innerHTML='<span class="spinner"></span>';
    const photoFile=$('photo-file')?.files[0]||null;
    await saveAmmo({brand,lot_number:lot,model:$('am').value,caliber:$('ac').value,quantity:parseInt($('aq').value)||0,rating:parseInt($('ar').value)||null,comment:$('ac2').value,photo_url:editItem?.photo_url||null},photoFile);
  });

  // Profile
  $('btn-save-prf')?.addEventListener('click',async()=>{
    await updateProfile({full_name:$('pn').value,club:$('pc').value,category:$('pcat').value});
  });
}

init();
</script>
</body>
</html>
