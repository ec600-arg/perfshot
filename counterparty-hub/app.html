<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centinel Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: app shell with a navy sidebar and a light work area; portfolio view = KPI strip, two charts, sortable table; company view = header, chart + drivers, side column with exposure, recommendation and notes. */
:root{
  --paper:#FFFFFF;
  --paper-2:#F4F6FA;
  --paper-3:#EEF1F6;
  --ink:#0B1B33;
  --ink-2:#3B4A61;
  --muted:#66758C;
  --line:#E2E7EF;
  --line-2:#CBD3DF;
  --navy:#0A1F44;
  --navy-2:#132B57;
  --on-navy:#E9EEF7;
  --on-navy-2:#A9B6CC;
  --cta:#1D4ED8;
  --cta-hover:#1A43BC;
  --cta-soft:#E8EEFC;
  --low:#1E7F55;   --low-bg:#E6F4EC;
  --mod:#A86A0C;   --mod-bg:#FBF1DE;
  --high:#B9501A;  --high-bg:#FBEADF;
  --vhigh:#B42318; --vhigh-bg:#FBE6E4;
  --crit:#7A1414;  --crit-bg:#F3DADA;
  --pos:#2457C5;   --neg:#C2561E;
  --serif:"IBM Plex Serif", Georgia, serif;
  --sans:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper-2);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--navy);color:var(--on-navy-2);display:flex;flex-direction:column;padding:20px 14px;padding-left:max(14px, env(safe-area-inset-left, 0px));position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:var(--paper);padding:0 8px 22px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-size:17px;display:block;line-height:1.1}
.brand small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-navy-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav span{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-size:14.5px;font-weight:500}
.nav a:hover{background:var(--navy-2);color:var(--paper)}
.nav a[aria-current="page"]{background:var(--navy-2);color:var(--paper)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--crit);color:var(--paper);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.nav span{opacity:.55;cursor:default}
.nav span em{margin-left:auto;font-style:normal;font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 5px}
.nav-sep{height:1px;background:rgba(233,238,247,.12);margin:12px 4px}
.side-foot{margin-top:auto;border-top:1px solid rgba(233,238,247,.12);padding:14px 8px 0;font-size:13px}
.side-foot b{color:var(--paper);display:block;font-size:14px}
.plan-chip{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--navy);background:var(--on-navy);border-radius:4px;padding:1px 7px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(244,246,250,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px))}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:0 12px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;outline:none;background:transparent;font:14.5px var(--sans);color:var(--ink);padding:10px 0;width:100%;min-width:0}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:none}
.btn svg{width:16px;height:16px}
.btn-cta{background:var(--cta);color:var(--paper)}
.btn-cta:hover{background:var(--cta-hover)}
.btn-line{background:var(--paper);border-color:var(--line-2);color:var(--ink)}
.btn-line:hover{border-color:var(--ink-2)}
.mobile-brand{display:none}

.view{padding-block:26px 60px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px));max-width:1400px;width:100%}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));gap:8px;overflow-x:auto}
  .brand{padding:0 8px 0 0}
  .brand small,.brand b{display:none}
  .nav{flex-direction:row}
  .nav span,.nav-sep,.side-foot{display:none}
  .nav a{white-space:nowrap;padding:8px 10px}
  .top-in,.view{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .top .btn-line{display:none}
}
@media (max-width:520px){.top .btn-cta span{display:none}}

/* ---------- common ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.2;color:var(--navy);margin:0}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:600;color:var(--navy);margin:0}
.card-h small{font-size:12.5px;color:var(--muted)}
.card-b{padding:16px 20px 20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:2px;background:currentColor}
.delta{font-size:12.5px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--low)}.delta.down{color:var(--crit)}.delta.flat{color:var(--muted)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}
.kpi{padding:16px 18px}
.kpi small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.kpi b{display:block;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.01em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink-2)}

.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-bottom:14px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}

.lvlbox{border-radius:10px;padding:12px 18px;min-width:150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.lvlbox small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.lvlbox b{font-family:var(--serif);font-size:30px;line-height:1.15;white-space:nowrap}
.meter5{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;min-width:220px}
.meter5 div{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.meter5 i{height:8px;border-radius:2px;opacity:.18}
.meter5 div.on{color:var(--ink)}
.meter5 div.on i{opacity:1;height:12px;margin-top:-2px}
.trendtxt{font-size:13.5px;color:var(--ink-2);margin-top:10px}
.imp{display:inline-flex;gap:2px;margin-right:6px;vertical-align:middle}
.imp i{width:6px;height:12px;border-radius:1px;background:var(--paper-3)}
/* stacked bar */
.stack{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden;margin:6px 0 14px}
.stack div{min-width:2px;cursor:default}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:640px){.legend{grid-template-columns:repeat(2,1fr)}}
.legend div{border-top:3px solid;padding-top:8px;font-size:13px;color:var(--ink-2)}
.legend b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:var(--on-navy);font-size:12.5px;line-height:1.45;border-radius:7px;padding:8px 10px;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(11,27,51,.5);z-index:5;transform:translate(-50%,calc(-100% - 12px))}
.tip[hidden]{display:none}
.tip b{color:var(--paper)}
.chart svg text{font-family:var(--sans);font-size:11.5px;fill:var(--muted)}

/* movers / concentration */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:hover .nm{color:var(--cta)}
.nm{font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.cbar{height:6px;border-radius:999px;background:var(--paper-3);margin-top:6px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:999px}

/* table */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 20px 0}
.chip{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.chip i{width:8px;height:8px;border-radius:2px}
.filters .count{margin-left:auto;font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--paper-2)}
.t th button{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
.t th button[aria-sort]{color:var(--navy)}
.t th.r,.t td.r{text-align:right}
.t th.r button{justify-content:flex-end}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--paper-2)}
.t tbody tr:last-child td{border-bottom:0}
.t td:first-child,.t th:first-child{padding-left:20px}
.t td:last-child,.t th:last-child{padding-right:20px}
.t .nm{max-width:260px}

/* ---------- company view ---------- */
.crumb{font-size:13.5px;color:var(--muted);margin-bottom:12px;display:flex;gap:6px;align-items:center}
.crumb a{color:var(--cta);font-weight:600}
.co-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;padding:22px 24px;margin-bottom:14px}
@media (max-width:760px){.co-head{grid-template-columns:1fr}}
.co-head h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.2;color:var(--navy);margin:0}
.co-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.co-meta span{display:flex;gap:6px;align-items:center}
.co-meta .mono{font-size:13px}
.co-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.co-score{display:flex;gap:16px;align-items:stretch}
.grade{border-radius:10px;padding:10px 16px;text-align:center;min-width:96px;display:flex;flex-direction:column;justify-content:center}
.grade b{font-family:var(--serif);font-size:34px;line-height:1}
.grade small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.sc{display:flex;flex-direction:column;justify-content:center}
.sc b{font-size:36px;font-weight:700;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.sc small{color:var(--muted);font-size:12.5px}
.sc .ds{display:flex;gap:12px;margin-top:8px}

.co-grid{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
@media (max-width:1150px){.co-grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,1fr)}}
.facts div{padding:14px 20px;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0}
@media (max-width:640px){.facts div:nth-child(3){border-left:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}
.facts small{display:block;font-size:12px;color:var(--muted)}
.facts b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}

.drv{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:760px){.drv{grid-template-columns:1fr}}
.drv h3{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.drow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.drow .bar{height:8px;border-radius:2px;background:var(--paper-3);position:relative;overflow:hidden}
.drow .bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.drow b{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink)}
.drv-note{font-size:12.5px;color:var(--muted);margin:14px 0 0}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:86px 14px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:92px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl time{font-size:12.5px;color:var(--muted);text-align:right;padding-top:1px;white-space:nowrap}
.tl .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;box-shadow:0 0 0 3px var(--paper);position:relative;z-index:1}
.tl h4{margin:0;font-size:14px;color:var(--ink)}
.tl p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}

.expo-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.expo-row:first-child{border-top:0}
.expo-row b{color:var(--ink);font-variant-numeric:tabular-nums}
.use{margin:4px 0 14px}
.use .track{position:relative;height:10px;border-radius:999px;background:var(--paper-3)}
.use .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.use .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--navy)}
.use .lbls{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}

.reco{border-radius:12px;padding:18px 20px;border:1px solid}
.reco small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.reco h3{margin:6px 0 10px;font-size:17px;color:var(--ink)}
.reco ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--ink-2)}
.reco li{display:grid;grid-template-columns:16px 1fr;gap:8px}
.reco li svg{width:16px;height:16px;margin-top:3px}
.reco .btn{margin-top:14px;width:100%}

.bench{font-size:14px;color:var(--ink-2)}
.bench .scale{position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--paper-3),var(--line-2));margin:14px 0 8px}
.bench .scale i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--paper);border:4px solid var(--navy);transform:translate(-50%,-50%)}
.bench .lbls{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.links .li{grid-template-columns:1fr auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field select,.field textarea{font:14px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;outline:none;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field select:focus,.field textarea:focus{border-color:var(--cta);box-shadow:0 0 0 3px var(--cta-soft)}
.saved{font-size:12.5px;color:var(--muted)}

/* alerts view */
.al{display:grid;grid-template-columns:4px 1fr auto;gap:14px;padding:14px 20px 14px 0;border-top:1px solid var(--line);cursor:pointer}
.al:first-child{border-top:0}
.al:hover{background:var(--paper-2)}
.al .bar{border-radius:0 3px 3px 0}
.al h4{margin:0;font-size:14.5px;color:var(--ink)}
.al p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.al .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.al time{font-size:12.5px;color:var(--muted);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--navy);color:var(--paper);padding:11px 16px;border-radius:9px;font-size:14px;box-shadow:0 12px 30px -10px rgba(11,27,51,.6);z-index:100;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.demo-note{font-size:12.5px;color:var(--muted);margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#FFFFFF"/><path d="M16 6l8 3v6c0 4.7-3.3 8.6-8 9.6-4.7-1-8-4.9-8-9.6V9l8-3z" fill="none" stroke="#0A1F44" stroke-width="2"/><path d="M12 15.5l3 3 5-5.5" fill="none" stroke="#0A1F44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 16V11a6 6 0 1112 0v5l2 2H4l2-2zM10 21h4"/></symbol>
  <symbol id="i-build" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 21V5l8-2v18M12 8l8 2v11M3 21h18M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2"/></symbol>

<script>
/*
 * ESQUEMA DE DATOS
 * Reemplazá buildDemoData() por la respuesta de tu motor. Cada empresa:
 * {
 *   id, name, cuit, sector, since (año de inicio),
 *   level:   0..4                 // 0 Bajo, 1 Medio, 2 Alto, 3 Muy alto, 4 Crítico
 *   history: [24 niveles mensuales 0..4, el último = nivel actual]
 *   drivers: [{label, effect:'agrava'|'mitiga', impact:1|2|3}]   // 3 = impacto alto
 *   events:  [{date:'YYYY-MM-DD', sev:'crit'|'high'|'mod'|'low', title, detail}]
 *   exposure: {balance, overdue, limit}   // en ARS, viene del ERP o lo carga el usuario
 *   monthlySales (ARS), sectorLevel (0..4, nivel más frecuente del sector),
 *   links: [{id, why}], owner
 * }
 * Límite sugerido, plazo y recomendación salen de LEVELS (tu política de crédito).
 */
(async () => {
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const fmt = (n, d=0) => n.toLocaleString('es-AR', {minimumFractionDigits:d, maximumFractionDigits:d});
  const ars = v => v >= 1e6 ? '$ ' + fmt(v/1e6, v >= 1e8 ? 0 : 1) + ' M' : '$ ' + fmt(Math.round(v/1e3)) + ' mil';
  const pct = (v, d=1) => fmt(v*100, d) + '%';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TODAY = new Date(2026, 9, 30);
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const monthLabel = i => { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - (23 - i), 1); return MES[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2); };
  const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return d + ' ' + MES[m-1] + ' ' + String(y).slice(2); };
  const daysAgo = s => Math.round((TODAY - new Date(s+'T00:00')) / 864e5);
  const ago = s => { const n = daysAgo(s); return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : n < 31 ? `hace ${n} d` : fmtDate(s); };

  /* ---------- risk levels = política de crédito ---------- */
  const LEVELS = [
    {name:'Bajo',     c:'var(--low)',   bg:'var(--low-bg)',   term:90, mult:2.0},
    {name:'Medio',    c:'var(--mod)',   bg:'var(--mod-bg)',   term:60, mult:1.2},
    {name:'Alto',     c:'var(--high)',  bg:'var(--high-bg)',  term:30, mult:0.6},
    {name:'Muy alto', c:'var(--vhigh)', bg:'var(--vhigh-bg)', term:15, mult:0.25},
    {name:'Crítico',  c:'var(--crit)',  bg:'var(--crit-bg)',  term:0,  mult:0},
  ];
  const RECO = [
    ['Mantener o ampliar', l => [`Podés ampliar el límite hasta ${ars(l)}`,'Plazo de hasta 90 días','Revisión trimestral']],
    ['Operar con seguimiento', l => [`Límite sugerido ${ars(l)}`,'Plazo máximo 60 días','Revisión mensual del saldo vencido']],
    ['Reducir exposición', l => [`Bajar el límite a ${ars(l)}`,'Plazo máximo 30 días','Pedir garantía o cheques de terceros']],
    ['Restringir crédito', l => [`Límite máximo ${ars(l)}`,'Plazo máximo 15 días','Garantía obligatoria','No liberar pedidos con saldo vencido']],
    ['Suspender crédito', () => ['Operar sólo de contado','Gestionar el cobro del saldo vencido','Evaluar acciones legales con tu abogado']],
  ];
  const SEV = {crit:['CRÍTICA','var(--crit)','var(--crit-bg)'], high:['ALTA','var(--vhigh)','var(--vhigh-bg)'], mod:['MEDIA','var(--mod)','var(--mod-bg)'], low:['MEJORA','var(--low)','var(--low-bg)']};
  const pill = L => `<span class="pill" style="color:${L.c};background:${L.bg}"><i></i>${L.name}</span>`;
  const sevPill = k => `<span class="pill" style="color:${SEV[k][1]};background:${SEV[k][2]}">${SEV[k][0]}</span>`;
  // d = cuántos niveles empeoró (+) o mejoró (−)
  const trend = (d, from) => d === 0 ? '<span class="delta flat">= Estable</span>'
    : d > 0 ? `<span class="delta down">▼ Empeoró${from!=null ? ' desde ' + LEVELS[from].name : ''}</span>`
            : `<span class="delta up">▲ Mejoró${from!=null ? ' desde ' + LEVELS[from].name : ''}</span>`;
  const meter = i => `<div class="meter5" aria-label="Nivel ${LEVELS[i].name}">${LEVELS.map((L,k) => `<div class="${k===i?'on':''}"><i style="background:${L.c}"></i>${L.name}</div>`).join('')}</div>`;
  const impact = n => `<span class="imp" aria-label="Impacto ${['','bajo','medio','alto'][n]}">${[1,2,3].map(k => `<i style="${k<=n?'background:currentColor':''}"></i>`).join('')}</span>`;

  /* ---------- demo data ---------- */
  function buildDemoData(){
    let seed = 20261030;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const W = [5,4,3,2,7,6,5,4,3,2];
    const cuit = () => { for(;;){ const b = '30' + String(Math.floor(rnd()*1e8)).padStart(8,'0'); let s=0; for (let i=0;i<10;i++) s += +b[i]*W[i]; let v = 11 - s%11; if (v===11) v=0; if (v!==10) return b + v; } };
    const fc = c => c.slice(0,2)+'-'+c.slice(2,10)+'-'+c.slice(10);
    // [nombre, sector, nivel actual, trayectoria, ventas mensuales ARS M]
    const base = [
      ['Supermercados del Litoral S.A.','Comercio minorista',0,'flat',96],
      ['Metalúrgica Andina S.R.L.','Industria metalúrgica',2,'down',38],
      ['Agroinsumos Pampeanos S.A.','Agro e insumos',1,'flat',74],
      ['Constructora Patagónica S.R.L.','Construcción',4,'shock',22],
      ['Frigorífico La Llanura S.A.','Alimentos',0,'up',58],
      ['Logística Río de la Plata S.A.','Logística',1,'down',31],
      ['Ferretería Industrial Mendoza S.A.','Comercio mayorista',0,'flat',19],
      ['Textil Riachuelo S.R.L.','Industria textil',3,'down',27],
      ['Química del Litoral S.A.','Industria química',1,'up',44],
      ['Distribuidora Cuyo Hnos. S.A.','Comercio mayorista',1,'flat',36],
      ['Panificadora San Telmo S.R.L.','Alimentos',0,'flat',9],
      ['Transportes Ruta 40 S.A.','Logística',3,'shock',17],
      ['Plásticos Avellaneda S.A.','Industria plástica',1,'flat',29],
      ['Cooperativa Agrícola Pergamino Ltda.','Agro e insumos',2,'down',63],
      ['Laboratorios Belgrano S.A.','Salud',0,'up',41],
      ['Electromecánica Rosario S.R.L.','Industria metalúrgica',1,'flat',24],
      ['Muebles del Delta S.R.L.','Industria maderera',3,'down',12],
      ['Bodegas Valle de Uco S.A.','Alimentos',0,'up',33],
      ['Servicios Petroleros Neuquén S.A.','Energía',1,'flat',85],
      ['Indumentaria Once S.R.L.','Comercio minorista',4,'shock',14],
      ['Envases Córdoba S.A.','Industria plástica',0,'flat',21],
      ['Molinos del Oeste S.A.','Alimentos',1,'down',47],
      ['Consultora Norte Digital S.A.S.','Servicios B2B',1,'up',8],
      ['Autopartes Lanús S.R.L.','Industria metalúrgica',2,'down',26],
    ];
    const NEG = ['Atrasos bancarios de más de 90 días','Cheques rechazados sin cancelar','Endeudamiento creciente en 6 meses','Proceso judicial comercial abierto','Cambio reciente de autoridades','Deuda concentrada en una entidad','Embargos registrados','Caída de actividad declarada'];
    const POS = ['Sin atrasos en 24 meses','Más de 10 años de actividad','Endeudamiento estable','Cumplimiento fiscal regular','Financiamiento diversificado','Crecimiento sostenido de actividad','Cheques rechazados cancelados'];
    const owners = ['María López','Juan Pérez','Sofía Gómez','Sin asignar'];
    const dateBack = months => { const d = new Date(TODAY); d.setDate(d.getDate() - Math.round(months*30.4)); return d.toISOString().slice(0,10); };
    const clamp = v => Math.max(0, Math.min(4, v));
    const shuffle = a => a.map(v => [rnd(), v]).sort((x,y) => x[0]-y[0]).map(v => v[1]);

    const list = base.map(([name, sector, level, traj, sales], id) => {
      // history of levels, built backwards from the current level
      const h = new Array(24); h[23] = level;
      const chg = traj === 'down' ? [22 - Math.floor(rnd()*2), 12 - Math.floor(rnd()*4)]
                : traj === 'up' ? [22 - Math.floor(rnd()*2), 10 - Math.floor(rnd()*4)]
                : traj === 'shock' ? [18 + Math.floor(rnd()*4)] : [];
      let cur = level;
      for (let i = 22; i >= 0; i--) {
        if (chg.includes(i + 1)) cur = traj === 'shock' ? clamp(cur - 2) : traj === 'down' ? clamp(cur - 1) : clamp(cur + 1);
        h[i] = cur;
      }
      const events = [];
      const firstChange = [...h.keys()].reverse().find(i => i > 0 && h[i] !== h[i-1]);
      if (traj === 'shock') {
        const m = h.findIndex((v,i) => i > 0 && v !== h[i-1]);
        events.push({date:dateBack(23 - m), sev:'crit', title:'Atrasos bancarios de más de 180 días', detail:`Pasó de riesgo ${LEVELS[h[m-1]].name} a ${LEVELS[h[m]].name} en un mes.`});
        events.push({date:dateBack(23 - m + 0.6), sev:'high', title:'3 cheques rechazados sin fondos', detail:'Rechazos por falta de fondos en los 30 días previos.'});
      }
      if (traj === 'down') {
        events.push({date:dateBack(23 - firstChange), sev: level >= 2 ? 'high' : 'mod', title:'Endeudamiento creció ' + (25 + Math.floor(rnd()*30)) + '% en 6 meses', detail:`Pasó de riesgo ${LEVELS[h[firstChange-1]].name} a ${LEVELS[h[firstChange]].name}.`});
        if (level >= 2) events.push({date:dateBack(rnd()*0.8), sev:'high', title:'2 cheques rechazados', detail:'Aún sin cancelar.'});
        events.push({date:dateBack(9 + rnd()*5), sev:'mod', title:'Cambio de autoridades publicado', detail:'Renuncia del presidente del directorio.'});
      }
      if (traj === 'up') {
        events.push({date:dateBack(23 - firstChange), sev:'low', title:'Regularizó su situación financiera', detail:`Bajó de riesgo ${LEVELS[h[firstChange-1]].name} a ${LEVELS[h[firstChange]].name}.`});
        events.push({date:dateBack(14 + rnd()*5), sev:'mod', title:'Atrasos de 31 a 90 días', detail:'Regularizados dentro del trimestre.'});
      }
      if (traj === 'flat') {
        events.push({date:dateBack(4 + rnd()*12), sev: level===0 ? 'low' : 'mod', title: level===0 ? 'Renovó autoridades sin cambios relevantes' : 'Leve aumento de endeudamiento', detail: level===0 ? 'Sin impacto en la calificación.' : 'Dentro del rango habitual del sector.'});
      }
      if (level === 4) events.push({date:dateBack(rnd()*0.4), sev:'crit', title:'Pedido de concurso preventivo', detail:'Publicado en el boletín de edictos.'});
      events.sort((a,b) => b.date.localeCompare(a.date));

      const nNeg = [1,2,3,4,5][level], nPos = [5,3,2,1,1][level];
      const drivers = [
        ...shuffle(NEG).slice(0, nNeg).map((label,i) => ({label, effect:'agrava', impact: i === 0 && level >= 2 ? 3 : i < 2 && level >= 1 ? 2 : 1 + (rnd() > .6 ? 1 : 0)})),
        ...shuffle(POS).slice(0, nPos).map((label,i) => ({label, effect:'mitiga', impact: i === 0 && level <= 1 ? 3 : 1 + (rnd() > .5 ? 1 : 0)})),
      ];

      const salesM = sales * 1e6;
      const balance = Math.round(salesM * (0.35 + rnd()*0.9) / 1e5) * 1e5;
      const overdueShare = [0.02, 0.06, 0.15, 0.28, 0.48][level] * (0.5 + rnd());
      return {
        id: 'c' + (id + 1), name, cuit: fc(cuit()), sector, since: 1975 + Math.floor(rnd()*46),
        level, history: h, drivers, events,
        exposure: {balance, overdue: Math.round(balance * overdueShare / 1e5) * 1e5, limit: Math.round(salesM * (0.8 + rnd()*0.8) / 1e6) * 1e6},
        monthlySales: salesM, sectorLevel: rnd() > .5 ? 1 : (rnd() > .5 ? 0 : 2),
        links: [], owner: owners[Math.floor(rnd()*owners.length)],
      };
    });
    const link = (a,b,why) => { list[a].links.push({id:list[b].id, why}); list[b].links.push({id:list[a].id, why}); };
    link(1, 23, 'Comparten socio mayoritario');
    link(3, 16, 'Mismo domicilio fiscal');
    link(7, 19, 'Comparten directores');
    return list;
  }

  /* ---------- derived ---------- */
  function derive(c){
    c.L = LEVELS[c.level];
    c.prev30 = c.history[22]; c.prev90 = c.history[20];
    c.d30 = c.level - c.prev30; c.d90 = c.level - c.prev90;
    c.suggested = Math.round(c.monthlySales * c.L.mult / 1e5) * 1e5;
    c.lastEvent = c.events[0] || null;
    return c;
  }
  /* Si existe datos.json (salida de `npm run lote -- clientes.csv --salida ../datos.json` en engine/), el panel muestra esos datos. */
  function fromEngine(rows){
    return rows.map((r, i) => ({
      id: 'c' + (i + 1), name: r.name, cuit: r.cuit, sector: r.sector || 'Sin sector', since: r.since || '—',
      level: r.level, history: r.history, drivers: r.drivers.map(d => ({label:d.label, effect:d.effect, impact:d.impact})),
      events: r.events.map(e => ({date:e.date, sev:e.sev, title:e.title, detail:e.detail})),
      exposure: r.exposure || {balance:0, overdue:0, limit:0},
      monthlySales: (r.exposure && (r.exposure.monthlySales || r.exposure.limit)) || 0,
      sectorLevel: r.level, links: [], owner: 'Sin asignar',
    }));
  }
  async function loadData(){
    try { const res = await fetch('datos.json', {cache:'no-store'}); if (res.ok) { const rows = await res.json(); if (Array.isArray(rows) && rows.length) return fromEngine(rows); } } catch {}
    return buildDemoData();
  }
  const DATA = (await loadData()).map(derive);
  const byId = Object.fromEntries(DATA.map(c => [c.id, c]));
  const ALL_EVENTS = DATA.flatMap(c => c.events.map(e => ({...e, c}))).sort((a,b) => b.date.localeCompare(a.date));
  const open30 = ALL_EVENTS.filter(e => daysAgo(e.date) <= 30 && e.sev !== 'low');
  $('#nav-badge').textContent = open30.length;

  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem('centinel:' + k)); } catch { return null; } },
    set(k,v){ try { localStorage.setItem('centinel:' + k, JSON.stringify(v)); return true; } catch { return false; } },
  };
  const toastEl = $('#toast'); let toastT;
  const toast = msg => { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 3200); };
  document.addEventListener('click', e => { const t = e.target.closest('[data-toast]'); if (t) toast(t.dataset.toast); });

  function tooltip(container){
    const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; container.appendChild(tip);
    return {
      show(html, x, y){ tip.innerHTML = html; tip.hidden = false; const w = container.clientWidth; const tw = tip.offsetWidth; tip.style.left = Math.max(tw/2, Math.min(w - tw/2, x)) + 'px'; tip.style.top = y + 'px'; },
      hide(){ tip.hidden = true; },
    };
  }

  /* Shared hover layer for line-type charts: crosshair + dot + tooltip. */
  function hoverLayer(el, n, P, iw, x, yAt, tipHtml){
    const tip = tooltip(el), hov = $('.hov', el), ln = $('line', hov), dot = $('circle', hov);
    const move = ev => {
      const r = el.getBoundingClientRect();
      const i = Math.max(0, Math.min(n-1, Math.round((ev.clientX - r.left - P.l) / iw * (n-1))));
      hov.setAttribute('visibility','visible');
      ln.setAttribute('x1', x(i)); ln.setAttribute('x2', x(i));
      dot.setAttribute('cx', x(i)); dot.setAttribute('cy', yAt(i));
      tip.show(tipHtml(i), x(i), yAt(i));
    };
    const hit = $('.hit', el);
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { hov.setAttribute('visibility','hidden'); tip.hide(); });
  }
  const HOV = top => `<g class="hov" visibility="hidden"><line y1="${top.t}" y2="${top.b}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/><circle r="5" fill="var(--paper)" stroke="var(--navy)" stroke-width="2"/></g>`;

  /* Area line for money over 12 months (single series). */
  function moneyChart(el, values, label, tipHtml){
    const W = Math.max(280, el.clientWidth), H = 220, P = {l:44, r:26, t:14, b:28};
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const max = Math.ceil(Math.max(...values) / 5e7) * 5e7 || 1;
    const x = i => P.l + i * iw / (values.length - 1), y = v => P.t + ih - v / max * ih;
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
    [0,.25,.5,.75,1].forEach(t => { const v = t*max; s += `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end">${v ? fmt(v/1e6,0)+' M' : '0'}</text>`; });
    values.forEach((_,i) => { if (i % 2 === 1) s += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${label(i)}</text>`; });
    const path = values.map((v,i) => (i?'L':'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    s += `<path d="${path} L${x(values.length-1)} ${P.t+ih} L${x(0)} ${P.t+ih} Z" fill="var(--vhigh)" opacity=".08"/>`;
    s += `<path d="${path}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round"/>`;
    s += `<circle cx="${x(values.length-1)}" cy="${y(values[values.length-1])}" r="5" fill="var(--navy)" stroke="var(--paper)" stroke-width="2"/>`;
    s += HOV({t:P.t, b:P.t+ih}) + `<rect x="${P.l}" y="0" width="${iw}" height="${H}" fill="transparent" class="hit"/></svg>`;
    el.innerHTML = s; el.classList.add('chart');
    hoverLayer(el, values.length, P, iw, x, i => y(values[i]), tipHtml);
  }

  /* Step chart of the risk level over 24 months: one row per level, Bajo on top. */
  function levelChart(el, levels, markers, tipHtml){
    const W = Math.max(280, el.clientWidth), H = 230, P = {l:70, r:26, t:10, b:28};
    const iw = W - P.l - P.r, ih = H - P.t - P.b, rh = ih / 5;

    const h = location.hash.slice(1) || 'cartera';
    let navKey = 'cartera';
    if (h.startsWith('empresa-') && byId[h.slice(8)]) { companyView(byId[h.slice(8)]); navKey = 'empresas'; }
    else if (h === 'alertas') { alertsView(); navKey = 'alertas'; }
    else if (h === 'empresas') { portfolioView(); requestAnimationFrame(() => $('#tabla').scrollIntoView({block:'start'})); navKey = 'empresas'; }
    else portfolioView();
    $$('[data-nav]').forEach(a => a.dataset.nav === navKey ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
    if (h !== 'empresas') window.scrollTo(0, 0);
  }
  addEventListener('hashchange', route);
  let rt, lastW = innerWidth;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (Math.abs(innerWidth - lastW) < 40) return; lastW = innerWidth; const y = scrollY; route(); window.scrollTo(0, y); }, 200); });

  $('#q').addEventListener('input', e => {
    state.q = e.target.value.trim();
    if (!$('#rows')) { location.hash = 'cartera'; }
    renderRows();
  });
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const r = rowsFor(); if (r.length === 1) location.hash = 'empresa-' + r[0].id; } });

  route();
})();
</script>
</body>
</html>
